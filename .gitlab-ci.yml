workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

stages: [build, verify]

default:
  image: docker.io/library/rust:1.99.1-trixie@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
  tags: [yss-linux]

variables:
  GIT_DEPTH: "0"
  YSS_GITLAB_CA_FILE: /etc/gitlab-runner/certs/gitlab.yss.test.crt
  YSS_GITLAB_CI_AUTH: "1"

build-cli:
  stage: build
  rules:
    - when: on_success
  script:
    - |
      set -eu
      test "$CI_SERVER_URL" = https://gitlab.yss.test:9443
      test "$YSS_GITLAB_CI_AUTH" = 1
      test "$YSS_GITLAB_CA_FILE" = /etc/gitlab-runner/certs/gitlab.yss.test.crt
      test -s "$YSS_GITLAB_CA_FILE"
      test -n "$CI_JOB_TOKEN"
      rustc --version
      git --version
      test "$(rustc --version | cut -d ' ' -f 2)" = 1.99.1
      git_version=$(git --version | cut -d ' ' -f 3)
      test "$(printf '%s\n' 2.44.0 "$git_version" | sort -V | head -n 1)" = 2.44.0
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
      export GIT_CONFIG_COUNT=1
      export GIT_CONFIG_KEY_0=http.followRedirects GIT_CONFIG_VALUE_0=false
      python3 -I - <<'PYCODE'
      import json, os, re, ssl, urllib.request
      origin = "https://gitlab.yss.test:9443"
      project = "yss/yss-spec-project-template"
      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, *args, **kwargs):
              return None
      def unique_fields(pairs):
          result = {}
          for key, value in pairs:
              if key in result:
                  raise ValueError("duplicate job metadata field")
              result[key] = value
          return result
      try:
          job_id = os.environ["CI_JOB_ID"]
          commit = os.environ["CI_COMMIT_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", job_id) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise ValueError("invalid tested job identity")
          context = ssl.create_default_context(cafile=os.environ["YSS_GITLAB_CA_FILE"])
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect(), urllib.request.HTTPSHandler(context=context))
          endpoint = origin + "/api/v4/job"
          req = urllib.request.Request(endpoint, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
          with opener.open(req, timeout=30) as response:
              if response.status != 200 or response.geturl() != endpoint:
                  raise ValueError("unexpected job response")
              raw = response.read(262145)
          if len(raw) > 262144:
              raise ValueError("job metadata too large")
          record = json.loads(raw, object_pairs_hook=unique_fields)
          if type(record["id"]) is not int or record["id"] != int(job_id):
              raise ValueError("job ID mismatch")
          if record["web_url"] != origin + "/" + project + "/-/jobs/" + job_id:
              raise ValueError("job project URL mismatch")
          pipeline = record["pipeline"]
          if type(pipeline["project_id"]) is not int or pipeline["project_id"] <= 0 or pipeline["sha"] != commit:
              raise ValueError("tested pipeline identity mismatch")
      except Exception:
          raise SystemExit("Fixed GitLab job identity/CA/auth not ready; no fallback") from None
      PYCODE
      git init "$work/source"
      git -C "$work/source" remote add origin https://github.com/iloveZzz/yss-cli.git
      git -C "$work/source" fetch --depth 1 origin refs/tags/v3.1.0
      git -C "$work/source" checkout --detach FETCH_HEAD
      test "$(git -C "$work/source" rev-parse HEAD)" = 55df5179e79572bfa0b7b6a72f541c511eb80030
      git -C "$work/source" rev-parse HEAD > "$work/source-commit.txt"
      cmp .agents/skills/setup-yss-harness/SKILL.md .workbuddy/skills/setup-yss-harness/SKILL.md
      cmp .agents/skills/release-yss-cli/SKILL.md .workbuddy/skills/release-yss-cli/SKILL.md
      cmp .agents/skills/setup-yss-harness/SKILL.md profiles/backend/.workbuddy/skills/setup-yss-harness/SKILL.md
      test "$(readlink .claude/skills/setup-yss-harness)" = ../../.agents/skills/setup-yss-harness
      test "$(readlink .claude/skills/release-yss-cli)" = ../../.agents/skills/release-yss-cli
      python3 -I - <<'PYCODE'
      import hashlib, json, pathlib
      root = pathlib.Path(".agents/skills/setup-yss-harness")
      digest = hashlib.sha256()
      for item in sorted(root.rglob("*")):
          if item.is_file():
              digest.update(item.relative_to(root).as_posix().encode() + b"\0" + item.read_bytes().replace(b"\r\n", b"\n") + b"\0")
      lock = json.loads(pathlib.Path("profiles/backend/skills-lock.json").read_text())
      assert lock["skills"]["shared"]["setup-yss-harness"]["effectiveHash"] == digest.hexdigest()
      PYCODE
      template_root=$PWD
      cd "$work/source"
      cargo run --locked --bin yss-bundle -- --source-root "$template_root" --out assets/bundle.tar.gz > "$work/bundle.json"
      mkdir -p "$CI_PROJECT_DIR/ci-build" "$CI_PROJECT_DIR/ci-report/build"
      cp "$work/source-commit.txt" "$work/bundle.json" "$CI_PROJECT_DIR/ci-report/build/"
      cargo build --locked --release --bin yss
      cp target/release/yss "$CI_PROJECT_DIR/ci-build/yss"
      uname -m > "$CI_PROJECT_DIR/ci-build/architecture"
      "$CI_PROJECT_DIR/ci-build/yss" version --json > "$CI_PROJECT_DIR/ci-report/build/version.json"
      "$CI_PROJECT_DIR/ci-build/yss" help > "$CI_PROJECT_DIR/ci-report/build/help.txt"
      python3 -I - <<'PYCODE'
      import json, os, pathlib
      report = pathlib.Path(os.environ["CI_PROJECT_DIR"]) / "ci-report/build"
      bundle = json.loads((report / "bundle.json").read_text())
      version = json.loads((report / "version.json").read_text())
      assert bundle["source"]["commit"] == os.environ["CI_COMMIT_SHA"]
      assert version["status"] == "ok" and version["result"]["version"] == "3.1.0"
      assert version["result"]["source"]["commit"] == "55df5179e79572bfa0b7b6a72f541c511eb80030"
      assert version["result"]["bundleDigest"] == bundle["sha256"]
      PYCODE
  artifacts:
    when: always
    paths: [ci-build/, ci-report/build/]
    expire_in: 7 days

verify-projects:
  stage: verify
  needs: [build-cli]
  rules:
    - when: on_success
  script:
    - |
      set -eu
      work=$(mktemp -d)
      work=$(realpath "$work")
      trap 'rm -rf "$work"' EXIT
      yss="$CI_PROJECT_DIR/ci-build/yss"
      test "$(uname -m)" = "$(cat "$CI_PROJECT_DIR/ci-build/architecture")" || { echo 'Runner architecture differs from build-cli' >&2; exit 1; }
      report="$CI_PROJECT_DIR/ci-report/projects"
      mkdir -p "$report"
      for profile in spec backend; do
        for installation in skills project; do
          name="$profile-$installation"
          root="$work/$name"
          "$yss" init --root "$root" --profile "$profile" --installation "$installation" --dry-run --json > "$report/$name-preview.json"
          test ! -e "$root"
          "$yss" init --root "$root" --profile "$profile" --installation "$installation" --json > "$report/$name-init.json"
          test -f "$root/.yss/project.json"
          test -f "$root/.agents/skills/setup-yss-harness/SKILL.md"
          "$yss" skills list --root "$root" --json > "$report/$name-skills.json"
          "$yss" sync --root "$root" --dry-run --json > "$report/$name-sync-preview.json"
          "$yss" sync --root "$root" --json > "$report/$name-sync.json"
          "$yss" doctor --root "$root" --json > "$report/$name-doctor.json"
        done
      done
      mkdir "$work/existing"
      printf '%s\n' 'keep my files' > "$work/existing/note.txt"
      "$yss" attach --root "$work/existing" --profile backend --installation skills --json > "$report/attach.json"
      "$yss" skills ensure yss-validation --root "$work/existing" --json > "$report/ensure.json"
      test "$(cat "$work/existing/note.txt")" = 'keep my files'
      conflict="$work/conflict/.agents/skills/setup-yss-harness/SKILL.md"
      mkdir -p "$(dirname "$conflict")"
      printf '%s\n' 'user-owned content' > "$conflict"
      if "$yss" attach --root "$work/conflict" --profile backend --installation skills --json > "$report/attach-conflict.json"; then
        echo 'attach unexpectedly replaced an existing file' >&2
        exit 1
      fi
      test "$(cat "$conflict")" = 'user-owned content'
      test ! -e "$work/conflict/.yss/project.json"
      python3 -I - "$report/attach-conflict.json" <<'PYCODE'
      import json, sys
      result = json.load(open(sys.argv[1]))
      assert result["status"] == "error" and result["error"]["code"] == "CONFLICT"
      PYCODE
  artifacts:
    when: always
    paths: [ci-report/projects/]
    expire_in: 7 days

verify-scaffolds:
  stage: verify
  needs: [build-cli]
  rules:
    - when: on_success
  script:
    - |
      set -eu
      work=$(mktemp -d)
      work=$(realpath "$work")
      trap 'rm -rf "$work"' EXIT
      yss="$CI_PROJECT_DIR/ci-build/yss"
      test "$(uname -m)" = "$(cat "$CI_PROJECT_DIR/ci-build/architecture")" || { echo 'Runner architecture differs from build-cli' >&2; exit 1; }
      report="$CI_PROJECT_DIR/ci-report/scaffolds"
      mkdir -p "$report"
      "$yss" scaffold catalog --json > "$report/catalog.json"
      for kind in ddd mvc; do
        set -- --project-name "sample-$kind" --base-package com.example.sample --output-dir "$work" \
          --platform-profile spring-boot-3.5-jdk17 --spring-boot-version 3.5.16 --java-version 17 \
          --group-id com.example --project-version 1.0.0-SNAPSHOT --parent-group-id com.yss.cloud \
          --parent-artifact-id yss-cloud-microservice --parent-version 3.2.0-SNAPSHOT --yss-components-version 3.2.0-SNAPSHOT
        "$yss" scaffold "$kind" "$@" --dry-run --json > "$report/$kind-preview.json"
        test ! -e "$work/sample-$kind"
        "$yss" scaffold "$kind" "$@" --json > "$report/$kind.json"
        test -f "$work/sample-$kind/pom.xml"
        test -f "$work/sample-$kind/mvnw"
        test -f "$work/sample-$kind/.yss/scaffold.json"
      done
  artifacts:
    when: always
    paths: [ci-report/scaffolds/]
    expire_in: 7 days
