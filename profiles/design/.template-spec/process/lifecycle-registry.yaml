schema_version: 1
registry_id: yss.lifecycle
status: active
description: 战略设计 Harness 的活动生命周期结构化事实源；profile 只路由业务方案设计工作单元， 下游兼容 ID 保留用于交接引用，不授权本仓执行技术设计或实现。
id_policy:
  pattern: ^(stage|gate|check|artifact|work-unit|evidence)\.[a-z0-9][a-z0-9-]*$
  published_ids_immutable: true
  baseline: .template-spec/process/lifecycle-registry-baseline.json
  deprecated_ids:
    - artifact.discovery-record
    - gate.architecture-reviewed
    - gate.design-reviewed
    - gate.domain-strategy-approved
    - gate.engineering-baseline-accepted
    - gate.frontend-implementation-verified
    - gate.openapi-draft-reviewed
    - gate.openapi-frozen
    - gate.prototype-reviewed
    - gate.prototype-verified
    - gate.release-ready
    - gate.repository-identity-valid
    - gate.slice-contract-approved
    - gate.slice-ready-for-agent
    - gate.stage-decision-package-approved
    - gate.user-confirmation
    - stage.discovery
    - work-unit.discovery-opportunity
    - work-unit.discovery-requirements
    - work-unit.fresh-verification
    - work-unit.independent-review
stages:
  - id: stage.entry-triage
    name: 入口分诊
    goal: 确认仓库身份、问题范围和影响面。
    exit_criteria: yss-project.yaml 合法，影响面和最近可信阶段可解释。
  - id: stage.plan
    name: Plan（战略规划）
    goal: 确认目标、业务边界、关键规则、MVP / 非目标、优先级和交接责任，为 Spec 提供战略输入；按影响面探索并复用仍有效的结论。
    exit_criteria: 命中的业务边界与阶段决策检查通过，用户统一批准当前 Plan；关键问题已解决，非关键项有责任人、解决时点和接收方；下游可进入 Spec，不代表可实现。
    spec_entry:
      required_checks:
        - goals
        - scope_and_priority
        - boundaries_and_rules
        - open_questions
        - handoff
        - context_reconciliation
        - grill_exit
      gate_impacts:
        gate.plan-approved: plan
      check_impacts:
        check.domain-strategy-approved: domain_strategy
        check.stage-decision-package-approved: stage_decision
  - id: stage.spec-architecture
    name: Spec / 功能架构
    goal: 固化解决方案和功能边界。
    exit_criteria: Spec 基线和功能边界可审查。
  - id: stage.product-design
    name: 产品设计
    goal: 在存在产品设计影响时校准页面流和状态。
    exit_criteria: 命中的设计门禁通过；未命中项记录 not-applicable 及原因。
  - id: stage.system-data-engineering
    name: 系统 / 数据架构与工程契约
    goal: 固化系统、数据、工程基线和 API 契约。
    exit_criteria: 受影响工程契约冻结或记录无 API 影响；required 脚手架证据齐全。
  - id: stage.ticket-formalization
    name: Ticket 正式化
    goal: 在既有功能追踪入口下，将冻结范围正式化为垂直切片。
    exit_criteria: 工作单元窄、依赖清晰、验收和测试 seam 可执行。
  - id: stage.vertical-slice-implementation
    name: 垂直切片实现
    goal: 以批准合同驱动 TDD 实现和跨仓库协作。
    exit_criteria: 允许写路径、禁止模式、证据和验证命令全部满足。
  - id: stage.verification-release-retrospective
    name: 验证 / 发布 / 复盘
    goal: 完成 fresh verification、发布和回顾。
    exit_criteria: 所有命中门禁通过，人工审查点已完成，checkpoint 可追溯。
evidence:
  - id: evidence.context-reconciliation
    name: Context Reconciliation 证据
    description: 工作单元在批准或流转前对根目录唯一 CONTEXT.md 的稳定术语回写、作用域解析和双摘要核对结果；不新增门禁。
  - id: evidence.impact-assessment
    name: 影响面分析记录
    description: 受影响仓库、资产、风险与最近可信阶段。
  - id: evidence.domain-strategy-review
    name: DDD 战略设计评审证据
    description: 子域、限界上下文、统一语言、Context Map、场景和不变量的结构化评审结果。
    public_name: 业务边界与规则评审证据
    public_description: 业务板块、业务责任区、统一业务词汇、协作与交接关系、关键场景和不可违反规则的结构化评审结果。
  - id: evidence.tactical-design-review
    name: DDD 战术设计评审证据
    description: 聚合、Entity、Value Object、不变量、状态机、一致性、Gateway 与 API 隔离的结构化评审结果。
  - id: evidence.stage-decision-package
    name: 阶段决策包验证证据
    description: 阶段决策包的 Schema、引用、语义一致性、影响传播和下游消费验证结果。
  - id: evidence.strategic-design-handoff
    name: 战略设计交付包验证证据
    description: Strategic Design Handoff 的来源 digest、业务级 Ticket、下游 Tactical DDD 问题和交付完整性验证结果。
    public_name: 业务方案交接包验证证据
    public_description: 业务方案交接包的来源 digest、业务级 Ticket、研发待决问题和交付完整性验证结果。
  - id: evidence.maintenance-intensity-checkpoint
    name: 模板维护强度 checkpoint
    description: template-source 变更的 L1 / L2 / L3 分级、触发项、最低验证证据、review 模式和升级记录。
    public_description: 当前 template-source 按 maintenance-intensity.yaml 的 L1 / L2 分级，记录触发项、最低验证证据、review 模式和升级依据。
  - id: evidence.repository-identity-check
    name: 仓库身份校验结果
    description: yss-project.yaml 的合法性与 repository_mode 裁决。
  - id: evidence.approval-record
    name: 人工批准记录
    description: 对需要人工批准的 Spec、设计、契约或发布裁决的可追溯记录。
  - id: evidence.design-review-result
    name: 设计审查结果
    description: API、架构或产品设计审查意见及处理结果。
  - id: evidence.prototype-review-result
    name: 原型评审结果
    description: 低保真页面、流程、状态与 API 反推的独立评审结论和阻断项。
  - id: evidence.antd-cli-validation
    name: Ant Design CLI 校验证据
    description: 设计语言、组件、demo、token、semantic 与 lint 的实际 CLI/目标版本和可读输出引用。
  - id: evidence.browser-prototype-verification
    name: 浏览器原型验证证据
    description: 高保真原型的非空渲染、主流程、异常状态、视口和控制台验证记录。
  - id: evidence.prototype-confirmation
    name: 原型用户确认记录
    description: 高保真原型、验证清单和进入下游阶段范围的人工确认结论。
  - id: evidence.openapi-draft-review
    name: OpenAPI Draft 审查记录
    description: P0、错误、分页、幂等和契约测试审查记录。
  - id: evidence.contract-approval
    name: Slice 合同批准记录
    description: 生命周期编排器批准且已持久化的当前版本合同引用。
  - id: evidence.yss-skill-execution-result
    name: YSS Skill Execution Result
    description: 专项 skill 的合同版本、写入、验证、延期 seam 与偏离证据。
  - id: evidence.frontend-implementation-verification
    name: 前端实现还原验证证据
    description: UI 实现相对冻结原型和 Spec 的桌面/窄屏视觉、状态、交互、控制台与 pnpm 验证记录。
  - id: evidence.fresh-verification
    name: Fresh Verification 记录
    description: 本轮实际执行的验证命令、结果和时间。
  - id: evidence.checkpoint-and-rollback
    name: Checkpoint 与回滚点
    description: 可追溯的变更边界、发布记录和恢复动作。
gates:
  - id: gate.plan-approved
    name: Plan 批准
    stage: stage.plan
    trigger: Plan 结论进入 Spec；汇总业务边界与阶段决策检查，核验当前规划范围的原始批准。
    evidence:
      - evidence.approval-record
    requires_checks:
      - check.domain-strategy-approved
      - check.stage-decision-package-approved
  - id: gate.spec-baseline-approved
    name: Spec 基线批准
    stage: stage.spec-architecture
    trigger: 新功能、行为变化或范围扩大进入 Spec 基线。
    evidence:
      - evidence.approval-record
  - id: gate.product-design-approved
    name: 产品设计批准
    stage: stage.product-design
    trigger: 存在产品设计影响；原型评审与交付物验证通过后，由当前真实负责人确认体验取舍。
    evidence:
      - evidence.prototype-confirmation
    requires_checks:
      - check.prototype-reviewed
      - check.prototype-verified
  - id: gate.strategic-design-handoff-approved
    name: 战略设计交付验收
    stage: stage.ticket-formalization
    trigger: 业务方案、Spec、适用 UI 依据和业务级 Ticket 已批准且版本当前，需要形成可验证的 Handoff v5 交付下游研发。
    public_name: 业务方案交接验收
    public_trigger: 业务方案设计已完成，需要形成完整、可验证且可接收的交付包。
    evidence:
      - evidence.strategic-design-handoff
      - evidence.approval-record
      - evidence.fresh-verification
    requires_gates:
      - gate.plan-approved
      - gate.spec-baseline-approved
      - gate.product-design-approved
artifacts:
  - id: artifact.impact-assessment
    name: 影响面分析
    stage: stage.entry-triage
    trigger: 每次变更。
  - id: artifact.domain-strategy
    name: DDD 战略设计
    stage: stage.plan
    trigger: 新产品/模块、跨上下文功能、统一语言冲突、服务边界或核心规则变化。
    public_name: 业务边界与规则设计
    public_trigger: 新产品/模块、跨责任区协作、业务词汇冲突、责任边界或关键规则变化。
  - id: artifact.stage-decision-package
    name: 阶段决策包
    stage: stage.plan
    trigger: Plan 到 Spec 入口需要结构化上游决策。
    public_name: 方案决策包
  - id: artifact.strategic-design-handoff
    name: Strategic Design Handoff
    stage: stage.ticket-formalization
    trigger: 业务上游 Harness 完成战略设计、Spec、页面原型和业务级 Ticket，需要交付下游研发团队进行 Tactical DDD。
    public_name: 业务方案交接包
    public_trigger: 业务方案设计 Harness 完成业务边界与规则设计、Spec、页面原型和业务级 Ticket，需要交付下游研发团队。
  - id: artifact.plan-record
    name: Plan 记录
    stage: stage.plan
    trigger: 新问题或边界不清。
  - id: artifact.spec
    name: Spec
    stage: stage.spec-architecture
    trigger: 新功能、行为变化或范围扩大。
  - id: artifact.product-overview
    name: 产品总体设计
    stage: stage.spec-architecture
    trigger: 进入 Spec 基线。
  - id: artifact.functional-architecture
    name: 功能架构
    stage: stage.spec-architecture
    trigger: 新模块或跨边界变化。
  - id: artifact.interaction-spec
    name: 交互说明
    stage: stage.product-design
    trigger: 命中产品设计影响。
  - id: artifact.low-fidelity-prototype
    name: 低保真原型
    stage: stage.product-design
    trigger: 命中产品设计影响。
  - id: artifact.state-matrix
    name: 状态矩阵
    stage: stage.product-design
    trigger: 存在状态流转、异常或恢复。
  - id: artifact.high-fidelity-html-prototype
    name: 高保真 HTML 原型
    stage: stage.product-design
    trigger: 需要视觉与交互校准。
  - id: artifact.prototype-review
    name: 原型评审记录
    stage: stage.product-design
    trigger: 命中 check.prototype-reviewed。
  - id: artifact.prototype-confirmation
    name: 原型确认记录
    stage: stage.product-design
    trigger: 命中 gate.product-design-approved。
  - id: artifact.openapi-draft
    name: OpenAPI Draft
    stage: stage.system-data-engineering
    trigger: 有 API 影响。
  - id: artifact.openapi-freeze-record
    name: OpenAPI Freeze 记录
    stage: stage.system-data-engineering
    trigger: API 进入实现。
  - id: artifact.data-architecture
    name: 数据架构
    stage: stage.system-data-engineering
    trigger: 数据模型、存储或一致性变化。
  - id: artifact.engineering-baseline
    name: 工程基线记录
    stage: stage.system-data-engineering
    trigger: 后端、前端或高风险工程变化。
  - id: artifact.architecture-review
    name: 架构审查记录
    stage: stage.system-data-engineering
    trigger: 高风险或跨边界变化。
  - id: artifact.tactical-design
    name: DDD 战术设计
    stage: stage.system-data-engineering
    trigger: 聚合边界、状态机、一致性或持久化映射复杂到无法在系统概要设计的 Tactical DDD Check 中清楚表达。
  - id: artifact.spec-delta
    name: Spec Delta
    stage: stage.spec-architecture
    trigger: 已有冻结 Spec 的高风险行为变化。
  - id: artifact.parent-ticket
    name: 功能父 Ticket
    stage: stage.plan
    trigger: 每个功能首次进入 Plan 或最近可信接入阶段时建立，正式化时复用；Design profile 不创建工程父 Ticket。
  - id: artifact.vertical-slice-ticket
    name: 垂直切片 Ticket
    stage: stage.ticket-formalization
    trigger: 进入实现前。
  - id: artifact.slice-implementation-contract
    name: Slice Implementation Contract
    stage: stage.ticket-formalization
    trigger: Agent 进入实现。
  - id: artifact.frontend-implementation-plan
    name: 前端实现还原计划
    stage: stage.ticket-formalization
    trigger: UI 影响切片提升 ready-for-agent 前。
  - id: artifact.frontend-implementation-verification
    name: 前端实现还原验证记录
    stage: stage.verification-release-retrospective
    trigger: UI 影响切片完成实现并准备合并、发布或阶段完成。
  - id: artifact.business-ticket-set
    name: 业务级 Ticket 集
    stage: stage.ticket-formalization
    trigger: 产品角色需要将已批准的 Spec 和原型拆成业务能力、用户行为和验收级 Ticket。
  - id: artifact.retrospective
    name: 复盘记录
    stage: stage.verification-release-retrospective
    trigger: 发布后或阶段性完成后满足复盘触发条件。
work_units:
  - id: work-unit.entry-triage
    name: 入口分诊
    scope: template-source
    input: 用户请求、仓库身份。
    output: 影响面与最近可信阶段。
    completion: 身份和影响面可解释。
  - id: work-unit.ssot-update
    name: 单一事实源更新
    scope: template-source
    input: 变更合同。
    output: 权威文档或脚本。
    completion: 其他投影可由脚本生成。
  - id: work-unit.skill-projection-sync
    name: 技能投影同步
    scope: template-source
    input: .agents/skills。
    output: Agent root 投影、skills lock。
    completion: --check 通过。
  - id: work-unit.template-snapshot-build
    name: 模板快照构建
    scope: template-source
    input: 固定模板 commit。
    output: CLI bundled snapshot。
    completion: commit 与 tree hash 可追踪。
  - id: work-unit.attach-sync-integration
    name: attach / sync 集成
    scope: template-source
    input: 目标仓库、dry-run 计划。
    output: 受管资产和 metadata。
    completion: 验证通过或完整回滚。
  - id: work-unit.intensity-aware-verification
    name: 分级 Fresh verification
    scope: template-source
    input: 变更仓库、强度分级与对应最低证据。
    output: 命令输出与证据。
    completion: L1 相关检查、L2 最小反例与 fresh verification、L3 完整 RED / GREEN / REFACTOR 与 fresh verification 按命中等级通过。
    public_completion: 日常按当前影响及依赖完成分级证据：L1 相关实际检查，L2 最小反例、自检和 Fresh Verification，L3 自检和 Fresh Verification；仅命中风险触发项补定向反例。等级不强制完整套件；main 集成验证和正式发布另核验完整适用集合。
  - id: work-unit.intensity-aware-review
    name: 分级审查
    scope: template-source
    input: 变更 diff、强度分级与验证证据。
    output: L1 self-check / 人工 checkpoint、L2 聚焦独立审查或 L3 正式独立审查结论。
    public_output: 维护者自检结论与阻断项；按需记录独立审查结果。
    completion: 已按命中等级完成审查且无未处理阻断项；L1 不强制独立 reviewer。
    public_completion: 日常完成维护者自检并处理适用阻断项；L2/L3 不自动要求独立审查或冻结候选，明确采用独立审查路径时执行其严格合同。
  - id: work-unit.release-and-rollback
    name: 发布与回滚
    scope: template-source
    input: 已审查 commit。
    output: release note、观察信号、回滚点。
    completion: 两仓库顺序和恢复动作明确。
  - id: work-unit.plan-opportunity
    name: 机会调研
    scope: project-instance
    input: 用户问题、市场/竞品事实需求和现有上下文。
    output: Plan 机会结论、证据、替代方案和关键假设。
    completion: 机会继续/停止建议可审查；事实已 research 或记录为假设。
  - id: work-unit.plan-requirements
    name: 需求分析
    scope: project-instance
    input: 机会结论、用户反馈和领域词汇。
    output: 用户、MVP、非目标、成功标准、测试 seam 和未决项。
    completion: frontier 清空；用户确认；无 runnable blocker。
  - id: work-unit.domain-strategy-design
    name: DDD 战略设计
    scope: project-instance
    input: 已澄清的业务场景、领域词汇、约束和现有上下文。
    output: 子域、限界上下文、Context Map、统一语言、事件、核心领域概念候选和不变量。
    completion: 边界、语义方向、规则所有权和关键场景可审查；无未解释冲突。
    public_name: 业务边界与协作梳理
    public_input: 已澄清的业务故事、业务词汇、约束和现有协作关系。
    public_output: 业务板块、业务责任区、协作与交接关系、统一业务词汇、已发生的业务事实、待确认的关键业务对象和不可违反的业务规则。
  - id: work-unit.stage-decision
    name: 阶段决策包综合
    scope: project-instance
    input: Plan、DDD 战略设计、产品和商务输入。
    output: 带版本、digest、证据和下游映射的阶段决策包。
    completion: 必填字段、引用、影响面和下游消费验证通过；批准门禁完成。
    public_name: 方案决策包综合
    public_input: Plan、业务边界与规则设计、产品和商务输入。
    public_output: 带版本、digest、证据和下游映射的方案决策包。
  - id: work-unit.spec-synthesis
    name: Spec 综合
    scope: project-instance
    input: 已确认的 Plan 记录和测试 seam。
    output: Spec、产品总体设计和功能架构。
    completion: Spec 与业务 Ticket 草案集合同时可审查，FR/AC 覆盖可读取；尚不具备实现资格。
  - id: work-unit.prototype-design
    name: 原型设计与验证
    scope: project-instance
    input: Spec、产品设计影响和状态矩阵。
    output: 交互说明、低/高保真原型、评审、AntD CLI 和浏览器证据。
    completion: 原型评审、高保真验证和用户确认门禁均通过。
  - id: work-unit.technical-analysis
    name: 技术分析与契约冻结
    scope: project-instance
    input: Spec、原型、API/数据/工程影响面。
    output: OpenAPI、数据架构、Tactical DDD Check、工程基线、架构审查和 Slice 合同草案。
    completion: 命中契约已冻结；无 API 影响有可读记录；命中领域影响时战术模型无未解释冲突；工程基线通过。
  - id: work-unit.ticket-decomposition
    name: 垂直切片 Ticket 正式化
    scope: project-instance
    input: 冻结 Spec、设计、契约和阻塞关系。
    output: 更新既有功能父 Ticket 的关联、形成垂直切片和批准的 Slice Implementation Contract。
    completion: 切片可独立验证；生命周期复算后才能 ready-for-agent。
  - id: work-unit.business-ticket-formalization
    name: 业务级 Ticket 正式化
    scope: project-instance
    input: 当前 Spec、适用的产品设计批准、业务 Ticket 草案集合和独立专业审查。
    output: 可追溯 FR/AC、规则、场景与设计的业务 Ticket 集；保持 ready-for-human。
    completion: 当前业务覆盖完整，无阻断未决项；既有批准或授权延续有效，专业审查当前。战略交接或技术分析可继续，不授予 ready-for-agent。
    public_input: 已批准的 Spec、页面原型、业务边界与规则设计和方案决策包。
    public_completion: Ticket 范围、优先级、验收、依赖和业务风险可审查，并可纳入业务方案交接包。
  - id: work-unit.strategic-design-handoff
    name: Strategic Design Handoff
    scope: project-instance
    input: 批准的 DDD 战略设计、阶段决策包、Spec、页面原型和业务级 Ticket 集。
    output: 面向下游研发团队的战略设计交付包。
    completion: Handoff v5 已批准且来源资产当前；自动生成不可变交付目录，整包 verify 通过，并将 delivery record 与 verification 写入 checkpoint。任一失败保持 blocked；下游接收回执不阻断本工作单元完成。
    public_name: 业务方案交接
    public_input: 批准的业务边界与规则设计、方案决策包、Spec、页面原型和业务级 Ticket 集。
    public_output: 面向下游研发团队的业务方案交接包。
    public_completion: Handoff v5 与来源资产已获当前批准；不可变交付目录自动成包并整包验证通过，交付记录已写入 checkpoint。研发接收可异步进行，不阻断本工作单元完成。
  - id: work-unit.slice-implementation
    name: 垂直切片实现
    scope: project-instance
    input: 当前版本 Slice Implementation Contract 和允许写路径。
    output: 前后端实现、TDD 和 YSS Skill Execution Result。
    completion: 行为通过 `behavior-tdd`；UI 影响完成还原验证计划；无 drift/violation。
  - id: work-unit.frontend-implementation-verification
    name: 前端实现还原验证
    scope: project-instance
    input: 冻结原型、状态矩阵、实现候选和视觉验收用例。
    output: 桌面/窄屏视觉、状态、交互、console 和 pnpm 验证证据。
    completion: 关键场景无未解释差异；独立 Reviewer 通过 UI fidelity 轴。
  - id: work-unit.code-review
    name: 独立代码审查与验证
    scope: project-instance
    input: 不可变候选快照、Spec、Ticket、合同和执行结果。
    output: Standards、Spec、UI fidelity 三轴 Review 与 fresh verification。
    completion: findings 已处理；修复后重新捕获候选并全量复审。
    public_completion: findings 已处理；首轮覆盖全部适用审查项，修复后按差异、受影响结论及直接 / 传递依赖定向复审；未受影响结论仅凭可核验依据复用，全部结论重新绑定当前候选。
  - id: work-unit.release-and-retrospective
    name: 发布与复盘
    scope: project-instance
    input: 已审查候选、发布窗口和回滚点。
    output: 发布/回滚证据和复盘记录。
    completion: 人工发布裁决、fresh verification 和治理回流均完成。
checks:
  - id: check.repository-identity-valid
    name: 仓库身份校验
    stage: stage.entry-triage
    trigger: 每次进入流程。
    evidence:
      - evidence.repository-identity-check
  - id: check.domain-strategy-approved
    name: 业务边界与规则评审
    stage: stage.plan
    trigger: 存在战略设计影响或需要确定业务边界、统一语言、协作关系和核心规则。
    public_name: 业务边界与规则评审
    public_trigger: 需要确定业务板块、责任区、统一词汇、协作关系或关键规则。
    evidence:
      - evidence.domain-strategy-review
      - evidence.approval-record
  - id: check.stage-decision-package-approved
    name: 方案决策包评审
    stage: stage.plan
    trigger: Plan 到 Spec 入口需要稳定、可追溯的方案决策合同。
    evidence:
      - evidence.stage-decision-package
      - evidence.approval-record
    requires_checks:
      - check.domain-strategy-approved
  - id: check.prototype-reviewed
    name: 原型评审
    stage: stage.product-design
    trigger: 命中产品设计影响，需要独立评审页面、流程、状态和异常路径。
    evidence:
      - evidence.prototype-review-result
  - id: check.prototype-verified
    name: 原型交付物验证
    stage: stage.product-design
    trigger: 产品设计影响需要通过 H1/H2 原型进行视觉或流程校准。
    evidence:
      - evidence.antd-cli-validation
      - evidence.browser-prototype-verification
