# owner: yss-strategic-design
# consumers: lifecycle route/query, current Profile workflows and governance validators
checkpoint_policy:
  strategy: consolidated
  flush_on:
    - stage_exit
    - human_pause
    - handoff
    - implementation_entry
    - merge
    - release
  flush_immediately_on:
    - blocked
    - responsibility_changed
    - asset_approval
  preserve_stage_causality: true
  required_stage_trace_fields:
    - stage
    - upstream_refs
    - artifact_refs
    - gate_decisions
    - downstream_impacts
  project_instance_stage_exit_requires_context_reconciliation: true
tracker:
  allowed_platforms:
    - local-markdown
    - github
    - gitlab
  default_platform: local-markdown
  selection_precedence:
    - persisted_project_configuration
    - explicit_user_choice
    - template_default
  remote_origin_role: code_host_only
  no_automatic_cross_platform_switch: true
  local_markdown:
    root: .work
    legacy_roots:
      - .scratch
      - docs/requirements/tickets
    feature_layout:
      - map.md
      - plan
      - spec.md
      - design
      - gates
      - issues
      - strategic-design-handoff.yaml
    primary_sync: local
    remote_ticket_required: false
    remote_mirror: optional
  remote_platforms:
    primary_sync: remote
    remote_ticket_required: true
    unavailable_fallback_root: .work
    unavailable_fallback_marker: pending-publication
    unavailable_fallback_record: map.md
    unavailable_fallback_fields:
      - tracker
      - publication
      - pending_publication_to
setup_readiness:
  evaluation: once_per_task
  recheck_when:
    - tracker_changed
    - remote_changed
    - labels_changed
    - configuration_changed
  missing_action: needs-human
  requested_skill: setup-matt-pocock-skills
  resume_route: setup-readiness
  preserves:
    - lifecycle.status
    - gate.status
    - ticket.role
  lifecycle_may_invoke_setup: false
  legacy_artifacts_detected:
    action: migration-check
    setup: forbidden
    write: paused
  states:
    - ready
    - missing
    - conflict
    - degraded
    - not-applicable
  evidence:
    - platform
    - label_check
    - domain_layout
    - artifact_root
    - migration_ref
  semantics:
    ready:
      - tracker_compatible
      - labels_verified
      - domain_layout_verified
      - artifact_root_verified
    missing:
      - required_configuration_absent
      - legacy_artifacts_detected_requires_migration
    conflict:
      - persistent_configuration_or_tracker_conflict
      - canonical_and_legacy_artifacts
    degraded:
      - target_platform_unavailable
    not-applicable:
      - template_source_validate_only
  template_source:
    action: validate-only
phase_boundary:
  choices:
    - continue
    - clear
    - handoff
    - subagent
    - compact
  precedence:
    - continue
    - clear
    - handoff
    - subagent
    - compact
  invariants:
    - does-not-force-clear
    - preserves-lifecycle-state
  evidence:
    required:
      - decision
      - reason
    conditional:
      handoff:
        - source_ref
        - destination_ref
      subagent:
        - task_package_ref
        - convergence_ref
      compact:
        - next_phase
  preserves:
    - lifecycle.status
    - gate.status
    - ticket.role
stage_tracking:
  contract: .template-spec/process/stage-tracking.md
  schema: .template-spec/process/schemas/stage-tracking.schema.json
  verifier: scripts/stage-tracking
  configuration: tracker.lifecycle_tracking_version
  machine_state_owner: checkpoint.stage_tracking
  transition_checkpoint_ref: checkpoint_ref
  flush_on:
    - stage_exit
    - blocked
    - responsibility_changed
    - asset_approval
  preserves:
    - ticket-state
    - gate-approval
    - profile-scope
