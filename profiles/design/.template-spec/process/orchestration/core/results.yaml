# owner: yss-strategic-design
# consumers: lifecycle route/query, current Profile workflows and governance validators
matt_skill_result:
  status: compatibility-read-only
  may_influence_routing: false
  normalize_to: workflow-execution-result-v1
  schema_version: 1
  result_values:
    - completed
    - blocked
    - needs-human
    - failed
  required:
    - result
    - skill
    - evidence_refs
    - changed_artifacts
    - new_impacts
    - stale_candidates
    - next_route
    - blocking_signals
  blocking_signals:
    - drift
    - new_impacts
    - violation
    - missing_evidence
    - stale_candidates
  completed_requires_empty:
    - new_impacts
    - stale_candidates
  completed_requires_non_empty:
    - evidence_refs
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  router_status_mapping:
    draft: completed
    blocked: blocked
    ready-for-lifecycle-review: needs-human
workflow_execution_result:
  canonical_output_schema: workflow-execution-result-v1
  accepted_input_schemas:
    - workflow-execution-result-v1
  legacy:
    matt-skill-result-v1:
      status: compatibility-read-only
      may_influence_routing: false
      normalize_to: workflow-execution-result-v1
      removal_target: schema_version_2
  result_values:
    - completed
    - blocked
    - needs-human
    - failed
  required:
    - result_schema
    - work_unit
    - workflow_reference
    - result
    - context_reconciliation
    - evidence_refs
    - changed_artifacts
    - new_impacts
    - stale_candidates
    - next_route
    - blocking_signals
  unavailable_skill:
    required:
      - skill
      - provider
      - fallback
      - resolution
    blocking_result: blocked
  blocking_signals:
    - drift
    - new_impacts
    - violation
    - missing_evidence
    - stale_candidates
  completed_requires_empty:
    - new_impacts
    - stale_candidates
  completed_requires_non_empty:
    - evidence_refs
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  context_reconciliation:
    schema_ref: .template-spec/process/schemas/context-reconciliation.schema.json
    validator: scripts/verify-context-reconciliation
    project-instance:
      required_status: reconciled
      readable_ref_required: true
      transition_without_reconciliation: blocked
    template-source:
      required_status: not-applicable
      reason_required: true
    creates_gate: false
  workflow_reference:
    required:
      - source
      - skill
      - invocation_mode
    allowed_sources:
      - yss-strategic-design
      - mattpocock/skills
  next_route:
    validator: scripts/lib/lifecycle-transition.mjs
    function: validateNextRoute
    null_allowed_when:
      - blocked
      - needs-human
      - failed
      - terminal_completed
  work_unit_requirements:
    work-unit.business-ticket-formalization:
      completed_requires:
        - business_ticket_set_ref
    work-unit.strategic-design-handoff:
      completed_requires:
        - strategic_design_handoff_ref
        - strategic_delivery_record_ref
        - strategic_delivery_verification_ref
      handoff_validator: scripts/verify-strategic-design-handoff
      handoff_schema_version: 2
matt_invocation_boundary:
  user_invoked_skills:
    - ask-matt
    - handoff
    - to-spec
    - to-tickets
    - triage
    - wayfinder
  lifecycle_managed_user_entries:
    - ask-matt
    - to-spec
    - to-tickets
    - triage
    - wayfinder
  model_invoked_skills:
    - code-review
    - competitive-intelligence
    - domain-modeling
    - grilling
    - prototype-review
    - writing-for-agents
    - yss-research
  lifecycle_allowed_model_invoked_skills:
    - competitive-intelligence
    - domain-modeling
    - grilling
    - prototype-review
    - yss-research
  lifecycle_may_invoke_user_invoked: false
  formal_artifact_owner: explicit-user-entry
  continuous_orchestration: compatibility-prepare-and-validate-only
  direct_user_entry: lifecycle-validate-and-accept
lifecycle_native_entries:
  default_entry: yss-strategic-design
  formal_artifact_owner: yss-strategic-design
  user_confirmation_required_at:
    - plan-approval
    - spec-baseline
    - product-design-when-applicable
  compatibility_entries:
    to-spec: lifecycle-validate-and-accept
    to-tickets: lifecycle-validate-and-accept
    triage: lifecycle-validate-and-accept
