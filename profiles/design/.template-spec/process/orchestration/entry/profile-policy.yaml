# owner: yss-strategic-design
# consumers: lifecycle route/query, current Profile workflows and governance validators
profile_registry:
  ref: .template-spec/process/harness-profile.yaml
  default_profile: harness.business-ddd-strategy-handoff
  activation: profile-aware-route
  target_user_roles:
    - role.product-manager
    - role.requirements-manager
    - role.business
  control_plane_roles:
    - role.lifecycle-orchestrator
  terminal_work_unit: work-unit.strategic-design-handoff
  terminal_next_route: null
  downstream_team: downstream-rd-team
  downstream_skill: yss-technical-design
  handoff_template: .template-spec/templates/strategic-design-handoff-template.yaml
  handoff_schema: .template-spec/process/schemas/strategic-design-handoff.schema.json
  handoff_schema_version: 5
  handoff_context_contract:
    source_snapshot: required
    context_delta: required
    target_reconciliation_before_tactical_design: required
  allowed_local_work_units:
    - work-unit.plan-opportunity
    - work-unit.plan-requirements
    - work-unit.domain-strategy-design
    - work-unit.stage-decision
    - work-unit.spec-synthesis
    - work-unit.prototype-design
    - work-unit.business-ticket-formalization
    - work-unit.strategic-design-handoff
  forbidden_local_work_units:
    - work-unit.technical-analysis
    - work-unit.ticket-decomposition
    - work-unit.slice-implementation
    - work-unit.code-review
    - work-unit.release-and-retrospective
  forbidden_local_artifacts:
    - artifact.openapi-draft
    - artifact.openapi-freeze-record
    - artifact.tactical-design
    - artifact.parent-ticket
    - artifact.vertical-slice-ticket
    - artifact.slice-implementation-contract
task_package:
  schema_version: 1
  applies_to: all-formal-digital-human-dispatches
  schema_ref: .template-spec/process/schemas/digital-human-task-package.schema.json
  compatibility_schema_ref: .template-spec/process/schemas/subagent-task-package.schema.json
  validator: scripts/verify-digital-human-task-package
  compatibility_validator: scripts/verify-digital-human-task-package
  persistence_layout: .work/<feature>/task-packages/<task-id>.yaml
  required:
    - schema_version
    - task_id
    - work_unit_id
    - actor_id
    - role_id
    - runtime_id
    - execution_state
    - workflow_status
    - skill_source
    - contract
    - inputs
    - objective
    - allowed_write_paths
    - forbidden_actions
    - expected_outputs
    - expected_evidence_files
    - verification_commands
    - verification_results
    - downstream_consumers
    - convergence
  optional:
    - profile_id
  execution_states:
    - Explorer
    - Drafter
    - Worker
    - Reviewer
    - Verifier
  workflow_statuses:
    - not-started
    - active
    - paused
    - resolved
    - failed
  skill_source:
    registry_ref: .template-spec/agents/digital-human-roles.yaml
    defaults: taskPackageDefaults(role_id)
    copy_required:
      - core_skills
      - forbidden_skills
  contract:
    kinds:
      - lifecycle-work-unit
      - template-maintenance
    required:
      - kind
      - contract_id
      - contract_version
      - status
      - contract_ref
    status_at_dispatch: issued
    status_after_change:
      - stale
      - blocked
    lifecycle-work-unit:
      required:
        - lifecycle_ref
      forbidden:
        - slice_contract_ref
        - maintenance_ref
      template_source_work_unit: forbidden
    template-maintenance:
      required:
        - maintenance_ref
      forbidden:
        - slice_contract_ref
        - lifecycle_ref
  dispatch:
    owner: role.lifecycle-orchestrator
    mode: orchestrator-one-to-one
    per_feature_instances: forbidden
  write_isolation:
    policy: task-package-policy
    changed_files_must_be_within_allowed_paths: true
    shared_workspace_is_not_security_boundary: true
  downstream:
    formal_channel:
      - task_package_ref
      - contract_ref
      - evidence_refs
      - workflow_execution_result
    direct_chat_is_not_formal_evidence: true
  stale:
    owner: yss-strategic-design
    on_contract_change:
      - mark_downstream_stale
      - reroute
  compatibility:
    legacy_results: read-only-normalize
    schema_version: 1
compatibility_flow_preconditions:
  to-spec:
    required:
      - grill_exit
      - no_unresolved_runnable_blocker
    evidence:
      - user_problem
      - mvp_and_non_goals
      - success_criteria
      - test_seam
      - terminology_review
    output_role: ready-for-human
  to-tickets:
    required:
      - required_gates_satisfied
      - business_scope
      - acceptance_criteria
      - dependencies_and_risks
    output: business-level-tickets
    output_role: ready-for-human
  implement:
    status: removed
    action: blocked-and-handoff
    reason: implementation_is_owned_by_downstream_rd_profile
seam_deferred_required:
  - risk
  - owner
  - follow_up_ticket
  - verification_plan
  - target_version_or_release_date
unknown_impact:
  action: pause
  reason_code: impact-classification-required
prototype_return_evidence:
  required:
    - prototype_profile
    - source_handoff
    - prototype_asset_or_run
    - conclusion
    - updated_authoritative_asset
    - remaining_questions
    - return_handoff
  allowed_profiles:
    - H1
    - H2
external_input_pause:
  transition: pause
  reason_code: external-input-required
  reason: required decision-maker input is not available to the Agent
  required:
    - questionnaire_ref
    - recipient_role
    - requested_outputs
    - resume_route
  response_required:
    - response_ref
    - reclassified_impact
    - updated_authoritative_asset
  resume_requires:
    - response_ref
    - reclassified_impact
    - updated_authoritative_asset
prototype_profiles:
  H1:
    kind: visual-review
    runtime_build_required: false
    required:
      - prototype_profile
      - profile_decision
      - prototype_asset_or_run
      - design_qa
      - review
      - user_confirmation
  H2:
    kind: flow-review
    runtime_build_required: conditional
    required:
      - prototype_profile
      - profile_decision
      - prototype_asset_or_run
      - design_qa
      - review
      - user_confirmation
behavioral_invariants:
  wait_what_preserves_state: true
  human_checkpoint_required_for_manual_steps: true
  diagnostics_redact_secrets: true
  local_implementation_entry: forbidden
  local_release_claim: forbidden
