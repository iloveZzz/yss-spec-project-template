schema_version: 2
progression_target:
  schema_version: 1
  required_capabilities: [ lifecycle-target-v1 ]
  config_file: progression-target.json
  writer_profiles: []
  default_target: profile-terminal
  coordinator: explicit-spec-root-and-same-feature-checkpoint
  no_second_progress_state: true
  business_completion: not-evaluated-local-terminal-only
  completion_policy:
    profile-terminal:
      public_name: 产品与业务设计职责完成
      required_gates: [ gate.strategic-design-handoff-approved ]
      required_checks: [ strategic-handoff-delivery ]
    product-design-completed:
      public_name: 产品设计完成
      required_gates: [ gate.product-design-approved ]
      conditional_gates: { gate.product-design-approved: product-design-impact }
      required_checks: [ inherited-spec-baseline, business-tickets-formal ]
      no_ui_presentation: not-applicable-with-current-impact-evidence
      strategic_handoff_terminal: separate-responsibility
document_writing:
  supporting_skill: i-have-adhd
  condition: lifecycle-document-output
  scope: current-document-work-only
  dispatch: pass-condition-and-reference-to-document-owner
  reference: .template-spec/process/document-writing.md
  examples: .template-spec/templates/examples/lifecycle-writing-examples.md
  artifact_ownership: unchanged
  gate_and_status_semantics: unchanged
supported_state_schema_versions: [ 1 ]

checkpoint_policy:
  strategy: consolidated
  flush_on:
    - stage_exit
    - human_pause
    - handoff
    - implementation_entry
    - merge
    - release
  flush_immediately_on:
    - blocked
    - responsibility_changed
    - asset_approval
  preserve_stage_causality: true
  required_stage_trace_fields:
    - stage
    - upstream_refs
    - artifact_refs
    - gate_decisions
    - downstream_impacts
  project_instance_stage_exit_requires_context_reconciliation: true

modes:
  route: read_only
  audit: read_only
  orchestrate: bounded_write
  resume: rebuild_then_bounded_write

profile_registry:
  ref: .template-spec/process/harness-profile.yaml
  default_profile: harness.business-ddd-strategy-handoff
  activation: profile-aware-route
  target_user_roles: [ role.product-manager, role.requirements-manager, role.business ]
  control_plane_roles: [ role.lifecycle-orchestrator ]
  terminal_work_unit: work-unit.strategic-design-handoff
  terminal_next_route: null
  downstream_team: downstream-rd-team
  downstream_skill: yss-technical-design
  handoff_template: .template-spec/templates/strategic-design-handoff-template.yaml
  handoff_schema: .template-spec/process/schemas/strategic-design-handoff.schema.json
  handoff_schema_version: 5
  handoff_context_contract:
    {
      source_snapshot: required,
      context_delta: required,
      target_reconciliation_before_tactical_design: required
    }
  allowed_local_work_units:
    [
      work-unit.plan-opportunity,
      work-unit.plan-requirements,
      work-unit.domain-strategy-design,
      work-unit.stage-decision,
      work-unit.spec-synthesis,
      work-unit.prototype-design,
      work-unit.business-ticket-formalization,
      work-unit.strategic-design-handoff
    ]
  forbidden_local_work_units:
    [
      work-unit.technical-analysis,
      work-unit.ticket-decomposition,
      work-unit.slice-implementation,
      work-unit.frontend-implementation-verification,
      work-unit.code-review,
      work-unit.release-and-retrospective
    ]
  forbidden_local_artifacts:
    [
      artifact.openapi-draft,
      artifact.openapi-freeze-record,
      artifact.tactical-design,
      artifact.parent-ticket,
      artifact.vertical-slice-ticket,
      artifact.slice-implementation-contract
    ]

entry_routing:
  manifest: yss-project.yaml
  valid_modes: [ template-source, project-instance ]
  invalid_manifest:
    action: migration-check
  direct_matt_entry:
    skill: ask-matt
    delegate_to: yss-strategic-design
    requires_valid_manifest: true
    action: navigate-only
    lifecycle_state_mutation: forbidden
    lifecycle_artifact_write: forbidden
    return_to_orchestrator: required
  formal_user_entry:
    skills: [ ask-matt, to-spec, to-tickets, triage, wayfinder ]
    action: lifecycle-validate-and-accept
    lifecycle_artifact_write: conditional-explicit-user-entry
    return_to_orchestrator: required
  template_source:
    route: template-maintenance
    forbidden_artifacts: [ product-spec, prototype, openapi, vertical-slice-tickets ]
    forbidden_flows: [ to-spec, to-tickets, release, retrospective ]
    on_forbidden_flow: blocked
    block_reason: template-source-product-artifact-forbidden

matt_skill_result:
  status: compatibility-read-only
  may_influence_routing: false
  normalize_to: workflow-execution-result-v1
  schema_version: 1
  result_values: [ completed, blocked, needs-human, failed ]
  required:
    [
      result,
      skill,
      evidence_refs,
      changed_artifacts,
      new_impacts,
      stale_candidates,
      next_route,
      blocking_signals
    ]
  blocking_signals: [ drift, new_impacts, violation, missing_evidence, stale_candidates ]
  completed_requires_empty: [ new_impacts, stale_candidates ]
  completed_requires_non_empty: [ evidence_refs ]
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  router_status_mapping:
    {
      draft: completed,
      blocked: blocked,
      ready-for-lifecycle-review: needs-human
    }

workflow_execution_result:
  canonical_output_schema: workflow-execution-result-v1
  accepted_input_schemas: [ workflow-execution-result-v1 ]
  legacy:
    matt-skill-result-v1:
      status: compatibility-read-only
      may_influence_routing: false
      normalize_to: workflow-execution-result-v1
      removal_target: schema_version_2
  result_values: [ completed, blocked, needs-human, failed ]
  required:
    [
      result_schema,
      work_unit,
      workflow_reference,
      result,
      context_reconciliation,
      evidence_refs,
      changed_artifacts,
      new_impacts,
      stale_candidates,
      next_route,
      blocking_signals
    ]
  unavailable_skill:
    required: [ skill, provider, fallback, resolution ]
    blocking_result: blocked
  blocking_signals: [ drift, new_impacts, violation, missing_evidence, stale_candidates ]
  completed_requires_empty: [ new_impacts, stale_candidates ]
  completed_requires_non_empty: [ evidence_refs ]
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  context_reconciliation:
    schema_ref: .template-spec/process/schemas/context-reconciliation.schema.json
    validator: scripts/verify-context-reconciliation
    project-instance:
      {
        required_status: reconciled,
        readable_ref_required: true,
        transition_without_reconciliation: blocked
      }
    template-source: { required_status: not-applicable, reason_required: true }
    creates_gate: false
  workflow_reference:
    required: [ source, skill, invocation_mode ]
    allowed_sources: [ yss-strategic-design, mattpocock/skills ]
  next_route:
    validator: scripts/lib/lifecycle-transition.mjs
    function: validateNextRoute
    null_allowed_when: [ blocked, needs-human, failed, terminal_completed ]
  work_unit_requirements:
    work-unit.business-ticket-formalization:
      completed_requires: [ business_ticket_set_ref ]
    work-unit.strategic-design-handoff:
      completed_requires:
        [
          strategic_design_handoff_ref,
          strategic_delivery_record_ref,
          strategic_delivery_verification_ref
        ]
      handoff_validator: scripts/verify-strategic-design-handoff
      handoff_schema_version: 2

task_package:
  schema_version: 1
  applies_to: all-formal-digital-human-dispatches
  schema_ref: .template-spec/process/schemas/digital-human-task-package.schema.json
  compatibility_schema_ref: .template-spec/process/schemas/subagent-task-package.schema.json
  validator: scripts/verify-digital-human-task-package
  compatibility_validator: scripts/verify-digital-human-task-package
  persistence_layout: .work/<feature>/task-packages/<task-id>.yaml
  required:
    [
      schema_version,
      task_id,
      work_unit_id,
      actor_id,
      role_id,
      runtime_id,
      execution_state,
      workflow_status,
      skill_source,
      contract,
      inputs,
      objective,
      allowed_write_paths,
      forbidden_actions,
      expected_outputs,
      expected_evidence_files,
      verification_commands,
      verification_results,
      downstream_consumers,
      convergence
    ]
  optional: [ profile_id ]
  execution_states: [ Explorer, Drafter, Worker, Reviewer, Verifier ]
  workflow_statuses: [ not-started, active, paused, resolved, failed ]
  skill_source:
    registry_ref: .template-spec/agents/digital-human-roles.yaml
    defaults: taskPackageDefaults(role_id)
    copy_required: [ core_skills, forbidden_skills ]
  contract:
    kinds: [ lifecycle-work-unit, template-maintenance ]
    required: [ kind, contract_id, contract_version, status, contract_ref ]
    status_at_dispatch: issued
    status_after_change: [ stale, blocked ]
    lifecycle-work-unit:
      required: [ lifecycle_ref ]
      forbidden: [ slice_contract_ref, maintenance_ref ]
      template_source_work_unit: forbidden
    template-maintenance:
      required: [ maintenance_ref ]
      forbidden: [ slice_contract_ref, lifecycle_ref ]
  dispatch:
    owner: role.lifecycle-orchestrator
    mode: orchestrator-one-to-one
    per_feature_instances: forbidden
  write_isolation:
    policy: task-package-policy
    changed_files_must_be_within_allowed_paths: true
    shared_workspace_is_not_security_boundary: true
  downstream:
    formal_channel: [ task_package_ref, contract_ref, evidence_refs, workflow_execution_result ]
    direct_chat_is_not_formal_evidence: true
  stale:
    owner: yss-strategic-design
    on_contract_change: [ mark_downstream_stale, reroute ]
  compatibility:
    legacy_results: read-only-normalize
    schema_version: 1

matt_invocation_boundary:
  user_invoked_skills: [ ask-matt, handoff, to-spec, to-tickets, triage, wayfinder ]
  lifecycle_managed_user_entries: [ ask-matt, to-spec, to-tickets, triage, wayfinder ]
  model_invoked_skills:
    [
      code-review,
      competitive-intelligence,
      domain-modeling,
      grilling,
      prototype-review,
      writing-for-agents,
      yss-research
    ]
  lifecycle_allowed_model_invoked_skills:
    [
      competitive-intelligence,
      domain-modeling,
      grilling,
      prototype-review,
      yss-research
    ]
  lifecycle_may_invoke_user_invoked: false
  formal_artifact_owner: explicit-user-entry
  continuous_orchestration: compatibility-prepare-and-validate-only
  direct_user_entry: lifecycle-validate-and-accept

skill_source_contract:
  lock_version: 3
  source_revisions_required: [ mattpocock/skills ]
  adaptation_ref_required_when_effective_diff: true
  retired_shared_skills:
    [
      batch-grill-me,
      grill-me,
      product-design-prototype,
      yss-dictionary,
      yss-jdbc,
      yss-log,
      yss-taskflow,
      yss-backend-scaffold-application,
      yss-backend-scaffold-domain,
      yss-backend-scaffold-infrastructure,
      yss-backend-scaffold-web
    ]

lifecycle_native_entries:
  default_entry: yss-strategic-design
  formal_artifact_owner: yss-strategic-design
  user_confirmation_required_at: [ plan-approval, spec-baseline, product-design-when-applicable ]
  compatibility_entries:
    to-spec: lifecycle-validate-and-accept
    to-tickets: lifecycle-validate-and-accept
    triage: lifecycle-validate-and-accept

work_unit_routes:
  work-unit.plan-opportunity:
    native:
      {
        source: yss-strategic-design,
        skill: yss-strategic-design,
        invocation_mode: model-invoked
      }
    primary_skill: yss-strategic-design
    supporting_skills: [ competitive-intelligence, yss-research ]
    skills: [ competitive-intelligence, yss-research ]
    route_by:
      {
        market_or_competitor_fact: competitive-intelligence,
        technical_or_standard_fact: yss-research:technical-evidence,
        strategy_fact: yss-research:strategy-evidence,
        no_external_fact: yss-strategic-design
      }
    applies_when: opportunity_or_external_fact_requires_validation
    not_applicable_reason: no_external_fact
  work-unit.plan-requirements:
    native:
      {
        source: yss-strategic-design,
        skill: yss-strategic-design,
        invocation_mode: model-invoked
      }
    primary_skill: yss-strategic-design
    supporting_skills: [ grilling, domain-modeling ]
    skills: [ grilling, domain-modeling ]
    applies_when: requirements_or_domain_boundary_unclear
    not_applicable_reason: requirements_already_confirmed
    review_bundle: review-bundle.plan
    human_gate: gate.plan-approved
  work-unit.domain-strategy-design:
    native:
      {
        source: yss-strategic-design,
        skill: yss-stage-decision,
        invocation_mode: model-invoked
      }
    primary_skill: yss-stage-decision
    supporting_skills: [ domain-modeling, yss-research, grilling ]
    skills: [ yss-stage-decision, domain-modeling, yss-research, grilling ]
    research_contract:
      {
        profile: strategy-evidence,
        mode_before_gate: evidence-audited,
        artifact_owner: yss-research,
        downstream_owner: yss-stage-decision
      }
    internal_check: check.domain-strategy-approved
    applies_when: domain_boundary_or_language_or_core_rule_impact
    not_applicable_reason: no_domain_strategy_impact
  work-unit.stage-decision:
    native:
      {
        source: yss-strategic-design,
        skill: yss-stage-decision,
        invocation_mode: model-invoked
      }
    primary_skill: yss-stage-decision
    supporting_skills: [ domain-modeling, yss-research ]
    skills: [ yss-stage-decision, domain-modeling, yss-research ]
    research_contract:
      {
        profile: strategy-evidence,
        mode_before_gate: evidence-audited,
        artifact_owner: yss-research,
        downstream_owner: yss-stage-decision
      }
    internal_check: check.stage-decision-package-approved
    aggregate_gate: gate.plan-approved
    applies_when: plan_to_spec_requires_stable_decision_package
    not_applicable_reason: existing_approved_stage_decision_current
  work-unit.spec-synthesis:
    native:
      {
        source: yss-strategic-design,
        skill: yss-strategic-design,
        invocation_mode: model-invoked
      }
    primary_skill: yss-strategic-design
    supporting_skills: [ domain-modeling ]
    compatibility:
      {
        source: mattpocock/skills,
        skill: to-spec,
        invocation_mode: reference,
        formal_artifact_owner: explicit-user-entry
      }
    skills: [ domain-modeling ]
    human_gate: gate.spec-baseline-approved
    applies_when: new_feature_or_behavior_change
    not_applicable_reason: existing_frozen_spec_is_current
  work-unit.prototype-design:
    native:
      {
        source: yss-strategic-design,
        skill: yss-strategic-design,
        invocation_mode: model-invoked
      }
    primary_skill: yss-prototype-stage
    supporting_skills: [ prototype-review, yss-design-system ]
    skills:
      [
        prototype-review,
        yss-design-system,
        yss-prototype-stage
      ]
    human_gate: gate.product-design-approved
    applies_when: product_design_impact
    not_applicable_reason: no_ui_or_product_design_impact
  work-unit.business-ticket-formalization:
    native:
      {
        source: yss-strategic-design,
        skill: yss-strategic-design,
        invocation_mode: model-invoked
      }
    primary_skill: yss-strategic-design
    supporting_skills: []
    compatibility:
      {
        source: mattpocock/skills,
        skill: to-tickets,
        invocation_mode: reference,
        formal_artifact_owner: explicit-user-entry
      }
    skills: [ yss-strategic-design ]
    applies_when: business_scope_impact
    not_applicable_reason: no_business_scope_impact
    next_route: work-unit.strategic-design-handoff
  work-unit.strategic-design-handoff:
    native:
      {
        source: yss-strategic-design,
        skill: yss-strategic-design,
        invocation_mode: model-invoked
      }
    primary_skill: yss-strategic-design
    supporting_skills: []
    skills: [ yss-strategic-design ]
    human_gate: gate.strategic-design-handoff-approved
    post_approval_action:
      command: scripts/strategic-handoff finalize --source-root <project-root>
        --handoff <approved-v5-ref>
      output_root: docs/deliveries/strategic/<handoff-id>/<version>
      checkpoint_artifact: artifact.strategic-design-handoff
      checkpoint_evidence: [ delivery-record.json, verification.json ]
      checkpoint_verification: verification.strategic_delivery
      failure_status: blocked
      receiver_receipt_required: false
    applies_when: strategic_inputs_ready_for_downstream
    not_applicable_reason: strategic_inputs_incomplete
  work-unit.technical-analysis:
    downstream: true
    owner: downstream-rd-team
    handoff: strategic-design-handoff
    applies_when: downstream_profile_approved
    not_applicable_reason: downstream_only
  work-unit.ticket-decomposition:
    downstream: true
    owner: downstream-rd-team
    handoff: strategic-design-handoff
    applies_when: downstream_profile_approved
    not_applicable_reason: downstream_only
  work-unit.slice-implementation:
    downstream: true
    owner: downstream-rd-team
    handoff: strategic-design-handoff
    applies_when: downstream_profile_approved
    not_applicable_reason: downstream_only
  work-unit.frontend-implementation-verification:
    downstream: true
    owner: downstream-rd-team
    handoff: strategic-design-handoff
    applies_when: downstream_profile_approved
    not_applicable_reason: downstream_only
  work-unit.code-review:
    downstream: true
    owner: downstream-rd-team
    handoff: strategic-design-handoff
    applies_when: downstream_profile_approved
    not_applicable_reason: downstream_only
  work-unit.release-and-retrospective:
    downstream: true
    owner: downstream-rd-team
    handoff: strategic-design-handoff
    applies_when: downstream_profile_approved
    not_applicable_reason: downstream_only

compatibility_flow_preconditions:
  to-spec:
    required: [ grill_exit, no_unresolved_runnable_blocker ]
    evidence:
      [
        user_problem,
        mvp_and_non_goals,
        success_criteria,
        test_seam,
        terminology_review
      ]
    output_role: ready-for-human
  to-tickets:
    required:
      [
        required_gates_satisfied,
        business_scope,
        acceptance_criteria,
        dependencies_and_risks
      ]
    output: business-level-tickets
    output_role: ready-for-human
  implement:
    status: removed
    action: blocked-and-handoff
    reason: implementation_is_owned_by_downstream_rd_profile

transition_graph:
  validator: scripts/lib/lifecycle-transition.mjs
  routes:
    work-unit.ssot-update: [ work-unit.skill-projection-sync, work-unit.intensity-aware-verification ]
    work-unit.skill-projection-sync: [ work-unit.template-snapshot-build, work-unit.intensity-aware-verification ]
    work-unit.template-snapshot-build: [ work-unit.attach-sync-integration, work-unit.intensity-aware-verification ]
    work-unit.attach-sync-integration: [ work-unit.intensity-aware-verification ]
    work-unit.intensity-aware-verification: [ work-unit.intensity-aware-review ]
    work-unit.intensity-aware-review: [ work-unit.release-and-rollback ]
    work-unit.release-and-rollback: []
    work-unit.plan-opportunity:
      [
        work-unit.plan-requirements,
        work-unit.domain-strategy-design,
        work-unit.stage-decision
      ]
    work-unit.plan-requirements: [ work-unit.domain-strategy-design, work-unit.stage-decision ]
    work-unit.domain-strategy-design: [ work-unit.stage-decision ]
    work-unit.stage-decision: [ work-unit.spec-synthesis ]
    work-unit.spec-synthesis: [ work-unit.prototype-design, work-unit.business-ticket-formalization ]
    work-unit.prototype-design: [ work-unit.business-ticket-formalization ]
    work-unit.business-ticket-formalization: [ work-unit.strategic-design-handoff ]
    work-unit.strategic-design-handoff: []
  forbidden_shortcuts:
    - { from: work-unit.spec-synthesis, to: work-unit.technical-analysis }
    - { from: work-unit.prototype-design, to: work-unit.slice-implementation }
    - {
        from: work-unit.strategic-design-handoff,
        to: work-unit.slice-implementation
      }

planning:
  entry_validator: scripts/verify-plan-spec-entry
  review_contract: .template-spec/plan/entry-review.md
  check_policy: .template-spec/process/lifecycle-registry.yaml
  default_check_status: pending
  formal_spec_draft_requires_passed_entry: true
  stage: stage.plan
  record: artifact.plan-record
  template: .template-spec/plan/templates/plan-template.md
  exit_policy: .template-spec/process/lifecycle-registry.yaml
  migration_policy: .template-spec/process/plan-migration.md
  critical_open_questions: block-before-spec
  deferred_details_require: [ noncritical_reason, owner, resolution_point, downstream_recipient ]
  reuse_requires: [ source_ref, current_version, applicable_scope, reason ]
  downstream: work-unit.spec-synthesis
  implementation_authorized: false
  frontier_scope: current-plan-decisions
  deferred_details: excluded-from-frontier-only-after-user-confirms-deferral
  clarification_policy:
    trigger: required-plan-user-decision-unresolved
    skill: grilling
    invocation_mode: model-invoked
    explicit_user_invocation_required: false
    inputs:
      [
        current_scope,
        discovered_facts,
        confirmed_decisions,
        open_items,
        decision_dependencies
      ]
    dispositions:
      required_user_decision: grilling-with-real-user-response
      discoverable_fact: investigate-or-yss-research
      runnable_blocker: prototype-or-actual-verification-with-evidence
      professional_wait: autonomously-dispatch-or-inspect-existing-task-then-wait
      verification_failure: repair-supply-evidence-or-reroute
      noncritical_detail: existing-deferral-policy-with-user-confirmation
    rounds:
      frontier: decisions-with-settled-prerequisites
      questions: all-independent-actionable-frontier-questions-with-recommendations
      advance: after-real-user-response
      unsettled_facts: wait-only-for-dependent-questions
      reuse: unchanged-confirmed-decisions
      correction: reopen-only-affected-decisions-and-dependencies
      independent_authorized_work: continue
    convergence:
      summary:
        [
          user_problem,
          goals,
          mvp,
          non_goals,
          key_rules,
          acceptance_examples,
          open_item_resolutions,
          remaining_uncertainty
        ]
      required_open_items: resolved-with-current-evidence
      facts_and_verification: readable-evidence-required
      preparation_check: grill_exit
      preparation_passed_means: clarification-materials-and-prerequisites-ready
      final_confirmation_boundary: gate.plan-approved
      final_confirmation: shared-understanding-and-current-plan-in-one-real-response
      final_confirmation_proof: plan_user_decision_ref-or-valid-plan_continuation_ref
      confirmation_writeback: external-proof-without-review-or-basis-rewrite
      completion: passed-preparation-and-valid-current-user-decision
  review_control:
    protocol: bounded-plan-review-v1
    enabled: true
    checkpoint_field: plan_review_control
    schema: .template-spec/process/schemas/plan-review-control.schema.json
    bundle_id: review-bundle.plan
    aggregate_gate: gate.plan-approved
    professional_check_ids:
      - check.domain-strategy-approved
      - check.stage-decision-package-approved
    check_dependency: domain-strategy-before-stage-decision
    aggregate_professional_result: reuse-internal-check-conclusions-without-third-review-task
    limits:
      regular: 2
      exception: 1
      total: 3
    phase_order:
      - initial
      - rereview
      - exception
    counted: registered-professional-review-attempts
    separately_counted:
      - clarification
      - machine-check
      - read-only-diagnosis
      - external-mandatory-approval
