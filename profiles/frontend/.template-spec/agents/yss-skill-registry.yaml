  owner_skill: yss-skill-source-index-refresh
  scope: yss-component-capability-skills
  component_skills:
    - yss-audit-log
    - yss-cache
    - yss-distributed-id
    - yss-dto
    - yss-excel-mvc
    - yss-exception
    - yss-mybatis
    - yss-resilience4j
    - yss-security-algorithm
    - yss-userinfo
    - yss-validation
