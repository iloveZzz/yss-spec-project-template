invocation_contract:
  schema_version: 2
  runtime_metadata_version: 1
  scope: discovery-only
  required_fields:
    - invocation_mode
    - trigger_conditions
    - exclusion_conditions
    - primary_output
  allowed_invocation_modes:
    - user
    - model
    - both
  trigger_source: impacts
  trigger_encoding: impact:<impact>
  default:
    invocation_mode: model
    trigger_conditions:
      - registered-skill-request
    exclusion_conditions:
      - no-trigger-match
    primary_output: skill-guidance
  layer_defaults:
    core:
      invocation_mode: both
      primary_output: workflow-result
    specialist:
      invocation_mode: model
      primary_output: implementation-guidance
    compatibility:
      invocation_mode: user
      primary_output: explicit-user-compatibility-input
    maintainer-only:
      invocation_mode: user
      primary_output: maintenance-operation
  overrides:
    i-have-adhd:
      invocation_mode: model
      trigger_conditions:
        - lifecycle-document-output
      exclusion_conditions:
        - code-only-work
        - command-only-work
        - unrelated-conversation
        - user-disabled
      primary_output: document-writing-assistance
    git-commit-core:
      invocation_mode: user
      trigger_conditions: [ public-commit-entry-dependency ]
      exclusion_conditions: [ standalone-task-selection ]
      primary_output: internal-commit-contract
    frontend-commit:
      invocation_mode: user
      trigger_conditions: [ frontend-commit-assistance ]
      exclusion_conditions: [ no-commit-related-request ]
      primary_output: frontend-commit-guidance
    prototype:
      invocation_mode: both
      trigger_conditions: [ prototype-request ]
      exclusion_conditions: [ production-implementation-request ]
      primary_output: prototype-evidence
    writing-for-agents:
      invocation_mode: both
      trigger_conditions: [ agent-document-writing ]
      exclusion_conditions: [ unrelated-document ]
      primary_output: agent-document
    using-git-worktrees:
      invocation_mode: both
      trigger_conditions: [ authorized-workspace-task ]
      exclusion_conditions: [ outside-authorized-scope ]
      primary_output: workspace-guidance
    yss-skill-source-index-refresh:
      invocation_mode: user
      trigger_conditions: [ authorized-source-index-maintenance ]
      exclusion_conditions: [ outside-authorized-scope ]
      primary_output: source-index-evidence
    handoff:
      invocation_mode: user
      trigger_conditions: [ explicit-handoff-request ]
      exclusion_conditions: [ no-handoff-request ]
      primary_output: session-handoff
    publish-skills-sh:
      invocation_mode: user
    llm-wiki:
      invocation_mode: user
