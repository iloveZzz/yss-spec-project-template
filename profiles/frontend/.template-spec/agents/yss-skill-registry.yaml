    - retired
  deprecated_new_use: forbidden
  cleanup_statuses:
    - migration-only
    - remove-ready
  hard_retirement_tombstone: .template-spec/agents/skill-migrations.md
  retired_id_source: scripts/lib/skill-supply-chain.mjs#OBSOLETE
  failure_codes:
    deprecated: skill-deprecated
    retired: skill-retired
