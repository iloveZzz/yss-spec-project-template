      source_env: YSS_SOURCE_ROOT_BOOT2_JAVA8
      generated_suffix: source-index.boot2-java8.md
    - id: boot3-java17
      source_env: YSS_SOURCE_ROOT_BOOT3_JAVA17
      generated_suffix: source-index.boot3-java17.md
