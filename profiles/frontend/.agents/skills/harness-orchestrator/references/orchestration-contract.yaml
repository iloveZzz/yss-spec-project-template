      - affected-action
      - source-ref
      - registered-owner
      - resolution-action
      - resolution-evidence
      - resume-verification
    all_material_blockers_visible: true
    unknown_owner: not-registered-never-auto-assigned
    nonblocking_items: retain-owner-resolution-time-and-receiver-or-backlog-ref
    missing_or_stale_evidence: not-verified-with-recovery-action
