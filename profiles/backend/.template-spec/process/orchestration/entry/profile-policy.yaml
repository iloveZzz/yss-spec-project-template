# owner: harness-orchestrator
# Backend engineering boundaries; common evidence policy is domain/review.yaml.
contract_id: harness-backend-contract-v2
status: active
owner: harness-orchestrator
target_scope: backend-delivery
states:
  - draft
  - ready-for-review
  - approved
  - ready-for-agent
  - in-progress
  - verification
  - verified
  - completed
  - blocked
  - stale
  - drift
  - new_impacts
execution_states:
  - Explorer
  - Drafter
  - Worker
  - Reviewer
  - Verifier
entry:
  required:
    - yss-project.yaml
    - CONTEXT.md
    - raw-requirements-or-current-authoritative-inputs
  rejected:
    - missing-context
    - invalid-repository-mode
    - stale-upstream-input
technical_design:
  backend_delivery: required
  required_for_impacts:
    - backend_use_case
    - business_rule
    - layering
    - domain_behavior
    - aggregate
    - invariant
    - state_machine
    - consistency
    - domain_event
    - gateway_boundary
    - persistence_mapping
  no_impact: forbidden-for-backend-delivery
  data_architecture_decision:
    schema_version: 1
    impact_modes:
      - required
      - not-applicable
    required_when_data_impact:
      - data_architecture_ref
      - data_architecture_digest
      - review_evidence_refs
    not_applicable_requires:
      - assessment_ref
      - assessment_digest
      - reason
      - evidence_refs
  api_contract_decision:
    schema_version: 1
    impact_modes:
      - required
      - not-applicable
    required_when_api_impact:
      - openapi_ref
      - openapi_version
      - openapi_digest
      - validation_record_ref
      - validation_record_digest
      - draft_review_ref
      - draft_review_digest
      - freeze_version
      - freeze_time
    same_draft_bytes_required_across:
      - openapi
      - validation
      - draft-review
      - freeze
      - engineering-approval
    validation_requires:
      - openapi-3.1
      - locked-redocly
      - exit-code-zero
      - all-checks-passed
    review_requires:
      - approved
      - no-blocking-findings
      - applicable-review-evidence
    not_applicable_requires:
      - assessment_ref
      - assessment_digest
      - reason
      - evidence_refs
    placeholder_assets: forbidden
  approval_gate: gate.engineering-contract-approved
  review_mode: applicable-review-policy
slice_contract:
  professional_review:
    required_from_schema_version: 3
    check_id: check.design-reviewed
    stage_id: stage.slice-contract
    subject: current-persisted-compiled-slice-by-id-version-and-raw-digest
    independence: conditional-on-explicit-user-or-external-rule
    prior_engineering_approval: not-a-slice-review
  id: slice-implementation-contract-v2
  one_contract_per_slice: true
  shared_version_required: true
  resolution_digest_required: true
  required_sections:
    - architecture
    - frontend
    - backend
    - testing
readiness:
  all_of:
    - upstream_inputs_current_and_approved
    - tactical_design_current_or_not_applicable_recorded
    - api_freeze_or_no_api_impact_recorded
    - data_architecture_or_no_data_impact_recorded
    - ui_inputs_or_no_ui_impact_recorded
    - implementation_repositories_and_commands_registered
    - implementation_repository_preparation_completed
    - allowed_write_paths_registered
    - test_seams_and_acceptance_executable
    - task_packages_share_contract_version
    - no_blocking_signals
parallelism:
  test_seam_before_implementation: true
  frontend_backend_parallel_after_contract: false
  verifier_must_differ_from_worker: false
gates:
  architecture:
    - gate.backend-architecture-platform-approved
    - gate.technical-design-approved
    - gate.slice-contract-approved
  implementation:
    - gate.slice-ready-for-agent
  verification:
    - gate.fresh-verification-passed
  human:
    - gate.backend-architecture-platform-approved
    - gate.high-risk-architecture-confirmed
    - gate.openapi-freeze-confirmed
    - gate.merge-approved
re_route_on:
  - api-schema-impact
  - database-schema-impact
  - state-machine-impact
  - aggregate-impact
  - invariant-impact
  - scaffold-architecture-decision-changed
  - scaffold-profile-or-module-closure-changed
  - new-write-path
  - new-repository
  - contract-violation
  - test-seam-changed
  - verification-command-changed
scaffold_architecture_decision:
  applies_when: backend_scaffold_status_required
  gate: gate.backend-architecture-platform-approved
  timing: after-impact-and-platform-candidate-resolution-before-ddd-or-mvc-branch-design
  evidence_file: scaffold-architecture-decisions.yaml
  schema_ref: .template-spec/process/schemas/scaffold-architecture-decisions.schema.json
  recommendation:
    domain_driven_signals:
      - aggregate_invariants
      - complex_state_transitions
      - domain_events
      - consistency_boundary
      - rich_domain_behavior
    layered_mvc_signals:
      - thin_crud
      - reporting_query
      - simple_data_maintenance
      - no_aggregate_invariants
    output_required:
      - recommended_architecture
      - recommendation_reasons
  interaction:
    choices:
      - domain-driven
      - layered-mvc
    confirms_together:
      - architecture_family
      - exact_spring_boot_version
    user_confirmation_required: true
    silent_default: forbidden
    generator_interaction: forbidden
  project_inheritance:
    root_project_choice: child_default_only
    child_projects: visible_in_batch_confirmation
    child_override: allowed-with-reason
  lifecycle_status: lifecycle-approved
  change_policy:
    existing_or_initialized_project: no-regeneration
    architecture_switch: separate-migration-work-unit
    digest_change: stale-and-recompile
  existing_repository:
    gate_status: not-applicable
    architecture_source: current-existing-registration
    spring_boot_version_source: fixed-engineering-baseline-or-pom
    user_reconfirmation: forbidden-unless-source-changes
business_input:
  modes:
    - standalone
    - upstream
  # 普通需求、说明、技术文档或 Spec 材料先提取到本端记录；来源格式、源工程身份与源批准不作为分析前提。
  standalone: local-plan-spec-and-current-approved-design
  # 仅用户显式选择现有正式上游时核验来源批准；普通材料不自动建立正式接收或持续在线绑定。
  upstream: reuse-current-approved-assets-preserve-authority
  conflicts: confirm-with-authority-before-dependent-work
  delivery_path_policy_ref: .template-spec/process/orchestration-contract.yaml#request_triage.delivery_path
  analysis_grants_opposite_side_write: false
  terminal_claim: own-side-only
review_verification:
  default_mode: self-check
  independent_when:
    - explicit-user-requirement
    - known-external-rule
  same_account_separate_session: allowed-only-with-verifiable-distinct-context-and-execution
  names_models_roles_or_runtime_ids: not-independence-proof
  check_policy_ref: .template-spec/process/orchestration/domain/review.yaml
  repair_invalidates_affected_review: true
task_package:
  schema_version: 3
  schema_ref: .template-spec/process/schemas/digital-human-task-package.schema.json
  selection: work-unit-and-actual-impact
  dispatch: single-executor-default
  legacy_schema_versions:
    - 1
    - 2
  legacy_access: read-only-original-semantics
  write_isolation:
    policy: task-package-policy
    changed_files_must_be_within_allowed_paths: true
    shared_workspace_is_not_security_boundary: true
