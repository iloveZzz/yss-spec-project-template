# owner: harness-orchestrator
# consumers: lifecycle route/query, current Profile workflows and governance validators
request_triage:
  owner: yss-product-lifecycle
  delivery_path:
    version: 1
    enabled_profiles:
      - spec
      - backend
    eligible_requirements:
      - goal
      - acceptance
      - single_repository
      - current_baseline
      - skills
      - commands
      - rollback
      - known_risk
    excluded_impacts:
      - data-migration
      - cross-repository
      - platform-conversion
      - architecture-conversion
      - permission-change
      - deployment
      - release
      - external-approval
      - breaking-api
      - unknown-api
    active_task_bindings: preserve-governed
    single_record: markdown-with-embedded-evidence
    compatible_api: conservative-additive
    read_only_capabilities:
      - lifecycle.route
      - lifecycle.verify-daily
    public_summary: Spec、Backend 日常任务在目标、验收、写范围、一处已知实现仓、可回滚依据、可读工程基线、验证命令与适用 YSS 技能齐全且无排除风险时， 走需求与验收、技术技能、实现、测试、独立审查，仅更新同一 Ticket 或 PR，不生成阶段 checkpoint、正式 Slice 或多级批准。专职 Profile 的本地业务分析不扩大另一端实现写范围。 缺事实先调查；无法证明条件时恢复完整治理。旧 CLI 或未声明能力的 Profile明确不支持，不降级正式校验器。
    ordinary_record_fields:
      - scope
      - acceptance
      - engineering-baseline
      - applicable-skills
      - actual-tests
      - independent-review
      - rollback
    unknown_facts: investigate-before-route
    unproven_eligibility: governed-or-needs-info
    existing_governed_task: cannot-downgrade-through-label-or-removed-binding
    unrelated_formal_assets: do-not-block-daily-task
    newly_discovered_risk: preserve-edits-and-evidence-stop-affected-work-resume-nearest-trusted-stage
    daily_sequence:
      - requirements-and-acceptance
      - yss-technical-skills
      - implementation
      - tests
      - independent-review
    daily_formal_stage_packages: forbidden
    review_basis: current-diff-and-verification-evidence
    completion_requires:
      - current-scope
      - passing-actual-tests
      - independent-review
      - no-open-blocking-findings
      - current-api-evidence-if-applicable
    new_decisions_and_external_actions: require-applicable-existing-authorization-boundary
    compatible_api_sequence:
      - oas-3.1-yaml-draft
      - locked-tool-validation
      - conservative-compatibility-and-independent-review
      - digest-freeze
      - implementation-and-contract-tests
    compatible_api_rule: new-independent-operations-only-existing-operations-and-reachable-normalized-reference-closure-identical
    api_evidence_location: same-ticket-api-contract-review-section
    api_extra_formal_assets: not-required-for-daily
    api_evidence_fields:
      - tool-command
      - actual-exit-code
      - baseline-digest
      - candidate-digest
      - reviewer
      - conclusion
      - freeze-digest
      - contract-tests
    api_freshness: yaml-reference-or-applicable-rule-changes-invalidate-affected-review-and-freeze
    formal_validators: unchanged-no-daily-bypass
    specialist_business_input:
      - mode
      - side
      - ref
      - digest
      - conflicts
    business_input_modes:
      - standalone
      - upstream
    standalone_authority: local-plan-spec-and-current-approved-design
    upstream_conflicts: confirm-with-authority-before-dependent-work
    own_side_completion: not-cross-side-business-acceptance
    standalone_scaffold: mechanical-only-no-business-authorization
  interpretation:
    inputs:
      - current-request
      - conversation-context
      - accessible-evidence
    capture:
      - goal
      - target
      - expected-deliverable
      - action-scope
      - facts
      - assumptions
      - unknowns
    multiple_intents: preserve-all-goals-and-order-dependencies
    competing_interpretations: compare-effect-on-next-action
    numeric_self_confidence: forbidden-as-routing-evidence
  clarification:
    trigger: missing-information-changes-next-action-or-authorization-scope
    before_asking: reuse-context-and-inspect-accessible-evidence
    short_request_alone: insufficient-reason-to-ask
    question: explain-gap-and-ask-minimum-actionable-information
    batch: independent-current-decision-questions
    same_safe_next_step: investigate-before-asking
    user_cannot_answer: narrow-problem-or-offer-bounded-guidance-keep-unresolved
    timeout_is_answer: false
  mode_selection:
    priority:
      - explicit-current-restriction
      - authorized-continuation
      - clear-action-request
      - read-only-fallback
    explicit_read_only: route
    explicit_audit: audit
    authorized_continuation: resume
    clear_action_request: orchestrate
    clear_read_only_investigation_request: orchestrate
    unresolved_intent: route
    investigation: read-only-actions-unless-additional-scope-authorized
    mode_keywords_required: false
    continuation: revalidate-scope-evidence-and-applicable-gates
    gates_and_external_authorization: unchanged
  next_action:
    consultation: answer
    investigation: inspect-evidence
    action_request: execute-first-authorized-unblocked-work-unit
    material_ambiguity: clarify
    missing_prerequisite: explain-blocker-and-continue-independent-authorized-work
    skill_name_only_is_completion: false
  correction:
    stop: actions-dependent-on-invalid-interpretation
    preserve: still-valid-evidence-and-unrelated-user-work
    report: revised-goal-and-actions-already-taken
    existing_edits: explain-scope-and-agree-disposition-no-blind-rollback
    recompute:
      - intent
      - scope
      - impacts
      - freshness
      - next-action
  acceptance:
    per_goal:
      - requested-outcome
      - readable-evidence
      - unresolved-items
    mismatch: investigate-or-reroute
    unresolved_triage_is_complete: false
  presentation:
    simple: direct-answer-or-action
    complex: brief-goal-and-next-action
    material_ambiguity: targeted-question
    full_workflow_record: applicable-work-units-only
  evaluation:
    scenarios_ref: .agents/skills/yss-product-lifecycle/references/request-triage-scenarios.yaml
    dimensions:
      - understanding-error
      - wrong-route
      - unnecessary-question
      - omitted-intent
      - post-triage-stall
      - correction-failure
    baseline: required-before-numeric-improvement-claim
    structural_checks_prove_model_accuracy: false
