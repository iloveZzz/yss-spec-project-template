# owner: harness-orchestrator
# consumers: lifecycle route/query, current Profile workflows and governance validators
document_writing:
  supporting_skill: i-have-adhd
  condition: lifecycle-document-output
  scope: current-document-work-only
  dispatch: pass-condition-and-reference-to-document-owner
  reference: .template-spec/process/document-writing.md
  examples: .template-spec/templates/examples/lifecycle-writing-examples.md
  artifact_ownership: unchanged
  gate_and_status_semantics: unchanged
user_progress_report:
  owner: harness-orchestrator
  reference: .template-spec/process/document-writing.md#4-进度与会签提示
  writing_reference: .template-spec/process/document-writing.md#4-进度与会签提示
  emit_on:
    - controller-return
    - status-request
    - resume
    - stage-boundary
    - blocked
    - human-pause
    - handoff
    - completion-assessment
  ordinary_progress: meaningful-changes-only
  audience: current-feature-or-authorized-task
  sources:
    - current-checkpoint
    - stage-tracking
    - readable-assets
    - applicable-verification
    - lifecycle-registry
    - orchestration-contract
  required_information:
    - current-stage-and-work-unit
    - state-basis
    - this-turn-outcome
    - next-stage-and-work-unit
    - entry-conditions
    - issues-and-blockers
    - registered-owner
    - recovery-action-and-recheck
    - agent-next-action
    - user-action-if-required
    - evidence-freshness
  structured_result_fields:
    - mode
    - repository_mode
    - stage
    - work_unit
    - impacts
    - artifacts
    - gates
    - tickets
    - slices
    - contracts
    - evidence_freshness
    - readiness
    - blockers
    - actions_taken
    - next_work_unit
    - pause_reason
    - ticket_sync
    - git_checkpoint
  presentation_is: derived-explanation-never-approval-or-execution-authorization
  next_stage:
    source: current-registered-work-unit-stage-association-and-validated-route
    stage-order-as-route: forbidden
    same_stage: explain-remaining-work-in-current-stage
    unresolved_or_missing_route: not-verified-with-missing-input
    terminal: explain-verified-task-or-execution-scope-endpoint
    planned_target_is_approved_transition: false
    include:
      - expected-output
      - applicable-entry-conditions
      - unmet-preconditions
  issues:
    classification:
      - blocker
      - nonblocking-open-question
      - suggestion
    blocker_fields:
      - problem
      - affected-action
      - source-ref
      - registered-owner
      - resolution-action
      - resolution-evidence
      - resume-verification
    all_material_blockers_visible: true
    unknown_owner: not-registered-never-auto-assigned
    nonblocking_items: retain-owner-resolution-time-and-receiver-or-backlog-ref
    missing_or_stale_evidence: not-verified-with-recovery-action
    no_blockers_claim: current-applicable-verification-required
    readonly_no_findings: no-detected-blockers-with-unchecked-scope
  recovery:
    authorized_agent_actions: continue-and-report-result
    dependent_actions: wait-for-real-input-or-current-valid-approval
    independent_authorized_work: continue
    human_action: explain-why-needed-source-scope-options-and-resume-condition
    commands: actual-applicable-validator-and-arguments-never-invented
  before_send:
    - current-state-matches-evidence
    - next-route-and-entry-conditions-explained
    - blockers-have-actionable-recovery
    - owner-is-registered-or-explicitly-missing
    - freshness-and-unchecked-scope-visible
    - user-text-matches-structured-result
    - authorized-work-not-shifted-to-user
  template_source: maintenance-step-and-verification-target-never-product-stage
  invalid_identity: explain-manifest-error-and-migration-check-without-guessing-stage
  forbidden:
    - skill-name-only-return
    - raw-json-only-user-answer
    - bare-blocked-without-recovery
    - stage-complete-from-file-existence
    - repeated-approval-without-new-boundary
