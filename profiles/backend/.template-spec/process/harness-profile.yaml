schema_version: 3
profile_id: harness.backend-delivery
status: active
name: 后端专职交付 Harness
purpose: 按用户需求直接开展后端分析、设计、实现和交付，使用适用技能与现有工程工具。
handoff:
  consumer_capabilities:
  - backend-technical-design
instantiation:
  cli_package: yss
  native_profile: backend
  metadata_file: .yss.json
  legacy_cli_package: create-yss-harness-backend
  legacy_metadata_file: .yss-harness-backend.json
  foreign_metadata_files:
  - .yss-template.json
  - .yss-harness-dev.json
  - .yss-harness-frontend.json
  template_source: github:iloveZzz/yss-harness-backend-agent
  command: yss init --profile backend --root <directory>
execution:
  side: backend
  terminal_conclusion: backend-deliverable
  business_acceptance_owner: real-user-within-explicit-scope
skill_scope:
  policy: local-workflow-only
  retired_local_skills:
  - component-selection-imports
  - file-export-download
  - formily-foundation
  - formily-linkage-effects
  - formily-mode-slot-detail
  - formily-step-flow
  - frontend-agent
  - frontend-commit
  - page-form-module
  - page-list-module
  - page-skeleton
  - prototype-page-acceptance
  - prototype-review
  - theme-token-usage
  - vue3-best-practices
  - yedit-table-usage
  - yss-antd-design
  - yss-api-integration
  - yss-components
  - yss-design-system
  - yss-formily
  - yss-formily-schema-generator
  - yss-frontend-scaffold-generator
  - yss-hook
  - yss-microapp-commit
  - yss-page-module-development
  - yss-prototype-stage
  - yss-ui
  - yss-use-table-height
  - yss-use-tree-height
  - ytable-usage
  - ytree-usage
  optional_skills:
  - id: setup-ts-deep-modules
    default_distributed: false
    activation: explicit-need
    reason: 当前 Java 交付流程无调用；有 TypeScript 后端或工具链需要时按需接入。
  - id: data-analytics
    default_distributed: false
    activation: explicit-need
    reason: 当前主流程无调用；数据质量、SQL 核验或专题分析有需要时按需接入。
business_input:
  modes:
  - standalone
  - upstream
  standalone: local-plan-spec-and-current-approved-design
  upstream: reuse-current-approved-assets-preserve-authority
  conflicts: confirm-with-authority-before-dependent-work
  delivery_path_policy_ref: .template-spec/process/orchestration-contract.yaml#request_triage.delivery_path
  analysis_grants_opposite_side_write: false
  terminal_claim: own-side-only
