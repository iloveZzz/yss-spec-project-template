schema_version: 2
profile_id: harness.backend-delivery
status: active
name: 后端专职交付 Harness
purpose: 承接批准战略，完成后端战术设计、冻结接口及部署验证，按业务切片交付真实接口；可按需协作于显式 Spec 主控，后端职责完成不等于整体业务验收。
audience:
  target_user_roles:
    - role.architecture-agent
    - role.backend-agent
    - role.test-agent
    - role.requirements-manager
    - role.product-manager
  control_plane_roles:
    - role.harness-orchestrator
  non_target_role_policy: 另一端角色只允许无写路径的只读输入评审；不得派发另一端实现或起草任务。共享角色表保留来源批准身份。
  boundary: 职责按业务切片接力；后端交付、前端验收和统一管理方业务验收分别记录。上游规则及 API 变化回交权威方，不在本仓静默重定义。
lifecycle:
  repository_modes:
    - project-instance
  allowed_stages:
    - stage.plan
    - stage.spec-architecture
    - stage.harness-entry
    - stage.technical-design
    - stage.implementation-repository-preparation
    - stage.slice-contract
    - stage.slice-implementation
    - stage.verification
  entry_work_unit: work-unit.harness-entry
  allowed_work_units:
    - work-unit.harness-entry
    - work-unit.technical-design
    - work-unit.implementation-repository-preparation
    - work-unit.slice-contract
    - work-unit.slice-implementation
    - work-unit.verification
    - work-unit.plan-opportunity
    - work-unit.plan-requirements
    - work-unit.domain-strategy-design
    - work-unit.stage-decision
    - work-unit.spec-synthesis
  terminal_work_unit: work-unit.verification
  terminal_stage: stage.verification
  forbidden_work_units:
    - work-unit.ssot-update
    - work-unit.skill-projection-sync
    - work-unit.intensity-aware-verification
    - work-unit.intensity-aware-review
    - work-unit.release-and-rollback
upstream:
  kind: local-business-or-approved-upstream
  default_entry: work-unit.harness-entry
  discovery_is_default: false
  strategic_design_handoff:
    schema_ref: .template-spec/process/schemas/strategic-design-handoff.schema.json
    accepted_schema_versions:
      - 3
      - 4
      - 5
    current_schema_version: 5
    current_import_receipt_schema_version: 3
    accepted_next_work_unit: work-unit.technical-design
    ready_for_agent: false
    ui_impact_requires_visual_baseline_schema_version: 1
    stale_baseline_policy: block-and-reroute
  compatibility_skills:
    - to-spec
    - to-tickets
handoff:
  consumer_capabilities:
    - backend-technical-design
instantiation:
  cli_package: yss
  native_profile: backend
  metadata_file: .yss.json
  legacy_cli_package: create-yss-harness-backend
  legacy_metadata_file: .yss-harness-backend.json
  foreign_metadata_files:
    - .yss-template.json
    - .yss-harness-dev.json
    - .yss-harness-frontend.json
  template_source: github:iloveZzz/yss-harness-backend-agent
  distribution_manifest: .template-source/distribution/template.manifest.json
  command: yss init --profile backend --root <directory>
execution:
  side: backend
  terminal_conclusion: backend-deliverable
  business_acceptance_owner: local-scope-owner-or-registered-coordinator
skill_scope:
  policy: local-workflow-only
  retired_local_skills:
    - component-selection-imports
    - file-export-download
    - formily-foundation
    - formily-linkage-effects
    - formily-mode-slot-detail
    - formily-step-flow
    - frontend-agent
    - frontend-commit
    - page-form-module
    - page-list-module
    - page-skeleton
    - prototype-page-acceptance
    - prototype-review
    - theme-token-usage
    - vue3-best-practices
    - yedit-table-usage
    - yss-antd-design
    - yss-api-integration
    - yss-components
    - yss-design-system
    - yss-formily
    - yss-formily-schema-generator
    - yss-frontend-scaffold-generator
    - yss-hook
    - yss-microapp-commit
    - yss-page-module-development
    - yss-prototype-stage
    - yss-ui
    - yss-use-table-height
    - yss-use-tree-height
    - ytable-usage
    - ytree-usage
  optional_skills:
    - id: setup-ts-deep-modules
      default_distributed: false
      activation: explicit-need
      reason: 当前 Java 交付流程无调用；有 TypeScript 后端或工具链需要时按需接入。
    - id: data-analytics
      default_distributed: false
      activation: explicit-need
      reason: 当前主流程无调用；数据质量、SQL 核验或专题分析有需要时按需接入。
business_input:
  modes:
    - standalone
    - upstream
  standalone: local-plan-spec-and-current-approved-design
  upstream: reuse-current-approved-assets-preserve-authority
  conflicts: confirm-with-authority-before-dependent-work
  delivery_path_policy_ref: .agents/skills/harness-orchestrator/references/orchestration-contract.yaml#request_triage.delivery_path
  analysis_grants_opposite_side_write: false
  terminal_claim: own-side-only
