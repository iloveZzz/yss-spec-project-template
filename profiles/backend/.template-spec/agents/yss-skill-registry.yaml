invocation_contract:
  schema_version: 2
  runtime_metadata_version: 1
  scope: discovery-only
  required_fields:
  - invocation_mode
  - trigger_conditions
  - exclusion_conditions
  - primary_output
  allowed_invocation_modes:
  - user
  - model
  - both
  trigger_source: impacts
  trigger_encoding: impact:<impact>
  default:
    invocation_mode: model
    trigger_conditions:
    - registered-skill-request
    exclusion_conditions:
    - no-trigger-match
    primary_output: skill-guidance
  layer_defaults:
    core:
      invocation_mode: both
      primary_output: workflow-result
    specialist:
      invocation_mode: model
      primary_output: implementation-guidance
    compatibility:
      invocation_mode: user
      primary_output: explicit-user-compatibility-input
    maintainer-only:
      invocation_mode: user
      primary_output: maintenance-operation
  overrides:
    i-have-adhd:
      invocation_mode: model
      trigger_conditions:
      - lifecycle-document-output
      exclusion_conditions:
      - code-only-work
      - command-only-work
      - unrelated-conversation
      - user-disabled
      primary_output: document-writing-assistance
    git-commit-core:
      invocation_mode: user
      trigger_conditions:
      - public-commit-entry-dependency
      exclusion_conditions:
      - standalone-task-selection
      primary_output: internal-commit-contract
    java-backend-commit:
      invocation_mode: user
      trigger_conditions:
      - backend-commit-assistance
      exclusion_conditions:
      - no-commit-related-request
      primary_output: backend-commit-guidance
    prototype:
      invocation_mode: both
      trigger_conditions:
      - prototype-request
      exclusion_conditions:
      - production-implementation-request
      primary_output: prototype-evidence
    writing-for-agents:
      invocation_mode: both
      trigger_conditions:
      - agent-document-writing
      exclusion_conditions:
      - unrelated-document
      primary_output: agent-document
    using-git-worktrees:
      invocation_mode: both
      trigger_conditions:
      - authorized-workspace-task
      exclusion_conditions:
      - outside-authorized-scope
      primary_output: workspace-guidance
    yss-skill-source-index-refresh:
      invocation_mode: user
      trigger_conditions:
      - authorized-source-index-maintenance
      exclusion_conditions:
      - outside-authorized-scope
      primary_output: source-index-evidence
    handoff:
      invocation_mode: user
      trigger_conditions:
      - explicit-handoff-request
      exclusion_conditions:
      - no-handoff-request
      primary_output: session-handoff
    publish-skills-sh:
      invocation_mode: user
    llm-wiki:
      invocation_mode: user
    yss-stage-decision:
      invocation_mode: user
    yss-technical-design:
      invocation_mode: both
      trigger_conditions:
      - backend-design-request
      - implementation-needs-design-decision
      exclusion_conditions:
      - product-ui-design
      - no-design-impact
      primary_output: backend-architecture-solution-and-detail
    yss-tactical-design:
      invocation_mode: both
      trigger_conditions:
      - ddd-aggregate-or-invariant-design
      exclusion_conditions:
      - layered-mvc-task
      - product-ui-design
      primary_output: ddd-tactical-design
    yss-backend-spec-review:
      invocation_mode: user
    implement:
      invocation_mode: both
      trigger_conditions:
      - authorized-backend-development
      - backend-fix-request
      - complete-backend-delivery
      exclusion_conditions:
      - read-only-analysis
      - outside-authorized-repository
      primary_output: backend-implementation-and-delivery
    to-tickets:
      invocation_mode: both
      trigger_conditions:
      - backend-task-decomposition
      - complete-delivery-needs-slices
      exclusion_conditions:
      - small-change-without-decomposition-need
      - unauthorized-tracker-write
      primary_output: behavior-based-implementation-slices
    yss-backend-testing:
      invocation_mode: both
      trigger_conditions:
      - backend-test-request
      - backend-change-needs-verification
      exclusion_conditions:
      - unrelated-test-scope
      - unauthorized-production-or-paid-service-operation
      primary_output: backend-test-results-and-limits
    tdd:
      invocation_mode: both
      trigger_conditions:
      - explicit-test-first-request
      - explicit-red-green-refactor
      exclusion_conditions:
      - ordinary-test-request-without-test-first
      primary_output: behavior-based-test-first-change
