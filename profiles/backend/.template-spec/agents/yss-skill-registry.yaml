capability_contract:
  schema_version: 3
  id_pattern: ^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)+$
  dependency_types:
  - context-required
  - context-conditional
  - coordination-only
  - review-only
  - component-dependency
  task_modes:
  - guidance
  - integration
  - slice-implementation
  - troubleshooting
  - component-maintenance
  - review-input
  - contract-compilation
  - reroute
  - result-validation
  - source-index-refresh
  closure:
    recursive_types:
    - context-required
    conditional_type: context-conditional
    non_expanding_types:
    - coordination-only
    - review-only
    - component-dependency
    deduplicate_skills: true
    preserve_all_reasons: true
  deterministic_order:
  - recipe-declaration
  - dependency-topology
  - skill-id
  provider_kinds:
  - yss-component
  - platform-managed
  - none
