schema_version: 2
slice_contract_versions:
  default: 3
  accepted: [2, 3]
  v3_schema: .template-spec/process/schemas/slice-implementation-contract-v3.schema.json
  normalization: scripts/lib/slice-contract.mjs
  v2_migration: explicit-new-draft-no-inherited-approval
backend_architecture:
  registry_source: .template-spec/agents/yss-skill-registry.yaml
  identity_schema: .template-spec/process/schemas/backend-architecture-identity.schema.json
  required_evidence:
  - engineering_baseline
  - repository_registration
  - manifest
  evidence_loading: original-references-and-raw-sha256
  existing_identity: {schema_version: 2, source_kind: existing-registration, profiles_source: existing_project_profiles}
  generated_identity: preserve-original-generator-and-module-closure
  existing_source_policy: fixed-input-and-approved-bounded-output
  required_identity_surfaces:
  - resolution
  - work_unit
  - execution_result
  family_recipe_selection: explicit-ddd-or-mvc-no-legacy-alias
  readiness: supported-profile-and-current-identical-evidence
contract_id: harness-implementation-contract-compiler-v2
compiled_by: yss-implementation-contract-compiler
approved_by: harness-orchestrator
capability_source: .template-spec/agents/yss-skill-registry.yaml
recipe_source: .template-spec/agents/yss-skill-registry.yaml
digest_algorithm: sha256
unsupported_inputs:
  registry_schema_v1: reject-with-migration-guidance
  slice_contract_schema_v1: reject-with-migration-guidance
allowed_statuses:
- draft
- blocked
- ready-for-lifecycle-review
forbidden_statuses:
- approved
- ready-for-agent
- completed
implementation_path_policy: git-submodule-harness-apps
execution_states:
- Explorer
- Drafter
- Worker
- Reviewer
- Verifier
roles:
  architecture: role.architecture-agent
  frontend: role.frontend-agent
  backend: role.backend-agent
  testing: role.test-agent
  orchestrator: role.harness-orchestrator
readiness_formula:
  all_of:
  - upstream_inputs_current_and_approved
  - tactical_design_current_or_not_applicable_recorded
  - api_freeze_or_no_api_impact_recorded
  - data_architecture_or_no_data_impact_recorded
  - ui_inputs_or_no_ui_impact_recorded
  - implementation_repositories_and_commands_registered
  - allowed_write_paths_registered
  - test_seams_and_acceptance_executable
  - task_packages_share_contract_version
  - no_blocking_signals
slice_contract_required:
  root:
  - schema_version
  - contract_id
  - contract_version
  - slice_id
  - status
  - lifecycle_refs
  - readiness
  - resolution
  - common
  - architecture
  - frontend
  - backend
  - testing
  - contract
  - cross_repo
  - work_units
  resolution:
  - required_capabilities
  - required_skills
  - recipe_ids
  - conditions
  - reason_chains
  - registry_digest
  - compiler_contract_digest
  - compiled_at
  - freshness
  common:
  - impacted_areas
  - implementation_path_policy
  - project_roots
  - required_capabilities
  - required_skills
  - optional_skills
  - unavailable_skills
  - allowed_write_paths
  - forbidden_patterns
  - expected_evidence_files
  - verification_commands
  - human_review_points
  - full_reroute_triggers
  architecture:
  - tactical_design_ref
  - tactical_design_version
  - aggregate_refs
  - invariant_refs
  - state_behavior_refs
  - gateway_boundary_ref
  - decision_refs
  frontend:
  - status
  - required_skills
  - approved_interaction_ref
  - state_matrix_ref
  - visual_baseline_ref
  - visual_baseline_case_ids
  - generated_api_client_ref
  - allowed_write_paths
  - component_test_seams
  - e2e_paths
  backend:
  - status
  - affected_layers
  - component_impacts
  - required_skills
  - application_boundary
  - transaction_boundary
  - persistence_strategy
  - allowed_write_paths
  - forbidden_patterns
  - expected_evidence_files
  - verification_commands
  testing:
  - status
  - required_skills
  - test_strategy_ref
  - test_seams
  - fixtures
  - coverage_targets
  - critical_flows
  - verification_commands
  contract:
  - api_impact
  - freeze_ref
  - no_api_impact_ref
  - generated_clients
  - contract_tests
  - regeneration_commands
  cross_repo:
  - repositories
  - delivery_order
  - integration_verification
  - rollback_order
resolution_contract:
  required_capabilities_source: registry-capability-or-recipe-only
  recipes_reference: capabilities-only
  closure_recursive_types:
  - context-required
  closure_conditional_type: context-conditional
  closure_non_expanding_types:
  - coordination-only
  - review-only
  - component-dependency
  deduplicate_skills: true
  preserve_all_reasons: true
  deterministic_order:
  - recipe-declaration
  - dependency-topology
  - skill-id
  digest_change_status: stale
  stale_action: recompile-and-return-to-harness-approval
  component_bindings:
    when: any-required-capability-provider-kind-is-yss-component
    platform_configuration: required-v2
    catalog_source: .template-spec/engineering/backend-platforms.json
    required_fields: [component_bindings, component_bindings_digest]
    exact_artifact_binding: [group_id, artifact_id, declared_version, resolved_version, pom_sha256, jar_sha256, source_tree]
    digest_change_status: stale
    old_contract_without_binding: stale-and-recompile-no-auto-upgrade
impact_to_capabilities:
  system-data-architecture:
  - architecture.system-data
  backend-agent-execution:
  - execution.backend-slice
  domain-impact:
  - layer.domain
  - layer.application
  tactical-domain-impact:
  - architecture.tactical-domain
  persistence-impact:
  - layer.persistence
  mybatis-framework-impact:
  - framework.mybatis
  web-adapter-impact:
  - layer.web-adapter
  dto-wire-impact:
  - contract.dto-wire
  request-validation:
  - contract.request-validation
  error-mapping:
  - contract.error-mapping
  - contract.dto-wire
  cache:
  - component.cache
  current-user-context:
  - component.current-user-context
  user-cache-lookup:
  - component.current-user-context
  - component.cache
  audit-event:
  - component.audit-log
  - component.current-user-context
  - contract.dto-wire
  excel-import-export:
  - component.excel-import-export
  distributed-id:
  - component.distributed-id
  encryption-or-signing:
  - component.security-algorithm
  gateway-resilience:
  - component.gateway-resilience
  ddd-scaffold:
  - scaffold.ddd
  mvc-scaffold:
  - scaffold.layered-mvc
  springboot3-migration:
  - migration.springboot3
full_reroute_triggers:
- api-schema-impact
- database-schema-impact
- state-machine-impact
- visual-baseline-version-or-digest-changed
- aggregate-impact
- invariant-impact
- scaffold-architecture-decision-changed
- scaffold-profile-or-module-closure-changed
- component-binding-drift
- new-write-path
- new-repository
- contract-violation
- test-seam-changed
- verification-command-changed
- architecture-drift
tdd_modes:
  behavior-tdd:
    impacts:
    - domain-rule
    - state-machine
    - transaction
    - complex-query
    - error-mapping
    - page-interaction
    - user-visible-state
  controlled-generation:
    impacts:
    - project-scaffold
    - dto-boilerplate
    - frozen-openapi-client
    - mechanical-config
    required:
    - exception_reason
    - generator
    - generator_inputs
    - expected_files
    - verification_commands
    - behavior_tests_after_generation
scaffold_contract_schema:
  schema_version: 4
  schema_ref: .template-spec/process/schemas/project-scaffold-contract.schema.json
  identity: project-engineering-baseline
  compiled_by: yss-implementation-contract-compiler
  approved_by: harness-orchestrator
  status_by_owner:
    compiler:
    - draft
    - ready-for-lifecycle-review
    - blocked
    orchestrator:
    - approved
    - stale
    - blocked
  required:
  - contract_id
  - contract_version
  - kind
  - delivery_role
  - scaffold_kind
  - scaffold_request_id
  - status
  - compiler_draft_ref
  - lifecycle_approval_ref
  - persisted_ref
  - current_version
  - implementation_repository
  - backend_repository
  - scaffold_status
  - project_name
  - target_output_dir
  - repository_scope
  - init_git
  - base_package
  - architecture_family
  - generator_skill
  - decision_ref
  - decision_id
  - decision_digest
  - maven_coordinates
  - profiles
  - module_profile
  - allowed_write_paths
  - expected_evidence_files
  - verification_commands
  - approval
  - work_unit
  - generation_policy
  - design_prerequisites
  design_prerequisites:
    required:
    - technical_design
    - data_architecture_decision
    - api_contract_decision
    - engineering_contract_approval_ref
    artifact_binding:
    - ref
    - version
    - digest
    data_impact_modes:
    - required
    - not-applicable
    api_impact_modes:
    - required
    - not-applicable
    api_required_closure:
    - openapi_yaml
    - validation_record
    - independent_draft_review
    - freeze
    api_same_original_bytes: true
    approval_gate: gate.engineering-contract-approved
  architecture_decision:
    artifact: scaffold-architecture-decisions.yaml
    status: lifecycle-approved
    allowed_architectures:
    - domain-driven
    - layered-mvc
    agent_recommends: true
    user_confirmation_required: true
    silent_default: forbidden
    root_project_is_child_default_only: true
    child_projects_require_visible_batch_confirmation: true
    override_requires_reason: true
    compiler_may_approve: false
    digest_algorithm: sha256
  generator_by_architecture:
    domain-driven: yss-ddd-scaffold-generator
    layered-mvc: yss-layered-mvc-scaffold-generator
  approval:
    required:
    - approval_ref
    - approver
    - persisted_ref
    - current_version
  generation_policy:
    required:
    - mode
    - existing_target
    - old_project_migration
    - template_upgrade
    mode: initialize-only
    existing_target: unsupported
    old_project_migration: unsupported
    template_upgrade: unsupported
  maven_coordinates:
    required:
    - group_id
    - project_version
    - parent
    - yss_components_version
    parent_required:
    - group_id
    - artifact_id
    - version
    yss_components_version: 2.0.0-SNAPSHOT
  profiles:
    required:
    - architecture
    - persistence
    - verification_database
    - production_database
    - platform
    - validation_namespace
    - dto_placement
    - repository
    supported_initial:
      domain-driven:
        architecture: target-domain-model
        persistence: mybatis-plus
        verification_database: h2
        production_database: not-bound
        platform: spring-boot-2.7-jdk8
        validation_namespace: javax
        dto_placement: web
        repository: yss-internal
      layered-mvc:
        architecture: layered-mvc
        persistence: mybatis-plus
        verification_database: h2
        production_database: not-bound
        platform: spring-boot-2.7-jdk8
        validation_namespace: javax
        dto_placement: web
        repository: yss-internal
    unsupported:
    - old-architecture-profile
    - client-in-domain
    - mybatis
    - spring-boot-3
    - jakarta
    - separate-client-module
  module_profile:
    required:
    - requested_capabilities
    - resolved_modules
    - resolution_version
    resolution_version: 1
    domain-driven:
      requested_capabilities: []
      resolved_modules:
      - domain
      - application
      - infrastructure
      - adapter
      - bootstrap
    layered-mvc:
      core_modules:
      - server
      - service
      - repository
      capability_modules:
        external-integration:
        - adapter
        published-client:
        - client
        feign-client:
        - client
        - feign-client
  unsupported_inputs:
    schema_v1: reject-no-auto-upgrade
    schema_v2_for_new_generation: reject-read-only-history
    schema_v3_for_new_generation: reject-historical-read-only
    slice_id: forbidden-as-scaffold-identity
    existing_project: reject-no-scaffold-migration
  lifecycle_boundary:
    compiler_emits:
    - draft
    - ready-for-lifecycle-review
    - blocked
    orchestrator_approves:
    - approved
    generator_consumes:
    - approved
    after_generation_by_architecture:
      domain-driven:
      - yss-implementation-contract-compiler
      layered-mvc:
      - yss-implementation-contract-compiler
  work_unit:
    required:
    - id
    - behavior
    - primary_skill
    - supporting_skills
    - tdd_mode
    - allowed_write_paths
    - expected_evidence
    - verification_commands
    - controlled_generation
  generation_boundary:
    allowed_for:
    - project_scaffold
    - pom
    - mechanical_config
    - wrapper
    - bootstrap_entrypoint
    - manifest_v4
    - architecture_rules
    - test_infrastructure
    forbidden_when:
    - business_behavior
    - business_fields
    - business_state
    - permission
    - transaction
    - complex_query
    - error_mapping
    - business_example_crud
    initialization: initialize-only
    regeneration: unsupported
    template_upgrade: unsupported
    old_project_migration: unsupported-separate-architecture-modernization-initiative
  verification:
    commands:
    - ./mvnw validate
    - ./mvnw test
    - ./mvnw package
    requires_execution: true
    completion_levels:
    - generated
    - empty-scaffold-verified
    - first-slice-verified
    downstream_readiness_claim_requires: first-slice-verified
    completion_requires:
    - validate_passed
    - test_passed
    - package_passed
    evidence:
    - preflight
    - command
    - exit_code
    - failure_category
    - duration_ms
    - stdout_ref
    - stderr_ref
    - executed_at
    failure_action: blocked
strategic_handoff_consumption:
  when: upstream-source-is-imported-strategic-handoff
  required:
  - import_receipt_ref
  - bundle_digest
  - context_reconciliation_ref
  - rows
  verification: scripts/verify-strategic-handoff-consumption --root <target> --slice <slice-id> <approved-tactical-contract>
  require_actual_exit_code: 0
  stale_policy: latest-imported-source-digest-and-dependent-slices
  unknown_dependency: block-all
  compiler_must_not_approve: true
frontend_delivery_readiness:
  when: upstream-handoff-or-explicit-frontend-delivery-binding
  source: .template-spec/process/frontend-backend-delivery.md
  verifier: scripts/verify-frontend-delivery
  output_binding: frontend.delivery
  inputs_verified_is_implementation_approval: false

technical_design_consumption:
  when: backend-technical-design-impact
  binding: resolution.technical_design
  required: [ref, version, digest]
  architecture_match: resolution.architecture_identity.architecture_family
  verification: node .agents/skills/yss-technical-design/scripts/validate-technical-design.mjs <contract> --root <target> --slice <slice-id>
  legacy_ddd: explicit-read-only

backend_platform_contract:
  schema_version: 2
  catalog_ref: .template-spec/engineering/backend-platforms.json
  configuration_field: platform_configuration
  selection_owner: harness-orchestrator
  new_generation_requires: [exact-boot-java, confirmed-decision, matching-yss-coordinates, verified-compatibility-entry]
  candidate_generation: maintenance-only
  candidate_downstream: blocked
  component_capabilities:
    registry_marker: provider-kind-yss-component
    mapping_key: provider-binding-id
    foundational_capabilities: [contract.dto-wire, contract.request-validation, contract.error-mapping, framework.mybatis]
    specialized_capabilities: [component.cache, component.current-user-context, component.audit-log, component.excel-import-export, component.distributed-id, component.security-algorithm, component.gateway-resilience]
    exact_artifact_evidence: [group_id, artifact_id, declared_version, resolved_version, pom_sha256, jar_sha256, source_tree]
    verified_architecture_required: true
    unlisted_or_blocked: component-unavailable-for-platform
    missing_evidence: component-evidence-missing
    coordinate_conflict: component-artifact-coordinate-conflict
    drift: component-binding-drift
