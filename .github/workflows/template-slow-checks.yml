name: template-slow-checks
# 薄适配器：定时或手动运行 tier: slow 慢检查（不在每次 PR 的 fast 里执行）。检查逻辑全部在 scripts/ci-gate。
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: template-slow-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  template-slow-checks:
    name: template-slow-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-template
        with:
          toolchain: 'true'
          yss-commit: pin
      - name: scripts/ci-gate --mode slow
        # 测试本身 5 分钟硬上限，超时即失败。
        timeout-minutes: 5
        shell: bash
        run: scripts/ci-gate --mode slow --report-dir /tmp/ci-gate-slow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gate-slow-report
          path: /tmp/ci-gate-slow
          if-no-files-found: warn
