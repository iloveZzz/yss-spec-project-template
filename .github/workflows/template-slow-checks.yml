name: template-slow-checks
# 薄适配器：定时或手动运行 tier: slow 慢检查（不在每次 PR 的 fast 里执行）。检查逻辑全部在 scripts/ci-gate。
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: template-slow-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  template-slow-checks:
    name: template-slow-checks
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-template
        with:
          runtime-only: 'true'
      - name: scripts/ci-gate --mode slow
        # 公共 gate 独立限制验证执行 1000 秒；job 为准备和报告上传保留至少原有 15 分钟余量。
        shell: bash
        run: scripts/ci-gate --mode slow --report-dir /tmp/ci-gate-slow --prepare-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gate-slow-report
          path: /tmp/ci-gate-slow
          if-no-files-found: warn
