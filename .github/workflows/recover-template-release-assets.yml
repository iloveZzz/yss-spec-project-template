name: Recover template v4.7.0 release assets
on:
  push:
    branches: [ops/publish-template-v4.7.0-assets]
permissions:
  contents: write
jobs:
  upload-reviewed-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and upload exact reviewed assets to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .release-recovery/upload.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template470-upload-receipt
          path: ${{ runner.temp }}/template470-upload-receipt.json
          if-no-files-found: warn
