name: Runtime store compatibility
on:
  pull_request:
    paths:
      - '.template-source/cli-core/**'
      - 'scripts/runtime-store'
      - 'scripts/lib/runtime-store.mjs'
      - 'scripts/lib/command-runner.mjs'
      - 'scripts/lib/template-verification-runner.mjs'
      - 'scripts/lib/read-only-intake.mjs'
      - 'scripts/lib/project-governance.mjs'
      - 'tests/runtime-store*.test.mjs'
      - '.github/workflows/runtime-store.yml'
      - 'submodules/**'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare existing schema validation dependency
        shell: bash
        run: python3 -m pip install jsonschema==4.23.0
      - name: Runtime and distribution checks
        shell: bash
        env:
          YSS_RUNTIME_HOME: ${{ runner.temp }}/yss-runtime-store
        run: node --test --test-concurrency=1 tests/runtime-store*.test.mjs
  old-node-rejection:
    name: ${{ matrix.os }} / Node 22.12 refusal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Refuse before writes
        shell: bash
        env:
          YSS_RUNTIME_HOME: ${{ runner.temp }}/yss-runtime-refusal
        run: node --test --test-name-pattern='Node 22.12 startup rejection' tests/runtime-store-distribution.test.mjs
