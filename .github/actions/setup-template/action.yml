name: Setup template tooling
description: 供给 Node、Python、Go 运行时并调用 scripts/ci-setup；不含检查逻辑，版本号以 scripts/ci-setup 为准。
inputs:
  python:
    description: 是否安装 schema 验证环境
    default: 'true'
  toolchain:
    description: 是否准备原型作者工具链与固定版本的 Go
    default: 'false'
  yss-commit:
    description: 可选；yss-cli 的 40 位固定 SHA，或写 pin 取 .template-source/distribution/yss-cli-pin.json 里的固定提交（并核对构建出的二进制摘要）。现役 CLI 检查必须提供本输入或固定的 YSS_NATIVE_BINARY
    default: ''
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: scripts/ci-setup --print-versions >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.versions.outputs.node }}
    - if: inputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.versions.outputs.python }}
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - shell: bash
      env:
        INPUT_PYTHON: ${{ inputs.python }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_YSS_COMMIT: ${{ inputs.yss-commit }}
        YSS_CI_ENV_FILE: ${{ github.env }}
      run: |
        args=()
        [[ "$INPUT_PYTHON" == 'true' ]] || args+=(--no-python)
        [[ "$INPUT_TOOLCHAIN" == 'true' ]] && args+=(--toolchain)
        [[ -z "$INPUT_YSS_COMMIT" ]] || args+=(--yss-commit "$INPUT_YSS_COMMIT")
        scripts/ci-setup ${args[@]+"${args[@]}"}
