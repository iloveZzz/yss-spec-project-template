name: Setup template tooling
description: 供给运行时并调用 scripts/ci-setup；Node/Python 版本取自该脚本，latest 的精确 Go 取固定源码，缺少 Go 时用 CLI pin 引导。
inputs:
  runtime-only:
    description: 仅供给基础运行时，按需依赖由 ci-gate 准备
    default: 'false'
  candidate-go:
    description: 按仓内 pin 准备插件候选构建所需 Go
    default: 'false'
  python:
    description: 是否安装 schema 验证环境
    default: 'true'
  toolchain:
    description: 是否准备原型作者工具链与固定版本的 Go
    default: 'false'
  yss-commit:
    description: 可选；latest 查询最新正式 Release 后固定本批来源；pin 或完整 SHA 显式复现历史来源。按需 ci-gate 的 native_cli 默认 latest
    default: ''
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: scripts/ci-setup --print-versions >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.versions.outputs.node }}
    - id: go_version
      shell: bash
      env:
        INPUT_YSS_COMMIT: ${{ inputs.yss-commit }}
        INPUT_RUNTIME_ONLY: ${{ inputs.runtime-only }}
        INPUT_CANDIDATE_GO: ${{ inputs.candidate-go }}
      run: |
        if [[ "$INPUT_YSS_COMMIT" == latest || ( "$INPUT_RUNTIME_ONLY" == true && "${INPUT_CANDIDATE_GO:-false}" != true ) ]] && command -v go >/dev/null; then exit 0; fi
        go_version="$(node .template-source/scripts/lib/yss-cli-pin.mjs go_version)"
        printf 'go=%s\n' "$go_version" >> "$GITHUB_OUTPUT"
    - if: inputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.versions.outputs.python }}
    - if: steps.go_version.outputs.go != ''
      uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.go_version.outputs.go }}
        cache: false
    - if: inputs.runtime-only != 'true'
      shell: bash
      env:
        INPUT_PYTHON: ${{ inputs.python }}
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
        INPUT_YSS_COMMIT: ${{ inputs.yss-commit }}
        YSS_CI_ENV_FILE: ${{ github.env }}
      run: |
        args=()
        [[ "$INPUT_PYTHON" == 'true' ]] || args+=(--no-python)
        [[ "$INPUT_TOOLCHAIN" == 'true' ]] && args+=(--toolchain)
        [[ -z "$INPUT_YSS_COMMIT" ]] || args+=(--yss-commit "$INPUT_YSS_COMMIT")
        scripts/ci-setup ${args[@]+"${args[@]}"}
