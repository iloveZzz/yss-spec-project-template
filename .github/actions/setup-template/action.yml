name: Setup template tooling
description: 安装模板源验证环境；不构建或修改受版本管理的 vendor。
inputs:
  node:
    description: Node 主版本
    default: '24'
  python:
    description: 是否安装 schema 验证环境
    default: 'true'
  submodules:
    description: 是否初始化模板验证依赖的公开固定子模块
    default: 'false'
  yss-commit:
    description: 可选的 yss-cli 完整固定 SHA；现役 CLI 检查必须提供本输入或固定的 YSS_NATIVE_BINARY
    default: ''
runs:
  using: composite
  steps:
    - if: inputs.submodules == 'true'
      shell: bash
      run: |
        git submodule sync -- \
          submodules/yss-harness-design-agent \
          submodules/yss-harness-backend-agent \
          submodules/yss-harness-frontend-agent
        git -c protocol.version=2 submodule update --init --depth=1 -- \
          submodules/yss-harness-design-agent \
          submodules/yss-harness-backend-agent \
          submodules/yss-harness-frontend-agent
    - if: inputs.yss-commit != ''
      uses: actions/checkout@v4
      with:
        repository: iloveZzz/yss-cli
        ref: ${{ inputs.yss-commit }}
        path: .yss-ci-source
    - if: inputs.yss-commit != ''
      uses: actions/setup-go@v5
      with:
        go-version-file: .yss-ci-source/go.mod
    - if: inputs.yss-commit != ''
      shell: bash
      env:
        YSS_EXPECTED_COMMIT: ${{ inputs.yss-commit }}
      run: |
        [[ "$YSS_EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
        test "$(git -C .yss-ci-source rev-parse HEAD)" = "$YSS_EXPECTED_COMMIT"
        yss_source="$RUNNER_TEMP/yss-cli-$YSS_EXPECTED_COMMIT"
        test ! -e "$yss_source"
        mv .yss-ci-source "$yss_source"
        cd "$yss_source"
        go run ./tools/bundle --source-root "$GITHUB_WORKSPACE" --lock docs/source-lock.json --out internal/bundle/assets
        test -z "$(git status --porcelain --untracked-files=normal)"
        CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/yss" ./cmd/yss
        echo "YSS_NATIVE_SOURCE_ROOT=$yss_source" >> "$GITHUB_ENV"
        echo "YSS_NATIVE_BINARY=$RUNNER_TEMP/yss" >> "$GITHUB_ENV"
        node -e 'const fs=require("node:fs"),crypto=require("node:crypto");fs.appendFileSync(process.env.GITHUB_ENV,"YSS_NATIVE_BINARY_SHA256="+crypto.createHash("sha256").update(fs.readFileSync(process.env.RUNNER_TEMP+"/yss")).digest("hex")+"\n")'
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
    - shell: bash
      run: test "$(scripts/repository-mode)" = template-source
    - uses: pnpm/action-setup@v4
      with:
        version: 10.15.0
    - shell: bash
      run: pnpm --dir .template-source/tooling/node install --frozen-lockfile
    - name: Prepare prototype author tooling
      if: inputs.submodules == 'true'
      shell: bash
      run: |
        prototype_toolchain="$RUNNER_TEMP/yss-prototype-author"
        mkdir -p "$prototype_toolchain"
        cp .agents/skills/yss-prototype-stage/assets/shadcn-vue-authoring/{package.json,pnpm-lock.yaml} "$prototype_toolchain/"
        pnpm --dir "$prototype_toolchain" install --frozen-lockfile --ignore-scripts
        echo "YSS_VUE_TOOLCHAIN=$prototype_toolchain" >> "$GITHUB_ENV"
    - if: inputs.python == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - if: inputs.python == 'true'
      shell: bash
      run: python -m pip install jsonschema==4.23.0
