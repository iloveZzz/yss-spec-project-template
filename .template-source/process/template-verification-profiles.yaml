routing:
  - patterns: ["tests/backend-platforms.test.mjs", "tests/implementation-contract-compiler.test.mjs"]
    groups: [implementation]
  - patterns: ["tests/yss-skill-source-index.test.mjs"]
    groups: [skills]
  - patterns: [".template-source/cli-core/**"]
    groups: [dedicated-cli-core]
  - patterns: ["scripts/*existing*", "scripts/*preflight-delivery*", "scripts/lib/*existing*", "scripts/lib/delivery-preflight.mjs", "scripts/lib/approved-execution-context.mjs", "scripts/lib/ui-baseline.mjs", "scripts/fixtures/existing-*/**", ".template-spec/process/existing-*", ".template-spec/process/delivery-preflight.md", ".template-spec/process/schemas/existing-*", ".template-spec/process/schemas/delivery-preflight*"]
    groups: [existing-project-delivery]
  - patterns: [".agents/skills/yss-technical-design/**", ".agents/skills/yss-tactical-design/**", "scripts/lib/technical-design-boundary.mjs", "scripts/lib/strategic-handoff-design-targets.mjs"]
    groups: [tactical-design, implementation]
  - patterns: ["scripts/*backend-delivery*", "scripts/*frontend-delivery*", "scripts/*frontend-strategic-preflight*", "scripts/lib/*backend-delivery*", "scripts/lib/*frontend-delivery*", "scripts/fixtures/backend-delivery/**", ".template-spec/process/frontend-backend-delivery.md", ".template-spec/process/schemas/backend-delivery*", ".template-spec/process/schemas/frontend-delivery*", ".template-spec/process/schemas/frontend-strategic-preflight*"]
    groups: [frontend-delivery]
  - patterns: ["scripts/*user-decision*", "scripts/lib/user-decision*", "scripts/fixtures/user-decision/**", ".template-spec/process/schemas/user-decision*", ".template-spec/process/templates/user-decision*", "scripts/lib/approval-record.mjs", "scripts/verify-approval-record"]
    groups: [lifecycle, collaboration]
  - patterns: ["scripts/*strategic-handoff*", "scripts/*strategic-feedback*", "scripts/lib/strategic-handoff*", "scripts/lib/strategic-feedback*", "scripts/fixtures/strategic-handoff/**", ".template-source/distribution/strategic-handoff-tools.lock.json", ".template-spec/process/strategic-handoff-package.md", ".template-spec/process/schemas/strategic-handoff-*", ".template-spec/process/schemas/strategic-design-handoff-*", ".template-spec/process/schemas/strategic-*feedback*"]
    groups: [strategic-handoff-package]
  - patterns: [DESIGN.md, ".template-spec/design/**", ".template-source/tooling/node/scripts/design-md.mjs"]
    groups: [design-system]
  - patterns: [AGENTS.md, CONTEXT.md, yss-project.yaml, package.json, .gitignore, README.md, ".template-spec/**", "docs/**"]
    groups: [hygiene]
  - patterns: [AGENTS.md, yss-project.yaml, ".template-source/process/template-engineering-overview.md"]
    groups: [governance-release]
  - patterns: [skills-lock.json, ".agents/skills/**", ".codex/skills/**", ".cursor/skills/**", ".pi/skills/**", ".template-spec/agents/yss-skill-registry.yaml", ".template-source/agents/skills-maintenance.md", "scripts/*skill*"]
    groups: [skills]
  - patterns: [.agents/mcp_config.json, .cursor/mcp.json, .vscode/mcp.json, .template-spec/user-guide/yss-ui-mcp.md, .template-source/agents/yss-ui-skills-integration.md]
    groups: [skills]
  - patterns: [.agents/skills/.strategic-design-skills-manifest.json, .template-source/agents/strategic-design-skills-integration.md, submodules/yss-harness-design-agent/**]
    groups: [skills]
  - patterns: [".template-source/process/maintenance-*", ".template-spec/process/harness-process-tailoring.md", ".template-source/process/schemas/maintenance-*", "scripts/*maintenance*", "scripts/lib/maintenance-*"]
    groups: [maintenance]
  - patterns: [".template-spec/process/lifecycle-*", ".template-spec/process/templates/lifecycle-*", "scripts/*lifecycle*", "scripts/lib/lifecycle-*"]
    groups: [lifecycle]
  - patterns: [".template-spec/agents/digital-human-*", ".template-spec/process/schemas/*task-package*", ".template-spec/templates/subagent-task-package-template.md", "scripts/*task-package*", "scripts/*digital-human*", "scripts/lib/task-package*"]
    groups: [collaboration]
  - patterns: [".agents/skills/code-review/**", ".agents/skills/maintaining-skills/**"]
    groups: [maintenance, collaboration]
  - patterns: [".template-spec/templates/openapi-*", ".agents/skills/yss-openapi-*/**", ".agents/skills/yss-dto/**", "scripts/*openapi*", "scripts/*dto*"]
    groups: [contracts]
  - patterns: [".template-spec/process/implementation-*", "scripts/*repository*", "scripts/*implementation*", "scripts/*scaffold*", "scripts/*prototype*"]
    groups: [implementation]
  - patterns: [".template-source/**", "scripts/vendor/**"]
    groups: [tooling]
  - patterns: [".github/**"]
    groups: [candidate-integrity]
  - patterns: ["submodules/create-yss-spec", "submodules/create-yss-spec/**"]
    groups: [cli-sync]
  - patterns: ["submodules/**"]
    exclude_patterns: ["submodules/create-yss-spec", "submodules/create-yss-spec/**"]
    groups: [implementation]
  - patterns: ["scripts/**"]
    groups: [hygiene]
groups:
  cli-sync:
    commands:
      - { run: "node --test submodules/create-yss-spec/tests/sync-fast-smoke.test.js", when: template-source }
      - { run: "scripts/verify-repository-scope-scenarios", when: template-source }
  dedicated-cli-core:
    commands:
      - { run: "node --test .template-source/cli-core/tests/*.test.mjs", when: template-source }
  frontend-delivery:
    commands:
      - run: "scripts/verify-frontend-delivery-scenarios"
        lane: source-scenarios
        parallel_unless_env: [YSS_DEDICATED_INSTANCE_ROOT, YSS_DELIVERY_TEST_BACKEND_ROOT, YSS_DELIVERY_TEST_FRONTEND_ROOT]
      - run: "node .template-source/scripts/verify-delivery-harness-distribution.mjs"
        when: template-source
        lane: generated-distribution
        parallel_unless_env: [YSS_DEDICATED_INSTANCE_ROOT, YSS_DELIVERY_TEST_BACKEND_ROOT, YSS_DELIVERY_TEST_FRONTEND_ROOT]
  strategic-handoff-package:
    commands:
      - { run: "scripts/verify-strategic-handoff-tools-lock", when: template-source }
      - { run: "node --check scripts/lib/strategic-handoff.mjs" }
      - { run: "scripts/verify-strategic-handoff-package-scenarios" }
  design-system:
    commands:
      - { run: "node .template-source/tooling/node/scripts/design-md.mjs lint DESIGN.md", when: template-source }
      - { run: "node .template-source/tooling/node/scripts/design-md.mjs drift", when: template-source }
  hygiene:
    commands:
      - { run: "scripts/verify-governance-layout" }
  tooling:
    commands:
      - { run: ".template-source/scripts/evidence-index --check", when: template-source }
      - { run: "pnpm --dir .template-source/tooling/node test", when: template-source }
      - { run: "pnpm --dir .template-source/tooling/node check:vendor", when: template-source }
  skills:
    commands:
      - { run: "scripts/sync-profile-skills --check --profile=all" , when: template-source }
      - { run: "scripts/sync-skills --check" }
      - { run: "scripts/update-skill-lock --check" }
      - { run: "node --test tests/skill-sync-efficiency.test.mjs", when: template-source }
      - { run: "scripts/verify-skill-registry" }
      - { run: "scripts/verify-skill-governance" }
      - { run: "scripts/verify-upstream-skill-source --source=iloveZzz/yss-harness-design-agent --source-root=submodules/yss-harness-design-agent", when: template-source }
      - { run: "node --test .agents/skills/yss-skill-source-index-refresh/scripts/refresh-yss-skill-index.test.mjs" }
      - { run: "node --test .agents/skills/yss-repository/tests/profile-routing.test.mjs" }
  tactical-design:
    commands:
      - { run: "node .agents/skills/yss-technical-design/scripts/generate-schema.mjs --check" }
      - { run: "node .agents/skills/yss-technical-design/tests/run-scenarios.mjs" }
      - { run: "node --test .agents/skills/yss-technical-design/tests/engineering-scenarios.mjs" }
      - { run: "node --check .agents/skills/yss-tactical-design/scripts/validate-tactical-design.mjs" }
      - { run: "node --check .agents/skills/yss-tactical-design/tests/run-scenarios.mjs" }
      - { run: "node .agents/skills/yss-tactical-design/tests/run-scenarios.mjs" }
  contracts:
    commands:
      - { run: "scripts/verify-yss-dto-openapi-profile" }
      - { run: "scripts/verify-yss-dto-openapi-scenarios" }
      - { run: "scripts/verify-openapi-yaml-first-scenarios" }
      - { run: "scripts/verify-openapi-json-handoff-scenarios" }
  collaboration:
    commands:
      - { run: "scripts/verify-digital-human-roles" }
      - { run: "scripts/verify-digital-human-roles-scenarios" }
      - { run: "scripts/verify-approval-record --history .template-spec/templates/approval-record-template.yaml" }
      - { run: "scripts/verify-subagent-task-package-scenarios" }
      - { run: "scripts/verify-digital-human-task-package-scenarios" }
      - { run: ".template-source/scripts/verify-historical-task-package .template-source/evidence/maintenance/digital-human-task-package-review-task.yaml", when: template-source }
      - { run: ".template-source/scripts/verify-historical-task-package .template-source/evidence/maintenance/lifecycle-ticket-transition-review-task-package.yaml", when: template-source }
  lifecycle:
    commands:
      - { run: "node --test scripts/fixtures/stage-tracking/tracking.test.mjs", when: template-source }
      - { run: "node --test .template-source/tooling/node/test/decision-continuation.test.mjs", when: template-source }
      - { run: "scripts/verify-user-decision-scenarios" }
      - { run: "scripts/verify-context-contract --root . --json" }
      - { run: "scripts/verify-context-contract-scenarios" }
      - { run: "node scripts/verify-business-language-scenarios" }
      - { run: "scripts/verify-context-reconciliation-scenarios" }
      - { run: "node scripts/verify-script-performance-scenarios" }
      - { run: "scripts/verify-grill-with-docs-context-scenarios" }
      - { run: "scripts/verify-strategic-context-import-scenarios" }
      - { run: "scripts/verify-lifecycle-registry" }
      - { run: "scripts/verify-lifecycle-context-query-scenarios" }
      - { run: "scripts/verify-lifecycle-checkpoint .template-spec/process/templates/lifecycle-checkpoint-template.yaml" }
      - { run: "scripts/verify-frontend-implementation-evidence --allow-template .template-spec/process/templates/frontend-implementation-plan-template.yaml" }
      - { run: "scripts/verify-frontend-implementation-evidence --allow-template .template-spec/process/templates/frontend-implementation-verification-template.yaml" }
