        input_patterns:
          - "tests/scenarios/verify-openapi-draft-validation-scenarios.mjs"
          - "scripts/verify-openapi-draft-validation-scenarios"
        depends_on: []
        failure_mode: "目录修正后对应生命周期或证据消费者接受错误引用或拒绝当前有效引用"
      - id: check.work-layout-digital-human-task-package
        resources: [native-cli]
        run: "node tests/scenarios/verify-digital-human-task-package-scenarios.mjs"
        group: work-layout
        inputs_complete: true
        input_patterns:
          - "tests/scenarios/verify-digital-human-task-package-scenarios.mjs"
          - "scripts/verify-digital-human-task-package-scenarios"
          - "scripts/verify-subagent-task-package-scenarios"
        depends_on: []
        failure_mode: "目录修正后对应生命周期或证据消费者接受错误引用或拒绝当前有效引用"
      - id: check.work-layout-user-decision
        run: "node tests/scenarios/verify-user-decision-scenarios.mjs"
        group: work-layout
        inputs_complete: true
        input_patterns:
          - "tests/scenarios/verify-user-decision-scenarios.mjs"
          - "scripts/verify-user-decision-scenarios"
        depends_on: []
        failure_mode: "目录修正后对应生命周期或证据消费者接受错误引用或拒绝当前有效引用"
      - id: check.work-layout-design-migration
        run: "node profiles/design/tests/scenarios/verify-strategic-gate-migration-scenarios.mjs"
        group: work-layout
        inputs_complete: true
        input_patterns:
          - "profiles/design/scripts/lib/strategic-gate-migration.mjs"
          - "profiles/design/.template-spec/process/schemas/strategic-gate-migration-plan.schema.json"
          - "profiles/design/tests/scenarios/verify-strategic-gate-migration-scenarios.mjs"
        depends_on: []
        failure_mode: "迁移计划拒绝配置根或越过功能、输入证据与恢复文件边界"
      - id: check.work-layout-design-fixtures
        run: "node --test .agents/skills/yss-stage-decision/tests/run-scenarios.mjs .agents/skills/yss-tactical-design/tests/run-scenarios.mjs .agents/skills/yss-frontend-scaffold-generator/scripts/scaffold-generator.test.mjs"
        group: work-layout
        inputs_complete: true
        input_patterns:
