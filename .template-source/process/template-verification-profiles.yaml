          - "scripts/lib/template-verification.mjs"
          - "scripts/lib/verification-selection.mjs"
          - "scripts/lib/verification-report.mjs"
          - ".template-source/process/template-verification-profiles.yaml"
          - ".template-source/scripts/lib/verification-preflight.mjs"
          - ".template-source/scripts/lib/verification-execution-plan.mjs"
          - ".template-source/scripts/lib/template-verification-worker.mjs"
          - "scripts/run-template-verification"
          - "scripts/verify-template-fast"
          - "tests/verification-execution.test.mjs"
        depends_on: []
        failure_mode: "任务编译、实际退出、依赖调度或复用错误"
      - id: "check.daily-preflight"
        run: "node --test tests/verification-preflight.test.mjs"
        group: "candidate-integrity"
        inputs_complete: true
        input_patterns:
          - ".template-source/scripts/lib/verification-preflight.mjs"
          - "tests/verification-preflight.test.mjs"
        depends_on: []
        failure_mode: "环境缺失未提前拒绝或无关环境被强制要求的错误"
      - id: "check.daily-report"
        resources: ["python-jsonschema"]
        run: "node --test tests/verification-report.test.mjs tests/verification-report-v2.test.mjs"
        group: "candidate-integrity"
        inputs_complete: true
        input_patterns:
          - "scripts/lib/verification-report.mjs"
          - "scripts/lib/template-verification.mjs"
          - "scripts/lib/verification-selection.mjs"
          - "scripts/lib/template-verification-runner.mjs"
          - ".template-source/scripts/lib/verification-execution-plan.mjs"
          - ".template-source/process/template-verification-profiles.yaml"
          - ".template-source/scripts/lib/verification-report-validator.mjs"
          - ".template-source/process/schemas/template-verification-report.schema.json"
          - "tests/verification-report.test.mjs"
          - "tests/verification-report-v2.test.mjs"
        depends_on: []
        failure_mode: "局部报告被当作正式报告或退出、漂移证据错误"
      - id: "check.daily-flow"
        run: "node --test tests/flow-verification-routing.test.mjs"
        group: "candidate-integrity"
        inputs_complete: true
        input_patterns:
          - "scripts/verify-template-fast"
          - "scripts/run-template-verification"
          - "scripts/lib/template-verification.mjs"
          - "scripts/lib/verification-selection.mjs"
          - "scripts/lib/verification-report.mjs"
          - ".template-source/scripts/lib/verification-execution-plan.mjs"
          - ".template-source/scripts/lib/template-verification-worker.mjs"
          - ".template-source/process/template-verification-profiles.yaml"
          - "tests/flow-verification-routing.test.mjs"
        depends_on: []
        failure_mode: "公开快检入口、范围或输出错误"
      - id: "check.daily-benchmark-syntax"
        run: "python3 -c 'import ast,pathlib; ast.parse(pathlib.Path(\".template-source/scripts/benchmark-tooling.py\").read_text())'"
        group: "candidate-integrity"
        inputs_complete: true
        input_patterns:
          - ".template-source/scripts/benchmark-tooling.py"
        depends_on: ["check.daily-flow"]
        failure_mode: "已有性能对照入口的 Python 语法错误；对照仍显式使用原组范围"
      - id: "check.cli-content-identity"
        resources: ["native-cli"]
        inputs_complete: true
        input_patterns:
          - "submodules/yss-cli"
          - "tests/cli-retirement.test.mjs"
          - "submodules/create-yss-spec/**"
        depends_on: []
        failure_mode: "原生 CLI 消费入口、兼容或来源身份错误"
      - id: "check.work-layout"
        inputs_complete: true
        input_patterns:
          - "scripts/lib/work-layout.mjs"
          - "tests/work-layout.test.mjs"
          - "tests/fixtures/work-layout-cases.json"
          - ".template-spec/process/work-layout.md"
          - ".template-source/scripts/sync-native-work-layout.mjs"
        depends_on: []
        failure_mode: "工作目录选择和历史兼容错误"
      - id: "check.work-layout-hardcodes"
        inputs_complete: true
        input_patterns:
          - "scripts/lib/work-layout.mjs"
          - "scripts/verify-work-layout"
          - "submodules/yss-harness-design-agent"
          - "submodules/yss-harness-design-agent/**"
          - ".template-source/scripts/sync-native-work-layout.mjs"
        depends_on: []
        failure_mode: "工作目录被硬编码到旧路径的错误"
  candidate:
    always_groups:
      - hygiene
      - candidate-integrity
  release:
    all_groups: true
  legacy-full:
    all_groups: true
