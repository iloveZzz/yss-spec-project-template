          - ".agents/skills/yss-tactical-design/tests/**"
          - ".agents/skills/yss-frontend-scaffold-generator/scripts/scaffold-generator.test.mjs"
        depends_on: []
        failure_mode: "默认工作包样例在阶段决策、战术设计或前端脚手架中产生失效引用"
