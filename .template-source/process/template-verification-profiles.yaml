groups:
  cli-sync:
    commands:
      - run: node --test submodules/create-yss-spec/tests/sync-fast-smoke.test.js
        when: template-source
        id: check.517fe9954d913f53
      - run: scripts/verify-repository-scope-scenarios
        when: template-source
        id: check.2b52a050306077cc
  dedicated-cli-core:
    commands:
      - run: node --test .template-source/cli-core/tests/*.test.mjs
        when: template-source
        id: check.371da192d6338e6d
  frontend-delivery:
    commands:
      - run: scripts/verify-frontend-delivery-scenarios
        lane: source-scenarios
        parallel_unless_env:
          - YSS_DEDICATED_INSTANCE_ROOT
          - YSS_DELIVERY_TEST_BACKEND_ROOT
          - YSS_DELIVERY_TEST_FRONTEND_ROOT
        id: check.1f1753b1299c14cf
      - run: node .template-source/scripts/verify-delivery-harness-distribution.mjs
        when: template-source
        lane: generated-distribution
        parallel_unless_env:
          - YSS_DEDICATED_INSTANCE_ROOT
          - YSS_DELIVERY_TEST_BACKEND_ROOT
          - YSS_DELIVERY_TEST_FRONTEND_ROOT
        id: check.629b3c9ec897593f
  strategic-handoff-package:
    commands:
      - run: scripts/verify-strategic-handoff-tools-lock
        when: template-source
        id: check.17d5665535e89587
      - run: node --check scripts/lib/strategic-handoff.mjs
        id: check.ba0fad1faed81f06
      - run: scripts/verify-strategic-handoff-package-scenarios
        id: check.83f08a7516716a38
  design-system:
    commands:
      - run: node .template-source/tooling/node/scripts/design-md.mjs lint DESIGN.md
        when: template-source
        id: check.5178854477253978
      - run: node .template-source/tooling/node/scripts/design-md.mjs drift
        when: template-source
        id: check.a27805ecf41a23e5
  hygiene:
    commands:
      - run: scripts/verify-governance-layout
        id: check.8cd499a929b8a5a4
  tooling:
    commands:
      - run: .template-source/scripts/evidence-index --check
        when: template-source
        id: check.3c6d62ea49a55255
      - run: python3 -m unittest discover -s .template-source/scripts/tests -p 'test_skills_agent_eval.py'
        when: template-source
        id: check.44ea73f718bcecec
      - run: pnpm --dir .template-source/tooling/node test
        when: template-source
        id: check.71586a7291afee4f
      - run: pnpm --dir .template-source/tooling/node check:vendor
        when: template-source
        id: check.637af2529c59dfe5
  skills:
    commands:
      - run: scripts/sync-profile-skills --check --profile=all
        when: template-source
        id: check.22712701df14f183
      - run: scripts/sync-skills --check
        id: check.4301e56b48a9d570
      - run: scripts/update-skill-lock --check
        id: check.eb4247ef92d2c0d0
      - run: node --test tests/skill-sync-efficiency.test.mjs
        when: template-source
        id: check.c80aaecf300ddc1f
      - run: scripts/verify-skill-registry
        id: check.022dccdddca70b70
      - run: scripts/verify-skill-governance
        id: check.93d2af5732ccdd96
      - run: scripts/verify-upstream-skill-source --source=iloveZzz/yss-harness-design-agent
          --source-root=submodules/yss-harness-design-agent
        when: template-source
        id: check.a74d7c2cc539e456
      - run: node --test .agents/skills/yss-skill-source-index-refresh/scripts/refresh-yss-skill-index.test.mjs
        id: check.208c7eedeff4e6e9
        inputs_complete: true
        input_patterns:
          - .agents/skills/yss-skill-source-index-refresh/**
          - tests/yss-skill-source-index.test.mjs
          - scripts/**
          - .template-spec/agents/**
