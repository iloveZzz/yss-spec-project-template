schema_version: 1
default_profile: fast
max_concurrency: 4
profiles:
  fast:
    always_groups:
      - hygiene
    checks:
      - id: check.9f66238a57e457bf
        group: lifecycle
        inputs_complete: true
        input_patterns:
          - ".template-source/derived/harness-work-unit-map.md"
          - ".template-spec/process/lifecycle-registry.yaml"
          - ".template-spec/process/schemas/lifecycle-registry.schema.json"
          - "scripts/lib/lifecycle-registry.mjs"
          - "scripts/verify-lifecycle-registry"
          - "scripts/generate-lifecycle-artifacts"
        depends_on: []
        failure_mode: "维护工作单元说明与生命周期事实源或派生输出不一致"
      - id: check.skill-registry-unit
        run: "node --test .template-source/tooling/node/test/skill-registry.test.mjs"
        group: skills-policy
        inputs_complete: true
        input_patterns:
          - "scripts/lib/skill-registry.mjs"
          - ".template-source/tooling/node/test/skill-registry.test.mjs"
          - ".template-spec/agents/yss-skill-registry.yaml"
        depends_on: []
        failure_mode: "维护技能层级或调用元数据的接受与拒绝语义回归"
      - id: check.doc-facts
        run: "node --test tests/doc-facts.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "scripts/verify-doc-facts"
          - "scripts/lib/doc-facts.mjs"
          - "scripts/lib/doc-facts-patterns.json"
          - "tests/doc-facts.test.mjs"
          - "README.md"
          - ".template-source/agents/*.md"
          - ".template-spec/agents/*.md"
          - ".template-source/contracts/harness-hardening-v1*.md"
        depends_on: []
        failure_mode: "说明文档复述门禁数、阶段数、投影根数量或硬编码与 lock 不一致的上游 revision"
      - id: check.ci-gate
        run: "node --test tests/ci-gate.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "scripts/ci-gate"
          - "scripts/ci-setup"
          - "scripts/lib/ci-gate.mjs"
          - "tests/ci-gate.test.mjs"
          - "package.json"
          - ".nvmrc"
        depends_on: []
        failure_mode: "合入检查的步骤顺序、失败退出、报告位置或 Node 版本声明一致性回归"
      - id: check.ci-adapters
        run: "node --test tests/ci-adapters.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - ".github/workflows/template-gate.yml"
          - ".github/actions/setup-template/action.yml"
          - ".gitlab-ci.yml"
          - "scripts/ci-setup"
          - "tests/ci-adapters.test.mjs"
          - ".template-source/process/github-workflows.md"
          - ".template-source/distribution/bundle-profile.json"
        depends_on: []
        failure_mode: "平台适配器混入检查逻辑、两个平台的触发或 base 取值分叉、运行时版本与 ci-setup 脱节，或合入检查说明回到旧表述"
      - id: check.agent-hook
        run: "node --test tests/agent-hook.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "scripts/agent-hook"
          - "scripts/lib/agent-hook.mjs"
          - "scripts/lib/ci-gate.mjs"
          - "tests/agent-hook.test.mjs"
          - ".claude/settings.json"
          - ".codex/hooks.json"
          - ".template-source/distribution/bundle-profile.json"
        depends_on: []
        failure_mode: "Stop hook 对相关路径漏检、对无关路径误检或误阻断、阻断协议与 Claude Code / Codex 不一致，或 hook 文件进入实例分发"
      - id: check.claude-entry
        run: "node --test tests/claude-entry.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "CLAUDE.md"
          - ".claude/skills/**"
          - "skills-lock.json"
          - ".template-spec/agents/yss-skill-registry.yaml"
          - "scripts/lib/skill-supply-chain.mjs"
          - "scripts/lib/harness-metrics.mjs"
          - "tests/claude-entry.test.mjs"
          - ".template-source/distribution/bundle-profile.json"
        depends_on: []
        failure_mode: "Claude Code 入口复制了 AGENTS.md 的内容、.claude/skills 与 canonical 脱节或不是符号链接、注册表与锁在 claude 上不一致，或 hook 设置进入实例分发"
      - id: check.explicit-invocation
        run: "node --test tests/explicit-invocation.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - ".template-spec/agents/yss-skill-registry.yaml"
          - ".agents/skills/yss-product-lifecycle/references/orchestration-contract.yaml"
          - "scripts/lib/skill-registry.mjs"
          - "tests/explicit-invocation.test.mjs"
        depends_on: []
        failure_mode: "被生命周期编排器路由或合同声明为模型调用的技能被设为显式，或显式集合被无意改动"
      - id: check.process-glossary
        run: "node --test tests/process-glossary.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "CONTEXT.md"
          - "AGENTS.md"
          - ".template-spec/process/process-glossary.md"
          - ".template-spec/agents/digital-human-roles.md"
          - ".template-source/process/template-engineering-overview.md"
          - ".agents/skills/yss-product-lifecycle/SKILL.md"
          - "scripts/lib/context-contract.mjs"
          - "scripts/lib/harness-metrics.mjs"
          - "tests/process-glossary.test.mjs"
        depends_on: []
        failure_mode: "流程术语回流到根 CONTEXT.md、术语表违反英文标识或重复规则、入口链接断开、运行时平台细节混入流程术语，或常驻读取超过预算"
      - id: check.instance-metadata
        run: "node --test --test-concurrency=1 tests/instance-metadata.test.mjs"
        group: drift-identity
        inputs_complete: true
        input_patterns:
          - "scripts/lib/instance-metadata.mjs"
          - "tests/instance-metadata.test.mjs"
        depends_on: []
        failure_mode: "实例元数据对运行时、投影根或平台技能声明的校验放行了不一致的声明，或拒绝了已登记的运行时"
      - id: check.runtime-storage
        group: runtime-storage
        inputs_complete: true
        input_patterns:
          - "scripts/runtime-store"
          - "scripts/lib/runtime-store.mjs"
          - ".template-source/cli-core/runtime-store.mjs"
          - ".template-source/scripts/measure-runtime-store.mjs"
          - "tests/runtime-store*.test.mjs"
        depends_on: []
        failure_mode: "运行记录保留、仓外落盘或实际测量入口的分发与输出错误"
      - id: check.maintenance-counterexample
        group: maintenance
        inputs_complete: true
        input_patterns:
          - ".template-source/process/maintenance-intensity*.yaml"
          - "scripts/lib/maintenance-intensity.mjs"
          - "scripts/lib/maintenance-counterexample.mjs"
          - "tests/maintenance-counterexample.test.mjs"
          - "tests/scenarios/verify-maintenance-risk-scenarios.mjs"
          - "scripts/verify-maintenance-risk-scenarios"
        depends_on: []
        failure_mode: "两级触发项遗漏、当前 L3 被接受、三类强制反例缺失或运行证据伪造"
      - id: check.5fa31f4262e122b1
        group: maintenance
        inputs_complete: true
        input_patterns:
          - ".template-source/process/maintenance-intensity*.yaml"
          - ".template-source/process/templates/maintenance-checkpoint-template.yaml"
          - "scripts/lib/maintenance-intensity.mjs"
          - "scripts/verify-maintenance-checkpoint"
          - "scripts/verify-maintenance-intensity-scenarios"
          - "tests/scenarios/verify-maintenance-intensity-scenarios.mjs"
        depends_on: []
        failure_mode: "历史等级、证据和审查语义被重解释，或当前 L2 审查模式和状态门禁失效"
      - id: check.maintenance-storage
        group: maintenance
        inputs_complete: true
        input_patterns:
          - "scripts/lib/maintenance-intensity.mjs"
          - "scripts/fixtures/maintenance-storage/scenarios.test.mjs"
        depends_on: []
        failure_mode: "历史只读记录错误授予当前状态，或仓外证据未绑定当前字节"
      - id: check.a5802dc214ecfcda
        run: "node tests/scenarios/verify-maintenance-review-workflow-scenarios.mjs"
        group: maintenance
        inputs_complete: true
        input_patterns:
          - "scripts/lib/maintenance-intensity.mjs"
          - "tests/scenarios/verify-maintenance-review-workflow-scenarios.mjs"
          - "scripts/verify-maintenance-review-workflow-scenarios"
        depends_on: []
        failure_mode: "当前 L2 正式审查的候选绑定、任务包或发布门禁未闭合"
      - id: "check.agents-wiki-structure"
        run: "node .agents/skills/llm-wiki/scripts/lint-wikilinks.mjs .template-source/wiki --repo . --structure-only"
        group: "hygiene"
        inputs_complete: true
        input_patterns:
          - ".template-source/wiki/**"
        depends_on: []
        failure_mode: "入口知识刷新产生坏链接、错误来源闭包或未完成事务；当前性另由 status 报告"
      - id: "check.agents-shared-sync"
        run: "scripts/sync-strategic-handoff-tools --check"
        group: "strategic-handoff-package"
        inputs_complete: true
        input_patterns:
          - "scripts/sync-strategic-handoff-tools"
          - ".template-spec/process/subagent-collaboration.md"
          - ".template-spec/process/stage-tracking.md"
          - ".template-source/distribution/strategic-handoff-tools.lock.json"
          - "submodules/yss-harness-*/.template-source/distribution/strategic-handoff-tools.lock.json"
        depends_on: []
        failure_mode: "共享协作和阶段路由说明未传播或来源锁仍绑定旧字节"
      - id: "check.agents-source-boundary"
        run: "node --test tests/governance-layout.test.mjs"
        group: "hygiene"
        inputs_complete: true
        input_patterns:
          - "AGENTS.md"
          - "submodules/yss-harness-*/AGENTS.md"
          - "scripts/verify-governance-layout"
          - "scripts/lib/governance-layout.mjs"
          - "tests/governance-layout.test.mjs"
        depends_on: []
        failure_mode: "当前来源缺失、重复或倒序标记被历史兼容路径静默接受"
      - id: "check.mvc-data-analysis-entry"
        run: "node --test --test-name-pattern='数据分析|AGENTS|入口' .agents/skills/yss-layered-mvc-scaffold-generator/scripts/scaffold-generator.test.mjs"
        group: "implementation"
        inputs_complete: true
        input_patterns:
          - "AGENTS.md"
          - ".agents/skills/yss-layered-mvc-scaffold-generator/scripts/**"
        depends_on: []
        failure_mode: "数据分析工程入口泄漏模板规则、工具包身份错误或非法标记产生部分输出"
      - id: "check.skill-projection-identity"
