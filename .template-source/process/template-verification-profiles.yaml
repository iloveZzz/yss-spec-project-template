schema_version: 1
default_profile: fast
max_concurrency: 4
profiles:
  fast:
    always_groups:
      - hygiene
    checks:
      - id: check.lifecycle-core-views
        run: "node --test scripts/fixtures/lifecycle-core/views.test.mjs"
        group: lifecycle
        inputs_complete: true
        input_patterns:
          - "scripts/fixtures/lifecycle-core/views.test.mjs"
          - "scripts/lib/contract-views.mjs"
        depends_on: []
        failure_mode: "任务与恢复视图丢失约束或只读边界"
      - id: check.repository-scope-scenarios
        run: "node tests/scenarios/verify-repository-scope-scenarios.mjs"
        group: lifecycle
        inputs_complete: true
        input_patterns:
          - "scripts/verify-repository-scope-scenarios"
        depends_on: []
        failure_mode: "仓库职责与 gitlink 保护引用失效"
      - id: check.9f66238a57e457bf
        group: lifecycle
        inputs_complete: true
        input_patterns:
          - ".template-source/derived/harness-work-unit-map.md"
          - ".template-spec/process/lifecycle-registry.yaml"
          - ".template-spec/process/schemas/lifecycle-registry.schema.json"
          - "scripts/lib/lifecycle-registry.mjs"
          - "scripts/verify-lifecycle-registry"
          - "scripts/generate-lifecycle-artifacts"
        depends_on: []
        failure_mode: "维护工作单元说明与生命周期事实源或派生输出不一致"
      - id: check.skill-registry-unit
        run: "node --test .template-source/tooling/node/test/skill-registry.test.mjs"
        group: skills-policy
        inputs_complete: true
        input_patterns:
          - "scripts/lib/skill-registry.mjs"
          - "scripts/lib/orchestration-contract.mjs"
          - ".template-spec/process/orchestration-contract.yaml"
          - ".template-spec/process/orchestration/**"
          - ".template-source/tooling/node/test/skill-registry.test.mjs"
          - ".template-spec/agents/yss-skill-registry.yaml"
        depends_on: []
        failure_mode: "维护技能层级或调用元数据的接受与拒绝语义回归"
      - id: check.doc-facts
        run: "node --test tests/doc-facts.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "scripts/verify-doc-facts"
          - "scripts/lib/doc-facts.mjs"
          - "scripts/lib/doc-facts-patterns.json"
          - "tests/doc-facts.test.mjs"
          - "README.md"
          - ".template-source/cli-core/README.md"
          - ".template-source/agents/*.md"
          - ".template-spec/agents/*.md"
          - ".template-source/contracts/harness-hardening-v1*.md"
          - ".template-source/contracts/architecture-iteration-v1*.md"
        depends_on: []
        failure_mode: "说明文档复述门禁数、阶段数、投影根数量或硬编码与 lock 不一致的上游 revision"
      - id: check.specialist-business-inputs
        run: "node --test tests/specialist-business-inputs.test.mjs"
        group: feature-assets
        inputs_complete: true
        input_patterns:
          - "tests/specialist-business-inputs.test.mjs"
          - "scripts/lib/profile-tree.mjs"
          - "profiles/**"
        depends_on: []
        failure_mode: "专职 Profile 的 Plan/Spec 本地路线偏离上游的唯一日常政策，业务分析角色被允许当 Worker，或专职角色被允许写另一端"
