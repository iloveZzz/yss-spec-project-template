schema_version: 1
default_level: L2
levels:
  L1:
    triggers:
      - textual-only
      - link-only
      - deterministic-projection
  L2:
    triggers:
      - local-rule
      - template-structure
      - non-core-validator
  L3:
    triggers:
      - lifecycle-gate
      - ticket-state
      - permission-boundary
      - generation-semantics
      - release-semantics
      - cross-repo-contract
      - core-validator
      - historical-important-escape
      - aggregate-behavior-change
      - release-candidate
