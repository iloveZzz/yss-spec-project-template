    - { skill: prototype-review, type: review-only }
    - { skill: yss-design-system, type: coordination-only }
    - { skill: yss-antdv-next-design, type: context-conditional, when: h2-vue-antdv-next-default }
    - { skill: yss-antd-design, type: context-conditional, when: h2-react-antd-explicit-compatibility }
  yss-ddd-scaffold-generator:
    - { skill: yss-backend-scaffold-parent, type: context-required }
    - { skill: alibaba-java-code-style, type: context-required }
  yss-layered-mvc-scaffold-generator:
    - { skill: alibaba-java-code-style, type: context-required }
  yss-domain:
    - { skill: alibaba-java-code-style, type: context-required }
    - { skill: domain-modeling, type: coordination-only }
    - { skill: yss-tactical-design, type: context-conditional, when: tactical-domain }
    - { skill: lombok, type: context-conditional, when: pojo }
  yss-tactical-design:
    - { skill: domain-modeling, type: coordination-only }
    - { skill: yss-openapi-draft-review, type: review-only, when: api-impact }
    - { skill: yss-repository, type: component-dependency, when: data-impact }
  yss-application:
    - { skill: alibaba-java-code-style, type: context-required }
    - { skill: mapstruct, type: context-conditional, when: conversion }
    - { skill: lombok, type: context-conditional, when: pojo }
  yss-repository:
    - { skill: yss-mybatis, type: context-conditional, when: mybatis }
    - { skill: mapstruct, type: context-conditional, when: conversion }
    - { skill: lombok, type: context-conditional, when: pojo }
    - { skill: alibaba-java-code-style, type: context-required }
  yss-web-controller:
    - { skill: yss-dto, type: context-required }
    - { skill: yss-validation, type: context-conditional, when: request-validation }
    - { skill: yss-exception, type: context-conditional, when: error-mapping }
    - { skill: mapstruct, type: context-conditional, when: conversion }
    - { skill: lombok, type: context-conditional, when: pojo }
    - { skill: alibaba-java-code-style, type: context-required }
  yss-userinfo:
    - { skill: yss-dto, type: component-dependency }
    - { skill: yss-cache, type: context-conditional, when: cache-lookup }
  yss-audit-log:
    - { skill: yss-userinfo, type: component-dependency }
    - { skill: yss-dto, type: component-dependency }
  yss-validation:
    - { skill: yss-exception, type: component-dependency }
  yss-security-algorithm:
    - { skill: yss-exception, type: component-dependency }
  yss-exception:
    - { skill: yss-dto, type: context-required }
  yss-ui-business-page-generation:
    - { skill: yss-components, type: context-conditional, when: components }
    - { skill: yss-hook, type: context-conditional, when: hooks }
    - { skill: yss-formily, type: context-conditional, when: form }
    - { skill: yss-api-integration, type: context-conditional, when: api }
  yss-api-integration:
    - { skill: yss-openapi-governance, type: context-conditional, when: regeneration }
invocation_contract:
  schema_version: 2
  scope: discovery-only
  required_fields: [invocation_mode, trigger_conditions, exclusion_conditions, primary_output]
  allowed_invocation_modes: [user, model, both]
  trigger_source: impacts
  trigger_encoding: "impact:<impact>"
  default:
    invocation_mode: model
    trigger_conditions: [registered-skill-request]
    exclusion_conditions: [no-trigger-match]
    primary_output: skill-guidance
  layer_defaults:
    core:
      invocation_mode: both
      primary_output: workflow-result
    specialist:
      invocation_mode: model
      primary_output: implementation-guidance
    compatibility:
      invocation_mode: user
      primary_output: explicit-user-compatibility-input
    maintainer-only:
      invocation_mode: user
      primary_output: maintenance-operation
  overrides:
    yss-prototype-stage:
      invocation_mode: both
      trigger_conditions: [impact:prototype]
      exclusion_conditions: [no-product-design-impact]
      primary_output: artifact.prototype-deliverable
    yss-antd-design:
      invocation_mode: model
      trigger_conditions: [prototype-profile:H2, component-basis:react-antd]
      exclusion_conditions: [prototype-profile:H1, component-basis:not-antd]
      primary_output: versioned-antd-facts
    yss-antdv-next-design:
      invocation_mode: model
      trigger_conditions: [prototype-profile:H2, component-basis:vue-antdv-next]
      exclusion_conditions: [prototype-profile:H1, component-basis:not-antdv-next, production-frontend-implementation]
      primary_output: versioned-antdv-next-facts
