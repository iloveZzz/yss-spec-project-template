    command: pnpm --dir .template-source/tooling/node test
    result: pass
  - kind: self-check
    command: node --test .agents/skills/yss-layered-mvc-scaffold-generator/scripts/scaffold-generator.test.mjs
    result: pass
  - kind: self-check
    command: scripts/verify-frontend-delivery-scenarios
