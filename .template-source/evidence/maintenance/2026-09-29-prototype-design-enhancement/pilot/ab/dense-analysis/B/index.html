<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>资料检查分析</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="contract.css">
  <link rel="stylesheet" href="styles.css">
  <script src="scenarios.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#name-filter">跳至资料名称筛选</a>
  <header class="app-header">
    <div class="app-identity">
      <svg class="app-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/><path d="m14 17 3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>资料检查</span>
    </div>
    <span class="header-context">检查分析</span>
  </header>

  <main>
    <div class="page-heading">
      <h1>资料检查分析</h1>
      <p>查看检查结果，按资料名称快速定位。</p>
    </div>

    <section class="summary-panel" aria-label="全部资料检查汇总">
      <dl class="summary-grid">
        <div class="metric">
          <dt>总检查</dt>
          <dd id="total-checks">240</dd>
        </div>
        <div class="metric">
          <dt><span class="status-dot error-dot" aria-hidden="true"></span>异常</dt>
          <dd id="total-errors">9</dd>
        </div>
        <div class="metric">
          <dt><span class="status-dot pending-dot" aria-hidden="true"></span>待处理</dt>
          <dd id="total-pending">6</dd>
        </div>
      </dl>
      <p class="summary-note">全部资料汇总，不随名称筛选变化</p>
    </section>

    <section class="data-panel" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">资料明细</h2>
        <span class="section-note">逐项查看检查结果</span>
      </div>
      <form id="filter-form" class="filter-form" role="search" aria-label="筛选资料">
        <div class="filter-field">
          <label for="name-filter">资料名称</label>
          <input id="name-filter" name="name" type="search" placeholder="输入资料名称关键词" autocomplete="off">
        </div>
        <div class="filter-actions">
          <button type="submit" class="button primary">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="m10 10 3.75 3.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            查询
          </button>
          <button id="clear-filter" type="button" class="button">重置筛选</button>
        </div>
      </form>
      <div class="result-bar">
        <p id="result-status" role="status" aria-live="polite" aria-atomic="true">显示全部 3 项资料</p>
        <span class="scroll-hint" id="scroll-hint">左右滑动查看全部列 →</span>
      </div>
      <div id="table-scroll" class="table-scroll" role="region" aria-label="资料明细表格，可横向滚动" aria-describedby="scroll-hint" tabindex="0">
        <table>
          <caption class="sr-only">资料检查明细，包含名称、检查数量、异常数量、负责人、状态和更新时间。</caption>
          <colgroup>
            <col class="col-name"><col class="col-number"><col class="col-number"><col class="col-owner"><col class="col-status"><col class="col-time">
          </colgroup>
          <thead>
            <tr>
              <th scope="col" class="name-cell">资料名称</th>
              <th scope="col" class="numeric">检查数量</th>
              <th scope="col" class="numeric">异常数量</th>
              <th scope="col">负责人</th>
              <th scope="col">状态</th>
              <th scope="col">更新时间</th>
            </tr>
          </thead>
          <tbody id="records"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <p class="empty-title">未找到匹配的资料</p>
        <p>请更换名称关键词，或重置筛选查看全部资料。</p>
        <button id="empty-reset" type="button" class="button">重置筛选</button>
      </div>
      <div class="table-note">
        <span>“未提供”表示负责人信息为空</span>
        <span id="record-count">共 3 项资料</span>
      </div>
      <noscript><p class="noscript-note">请启用 JavaScript，以显示随包资料并使用名称筛选。</p></noscript>
    </section>
  </main>

  <aside class="review-tools" aria-label="设计草案评测工具">
    <div class="review-copy"><span class="draft-label">设计草案</span><span id="scenario-label">场景：primary</span></div>
    <button id="reset-scenario" type="button" class="button">重置场景</button>
    <p id="scenario-notice" role="status" aria-live="polite" hidden></p>
  </aside>
</body>
</html>
