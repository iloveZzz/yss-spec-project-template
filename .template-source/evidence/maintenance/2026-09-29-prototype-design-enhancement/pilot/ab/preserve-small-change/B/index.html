<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>资料查询</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script src="scenarios.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>资料查询</h1>
    <form><label>名称或编号<input id="query"></label><button>查询</button><button type="reset">重置查询</button></form>
    <p id="count" role="status" aria-live="polite" aria-atomic="true"></p>
    <div class="table-scroll" role="region" aria-label="资料列表" tabindex="0">
      <table>
        <thead><tr><th scope="col">编号</th><th scope="col">资料名称</th><th scope="col">负责人</th><th scope="col">状态</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <aside class="prototype-tools" aria-label="原型评测工具">
    <span id="scenario-status" role="status">评测场景：primary</span>
    <button type="button" id="reset-scenario">重置场景</button>
  </aside>
</body>
</html>
