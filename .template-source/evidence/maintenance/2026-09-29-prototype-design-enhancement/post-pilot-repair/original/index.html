<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料查询</title><link rel="stylesheet" href="tokens.css"><style>body{font:var(--brand-font-size)/var(--brand-line-height) var(--brand-font-family);color:var(--brand-color-text);background:var(--brand-color-bg-layout)}main{padding:var(--brand-size);background:var(--brand-color-bg-container)}td,th{padding:var(--brand-size-sm);text-align:left}td{white-space:nowrap}button,input{font:inherit;min-height:var(--yss-control-height)}</style><main><h1>资料查询</h1><form><label>名称或编号<input id="query"></label><button>查询</button><button type="reset">重置查询</button></form><p id="count"></p><table><thead><tr><th>编号</th><th>资料名称</th><th>负责人</th><th>状态</th></tr></thead><tbody></tbody></table></main><script>const rows=[{"id": "M-001", "name": "季度经营分析资料", "owner": "张明", "status": "待核对", "checks": 120, "errors": 4, "updated": "2026-09-29 09:30"}, {"id": "M-002", "name": "跨部门业务协作与异常处理说明（长名称示例）", "owner": "李华", "status": "待核对", "checks": 80, "errors": 3, "updated": "2026-09-29 10:00"}, {"id": "M-003", "name": "归档清单", "owner": "", "status": "待处理", "checks": 40, "errors": 2, "updated": "2026-09-29 10:30"}];const form=document.querySelector('form');function show(){const data=rows.filter(x=>(x.id+x.name).includes(document.querySelector('#query').value));document.querySelector('tbody').replaceChildren();for(const r of data){const tr=document.createElement('tr');for(const key of ['id','name','owner','status']){const td=document.createElement('td');td.textContent=r[key]||'未填写';tr.append(td)}document.querySelector('tbody').append(tr)}document.querySelector('#count').textContent=data.length?'共 '+data.length+' 条':'暂无数据'}form.onsubmit=e=>{e.preventDefault();show()};form.onreset=()=>setTimeout(show);show();</script></html>
