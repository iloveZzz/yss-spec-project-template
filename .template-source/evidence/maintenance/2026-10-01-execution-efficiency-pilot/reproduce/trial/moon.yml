{
  "tasks": {
    "schema": {
      "command": [
        "node",
        "task.mjs",
        "schema"
      ],
      "toolchains": "system",
      "inputs": [
        "task.mjs",
        "inputs/**/*",
        "inputs/ignored.json",
        "$PILOT_MODE"
      ],
      "outputs": [
        "out/schema"
      ],
      "options": {
        "cache": "local",
        "shell": false
      }
    },
    "query": {
      "command": [
        "node",
        "task.mjs",
        "query"
      ],
      "toolchains": "system",
      "inputs": [
        "task.mjs",
        "inputs/**/*",
        "inputs/ignored.json",
        "$PILOT_MODE"
      ],
      "outputs": [
        "out/query"
      ],
      "options": {
        "cache": "local",
        "shell": false
      },
      "deps": [
        {
          "target": "~:schema",
          "cacheStrategy": "hash"
        }
      ]
    },
    "checks": {
      "command": [
        "node",
        "task.mjs",
        "checks"
      ],
      "toolchains": "system",
      "inputs": [
        "task.mjs",
        "inputs/**/*",
        "inputs/ignored.json",
        "$PILOT_MODE"
      ],
      "outputs": [
        "out/checks"
      ],
      "options": {
        "cache": "local",
        "shell": false
      },
      "deps": [
        {
          "target": "~:query",
          "cacheStrategy": "hash"
        }
      ]
    }
  }
}