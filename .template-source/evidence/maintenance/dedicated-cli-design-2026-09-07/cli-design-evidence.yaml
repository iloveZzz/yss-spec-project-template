  "scope": {
    "topic": "新增前后端专职 CLI 的本地源码约束",
    "audience": "主控设计起草者、提问者与后续独立审查者",
    "time_horizon": "2026-09-07 本地源码观察；源码变化后按哈希重新核对",
    "research_questions": [
      "当前两个 repository-local 初始化脚本相同且依赖源仓 Git；--allow-working-tree 不取消该依赖，不能直接把现脚本当成无 Git 源仓的 npm 初始化运行时。",
      "仓内专职实例 metadata 与现 dev CLI 的字段、受管文件基线及链接/mode 表达不同；旧格式兼容必须显式处理，现宽松历史读取路径不等于转换。",
      "专职 profile/metadata 身份已存在；当前家族 guard 拒绝异族与多重身份，并检查已声明 cli_package，因此新 CLI 兼容 repository-local profile 需受控同族规则。",
      "在已列明的三个 CLI package/src、dev scripts 与父模板 scripts/sync-* 和 .template-source/scripts 范围，未发现独立共享 CLI 核心依赖或源码投影生成器；此结论不覆盖未检索生态。",
      "现 dev 初始化消费包内模板快照并检查提交与摘要；快照构建另有本地 working-tree 模式，故发布候选仍需显式锁定完整来源提交。",
      "旧 CLI 身份合同的不新增专职 npm 包/同步是当时维护范围；该文档同时有持久身份保护，后续新增入口设计须清楚区分替代范围与继承不变量。",
      "现 dev attach 用于无本族 metadata 的目标；已有本族 metadata 被要求走 sync，因此普通 attach 与专职旧实例接管应在新设计中分开描述。"
    ],
    "inclusion_criteria": [
      "仅当前仓及已登记子模块第一方源码、配置、分发合同",
      "只纳入影响新 CLI 初始化、兼容、核心复用和快照设计的事实"
    ],
    "exclusion_criteria": [
      "不研究竞品、npm 名称占用或账号权限",
      "不执行初始化、测试、发布、提交或推送；不以历史测试自述证明当前行为"
    ]
