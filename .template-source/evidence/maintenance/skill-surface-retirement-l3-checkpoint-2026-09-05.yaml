  - scripts/lib/skill-governance.mjs
  - scripts/lib/skill-supply-chain.mjs
  - scripts/verify-retired-skill-ids
  - skills-lock.json
  - yss-public-skills.json
verification_evidence:
  - kind: self-check
    command: >-
      scripts/verify-skill-registry && scripts/verify-skill-governance &&
      scripts/verify-digital-human-roles-scenarios && scripts/verify-matt-yss-integration-scenarios
    result: pass
  - kind: projection-sync
    command: scripts/sync-skills --check && scripts/update-skill-lock --check
    result: pass
  - kind: retirement-regression
    command: scripts/verify-retired-skill-ids
    result: pass
  - kind: targeted-tests
    command: >-
      node --test .template-source/tooling/node/test/yss-ui-skill-integration.test.mjs
      .template-source/tooling/node/test/skill-registry.test.mjs
    result: pass
  - kind: backend-retention-audit
    command: scripts/audit-yss-backend-skills --check
    result: pass
  - kind: fresh-verification
    command: scripts/verify-template-fast
    result: pass
review_mode: self-check
escalation: >-
  本 checkpoint 仅达到 implementation-ready，不代表候选冻结、提交、推送或发布批准；
  Wiki 仍有本轮开始前已存在的 4 个 live-source drift，需在其所属维护范围内另行 refresh。
target_state: implementation-ready
current_state: implementation-ready
verification_profile: fast
review_round: 0
candidate_digest: null
