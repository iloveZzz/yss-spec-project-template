schema_version: 2
intensity: L3
classification_reason: >-
  一次性硬退役 14 个共享技能，删除 canonical 与六个生成投影中的物理目录，
  同步收敛技能注册表、锁文件、生命周期路由、数字人角色、前端集成合同和退役扫描器；
  该变更改变默认技能供应面与聚合路由行为，命中 aggregate-behavior-change。
triggers:
  - aggregate-behavior-change
