schema_version: 2
intensity: L3
classification_reason: >-
  统一根目录 CONTEXT.md、生命周期批准前对账、阶段包 schema、战略跨仓交接、
  核心验证器与 CLI 生成合同，命中 lifecycle-gate、cross-repo-contract、
  core-validator 与 aggregate-behavior-change。
triggers:
  - lifecycle-gate
  - cross-repo-contract
  - core-validator
  - aggregate-behavior-change
changed_assets:
  - CONTEXT.md
  - AGENTS.md
  - .agents/skills/domain-modeling/
  - .agents/skills/grill-with-docs/
  - .agents/skills/setup-matt-pocock-skills/
  - .agents/skills/wait-what/
  - .agents/skills/yss-product-lifecycle/
  - .agents/skills/yss-stage-decision/
  - .agents/skills/yss-tactical-design/
  - docs/process/schemas/context-reconciliation.schema.json
  - docs/process/schemas/strategic-design-handoff.schema.json
  - docs/process/lifecycle-registry.yaml
  - scripts/lib/context-contract.mjs
  - scripts/verify-context-contract
  - scripts/verify-context-reconciliation
  - scripts/verify-strategic-context-import
  - submodules/yss-harness-design-agent
  - submodules/create-yss-spec
  - submodules/create-yss-strategic-design
  - skills-lock.json
verification_evidence:
  - kind: red
    command: .template-source/evidence/maintenance/context-contract-l3-red-green-2026-09-04.md
    result: pass
  - kind: green
    command: scripts/verify-context-contract-scenarios && scripts/verify-context-reconciliation-scenarios && scripts/verify-strategic-context-import-scenarios
    result: pass
  - kind: refactor
    command: .template-source/evidence/maintenance/context-contract-l3-red-green-2026-09-04.md
    result: pass
  - kind: pressure-scenario
    command: node .agents/skills/yss-stage-decision/tests/run-scenarios.mjs && scripts/verify-grill-with-docs-context-scenarios
    result: pass
  - kind: cross-repository-verification
    command: cd submodules/create-yss-spec && node --test tests/*.test.js && cd ../create-yss-strategic-design && npm test
    result: pass
  - kind: self-check
    command: scripts/sync-skills --check && scripts/update-skill-lock --check && scripts/verify-skill-governance
    result: pass
  - kind: fresh-verification
    command: scripts/verify-template-fast
    result: pass
review_mode: self-check
escalation: >-
  none；当前仅达到跨仓模板维护 implementation-ready，不代表已冻结候选、已提交、
  已推送或已获得 release-ready 批准。
target_state: implementation-ready
current_state: implementation-ready
verification_profile: fast
review_round: 0
candidate_digest: null
