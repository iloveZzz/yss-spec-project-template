schema_version: 1
intensity: L2
classification_reason: >-
  更新设计系统默认主题与 Agent 执行清单（local-rule），
  以及 skill 投影 / skills-lock 结构（template-structure）。
  未改生命周期门禁稳定 ID、Ticket 五态或 Router 运行时闭包。
  原始 Less 不是 SSOT；暗色未按新 seed 重派生。
  focused-independent 审查尚未由非实施者完成，故本文件还不能作为 L2 通过证据。
