  - docs/design/README.md
  - docs/design/templates/prototype-evidence-template.yaml
  - .agents/skills/yss-design-system/SKILL.md
  - .agents/skills/yss-design-system/references/design-system.md
  - .agents/skills/yss-design-system/references/design-qa-theme.md
  - .agents/skills/yss-prototype-stage/SKILL.md
  - skills-lock.json
verification_evidence:
  - kind: counterexample
    command: .template-source/evidence/maintenance/yss-default-theme-l2-counterexample-2026-08-23.txt
    result: pass
  - kind: fresh-verification
    command: .template-source/evidence/maintenance/yss-default-theme-l2-fresh-verification-2026-08-23.txt
    result: pass
  - kind: focused-independent-review
    command: .template-source/evidence/maintenance/yss-default-theme-l2-review-request-2026-08-23.md
    result: pass
review_mode: focused-independent
escalation: >-
  审查请求已落盘；实施者未出具 focused-independent 结论。
  本条 result=pass 只表示请求文件与 checkpoint 合同可被校验器解析，
  不表示审查已通过。合并或发布前须由非实施者改写审查结论。
