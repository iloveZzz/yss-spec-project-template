routing:
  - patterns: [DESIGN.md, "docs/design/**", ".template-source/tooling/node/scripts/design-md.mjs"]
    groups: [design-system]
  - patterns: [AGENTS.md, CONTEXT.md, yss-project.yaml, package.json, .gitignore, README.md, "docs/**"]
    groups: [hygiene]
  - patterns: [AGENTS.md, yss-project.yaml, "docs/process/template-engineering-overview.md"]
    groups: [governance-release]
  - patterns: [skills-lock.json, ".agents/skills/**", ".claude/skills/**", ".codex/skills/**", ".cursor/skills/**", ".pi/skills/**", ".qoder/skills/**", ".trae/skills/**", "docs/agents/yss-skill-registry.yaml", "docs/agents/skills-maintenance.md", "scripts/*skill*"]
    groups: [skills]
  - patterns: [.mcp.json, .agents/mcp_config.json, .cursor/mcp.json, .vscode/mcp.json, docs/user-guide/yss-ui-mcp.md, docs/agents/yss-ui-skills-integration.md]
    groups: [skills]
  - patterns: [.agents/skills/.strategic-design-skills-manifest.json, docs/agents/strategic-design-skills-integration.md, submodules/yss-harness-design-agent/**]
    groups: [skills]
  - patterns: ["docs/process/maintenance-*", "docs/process/harness-process-tailoring.md", "docs/process/schemas/maintenance-*", "scripts/*maintenance*", "scripts/lib/maintenance-*"]
    groups: [maintenance]
  - patterns: ["docs/process/lifecycle-*", "docs/process/templates/lifecycle-*", "scripts/*lifecycle*", "scripts/lib/lifecycle-*"]
    groups: [lifecycle]
  - patterns: ["docs/agents/digital-human-*", "docs/process/schemas/*task-package*", "docs/templates/subagent-task-package-template.md", "scripts/*task-package*", "scripts/*digital-human*", "scripts/lib/task-package*"]
    groups: [collaboration]
  - patterns: [".agents/skills/code-review/**", ".agents/skills/maintaining-skills/**"]
    groups: [maintenance, collaboration]
  - patterns: ["docs/templates/openapi-*", ".agents/skills/yss-openapi-*/**", ".agents/skills/yss-dto/**", "scripts/*openapi*", "scripts/*dto*"]
    groups: [contracts]
  - patterns: ["docs/process/implementation-*", "scripts/*repository*", "scripts/*implementation*", "scripts/*scaffold*", "scripts/*prototype*"]
    groups: [implementation]
  - patterns: [".template-source/**", "scripts/vendor/**"]
    groups: [tooling]
  - patterns: [".github/**"]
    groups: [candidate-integrity]
  - patterns: ["submodules/**"]
    groups: [implementation]
  - patterns: ["scripts/**"]
    groups: [hygiene]
groups:
  design-system:
    commands:
      - { run: "node .template-source/tooling/node/scripts/design-md.mjs lint DESIGN.md", when: template-source }
      - { run: "node .template-source/tooling/node/scripts/design-md.mjs drift", when: template-source }
  hygiene:
    commands: []
  tooling:
    commands:
      - { run: ".template-source/scripts/evidence-index --check", when: template-source }
      - { run: "pnpm --dir .template-source/tooling/node test", when: template-source }
      - { run: "pnpm --dir .template-source/tooling/node check:vendor", when: template-source }
  skills:
    commands:
      - { run: "scripts/sync-skills --check" }
      - { run: "scripts/update-skill-lock --check" }
      - { run: "scripts/verify-skill-registry" }
      - { run: "scripts/verify-skill-governance" }
      - { run: "scripts/verify-upstream-skill-source --source=iloveZzz/yss-harness-design-agent --source-root=submodules/yss-harness-design-agent", when: template-source }
      - { run: "node .agents/skills/yss-antdv-next-design/tests/run-scenarios.mjs" }
  tactical-design:
    commands:
      - { run: "node --check .agents/skills/yss-tactical-design/scripts/validate-tactical-design.mjs" }
      - { run: "node --check .agents/skills/yss-tactical-design/tests/run-scenarios.mjs" }
      - { run: "node .agents/skills/yss-tactical-design/tests/run-scenarios.mjs" }
  contracts:
    commands:
      - { run: "scripts/verify-yss-dto-openapi-profile" }
      - { run: "scripts/verify-yss-dto-openapi-scenarios" }
      - { run: "scripts/verify-openapi-yaml-first-scenarios" }
      - { run: "scripts/verify-openapi-json-handoff-scenarios" }
  collaboration:
    commands:
      - { run: "scripts/verify-digital-human-roles" }
      - { run: "scripts/verify-digital-human-roles-scenarios" }
      - { run: "scripts/verify-approval-record docs/templates/approval-record-template.yaml" }
      - { run: "scripts/verify-subagent-task-package-scenarios" }
      - { run: "scripts/verify-digital-human-task-package-scenarios" }
      - { run: "scripts/verify-digital-human-task-package .template-source/evidence/maintenance/digital-human-task-package-review-task.yaml", when: template-source }
      - { run: "scripts/verify-digital-human-task-package .template-source/evidence/maintenance/lifecycle-ticket-transition-review-task-package.yaml", when: template-source }
  lifecycle:
    commands:
      - { run: "scripts/verify-context-contract --root . --json" }
      - { run: "scripts/verify-context-contract-scenarios" }
      - { run: "node scripts/verify-business-language-scenarios" }
      - { run: "scripts/verify-context-reconciliation-scenarios" }
      - { run: "scripts/verify-grill-with-docs-context-scenarios" }
      - { run: "scripts/verify-strategic-context-import-scenarios" }
      - { run: "scripts/verify-lifecycle-registry" }
      - { run: "scripts/verify-lifecycle-checkpoint docs/process/templates/lifecycle-checkpoint-template.yaml" }
      - { run: "scripts/verify-frontend-implementation-evidence --allow-template docs/process/templates/frontend-implementation-plan-template.yaml" }
      - { run: "scripts/verify-frontend-implementation-evidence --allow-template docs/process/templates/frontend-implementation-verification-template.yaml" }
      - { run: "scripts/verify-frontend-implementation-evidence-scenarios" }
      - { run: "scripts/verify-scaffold-architecture-decisions --allow-template docs/process/templates/scaffold-architecture-decisions-template.yaml" }
      - { run: "scripts/verify-scaffold-architecture-decision-scenarios" }
      - { run: "scripts/verify-lifecycle-scenarios" }
      - { run: "scripts/verify-lifecycle-transition-scenarios" }
  maintenance:
    commands:
      - { run: "scripts/verify-maintenance-checkpoint .template-source/evidence/maintenance/yss-tactical-design-l3-checkpoint-2026-08-27.yaml", when: template-source }
      - { run: "scripts/verify-maintenance-intensity-scenarios" }
      - { run: "node scripts/verify-maintenance-review-workflow-scenarios" }
  implementation:
    commands:
      - { run: "scripts/verify-implementation-path-scenarios" }
      - { run: "scripts/verify-repository-scope-scenarios" }
      - { run: "scripts/verify-scaffold-generator-scenarios" }
      - { run: "node --test .agents/skills/yss-ddd-scaffold-generator/scripts/scaffold-generator.test.mjs" }
      - { run: "node --test .agents/skills/yss-layered-mvc-scaffold-generator/scripts/scaffold-generator.test.mjs" }
      - { run: "scripts/verify-prototype-backend-scaffold-scenarios" }
      - { run: "scripts/verify-matt-yss-integration-scenarios" }
      - { run: "scripts/verify-yss-implementation-contract-compiler-scenarios" }
      - { run: "scripts/generate-yss-skill-boundaries --check" }
      - { run: "scripts/audit-yss-backend-skills --check" }
      - { run: "scripts/verify-retired-skill-ids" }
      - { run: "scripts/verify-yss-ui-scenarios" }
      - { run: "scripts/verify-yss-prototype-contract-scenarios" }
      - { run: "node .agents/skills/yss-prototype-stage/scripts/prototype-contract.mjs validate-evidence docs/design/templates/prototype-evidence-template.yaml --allow-template" }
      - { run: "node .agents/skills/yss-prototype-stage/scripts/visual-baseline-contract.mjs validate docs/design/templates/visual-baseline-template.yaml --allow-template" }
  governance-release:
    commands:
      - { run: "scripts/verify-governance-release" }
  candidate-integrity:
    commands:
      - { run: "node scripts/verify-template-verification-scenarios" }
      - { run: "node scripts/verify-template-cache-scenarios" }
