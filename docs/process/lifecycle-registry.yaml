schema_version: 1
registry_id: yss.lifecycle
status: shadow
description: >-
  YSS 生命周期结构化事实源。Phase 1 以 shadow/check 方式派生结构表并校验漂移，
  不切换任何运行时状态 schema 或人工批准语义。
id_policy:
  pattern: '^(stage|gate|artifact|work-unit|evidence)\.[a-z0-9][a-z0-9-]*$'
  published_ids_immutable: true
  baseline: docs/process/lifecycle-registry-baseline.json
  deprecated_ids: [artifact.high-fidelity-html-prototype, work-unit.fresh-verification, work-unit.independent-review]

stages:
  - id: stage.entry-triage
    name: 入口分诊
    goal: 确认仓库身份、问题范围和影响面。
    exit_criteria: yss-project.yaml 合法，影响面和最近可信阶段可解释。
  - id: stage.discovery
    name: Discovery
    goal: 澄清问题、用户、约束和机会。
    exit_criteria: 问题边界、关键假设和待确认项已记录。
  - id: stage.spec-architecture
    name: Spec / 功能架构
    goal: 固化解决方案和功能边界。
    exit_criteria: Spec 基线和功能边界可审查。
  - id: stage.product-design
    name: 产品设计
    goal: 在存在产品设计影响时校准页面流和状态。
    exit_criteria: 命中的设计门禁通过；未命中项记录 not-applicable 及原因。
  - id: stage.system-data-engineering
    name: 系统 / 数据架构与工程契约
    goal: 固化系统、数据、工程基线和 API 契约。
    exit_criteria: 受影响工程契约冻结或记录无 API 影响；required 脚手架证据齐全。
  - id: stage.ticket-formalization
    name: Ticket 正式化
    goal: 将冻结范围拆为可追踪的父 Ticket 和垂直切片。
    exit_criteria: 工作单元窄、依赖清晰、验收和测试 seam 可执行。
  - id: stage.vertical-slice-implementation
    name: 垂直切片实现
    goal: 以批准合同驱动 TDD 实现和跨仓库协作。
    exit_criteria: 允许写路径、禁止模式、证据和验证命令全部满足。
  - id: stage.verification-release-retrospective
    name: 验证 / 发布 / 复盘
    goal: 完成 fresh verification、发布和回顾。
    exit_criteria: 所有命中门禁通过，人工审查点已完成，checkpoint 可追溯。

evidence:
  - id: evidence.context-reconciliation
    name: Context Reconciliation 证据
    description: 工作单元在批准或流转前对根目录唯一 CONTEXT.md 的稳定术语回写、作用域解析和双摘要核对结果；不新增门禁。
  - id: evidence.impact-assessment
    name: 影响面分析记录
    description: 受影响仓库、资产、风险与最近可信阶段。
  - id: evidence.domain-strategy-review
    name: DDD 战略设计评审证据
    description: 子域、限界上下文、统一语言、Context Map、场景和不变量的结构化评审结果。
    public_name: 业务边界与规则评审证据
    public_description: 业务板块、业务责任区、统一业务词汇、协作与交接关系、关键场景和不可违反规则的结构化评审结果。
  - id: evidence.tactical-design-review
    name: DDD 战术设计评审证据
    description: 聚合、Entity、Value Object、不变量、状态机、一致性、Gateway 与 API 隔离的结构化评审结果。
  - id: evidence.stage-decision-package
    name: 阶段决策包验证证据
    description: 阶段决策包的 Schema、引用、语义一致性、影响传播和下游消费验证结果。
  - id: evidence.maintenance-intensity-checkpoint
    name: 模板维护强度 checkpoint
    description: template-source 变更的 L1 / L2 / L3 分级、触发项、最低验证证据、review 模式和升级记录。
  - id: evidence.repository-identity-check
    name: 仓库身份校验结果
    description: yss-project.yaml 的合法性与 repository_mode 裁决。
  - id: evidence.approval-record
    name: 人工批准记录
    description: 对需要人工批准的 Spec、设计、契约或发布裁决的可追溯记录。
  - id: evidence.design-review-result
    name: 设计审查结果
    description: API、架构或产品设计审查意见及处理结果。
  - id: evidence.prototype-review-result
    name: 原型评审结果
    description: 低保真页面、流程、状态与 API 反推的独立评审结论和阻断项。
  - id: evidence.antd-cli-validation
    name: Ant Design CLI 校验证据
    description: 设计语言、组件、demo、token、semantic 与 lint 的实际 CLI/目标版本和可读输出引用。
  - id: evidence.browser-prototype-verification
    name: 浏览器原型验证证据
    description: 高保真原型的非空渲染、主流程、异常状态、视口和控制台验证记录。
  - id: evidence.prototype-profile-decision
    name: 原型档位选择证据
    description: 基于低保真评审后的风险触发、决定目标、H1/H2 计算结果以及人工升降级依据。
  - id: evidence.prototype-deliverable-verification
    name: 原型交付物验证证据
    description: schema v3 共同证据与所选档位的浏览器、Design QA、无障碍、组件事实或真实组件合同验证结果。
  - id: evidence.prototype-confirmation
    name: 原型用户确认记录
    description: 高保真原型、验证清单和进入下游阶段范围的人工确认结论。
  - id: evidence.openapi-draft-review
    name: OpenAPI Draft 审查记录
    description: P0、错误、分页、幂等和契约测试审查记录。
  - id: evidence.contract-approval
    name: Slice 合同批准记录
    description: 生命周期编排器批准且已持久化的当前版本合同引用。
  - id: evidence.yss-skill-execution-result
    name: YSS Skill Execution Result
    description: 专项 skill 的合同版本、写入、验证、延期 seam 与偏离证据。
  - id: evidence.frontend-implementation-verification
    name: 前端实现还原验证证据
    description: UI 实现相对冻结原型和 Spec 的桌面/窄屏视觉、状态、交互、控制台与 pnpm 验证记录。
  - id: evidence.fresh-verification
    name: Fresh Verification 记录
    description: 本轮实际执行的验证命令、结果和时间。
  - id: evidence.checkpoint-and-rollback
    name: Checkpoint 与回滚点
    description: 可追溯的变更边界、发布记录和恢复动作。

gates:
  - id: gate.repository-identity-valid
    name: 仓库身份校验
    stage: stage.entry-triage
    trigger: 每次进入流程。
    evidence: [evidence.repository-identity-check]
  - id: gate.domain-strategy-approved
    name: DDD 战略设计批准
    stage: stage.discovery
    trigger: 存在 DDD 战略设计影响或需要确定领域边界、统一语言和核心规则。
    public_name: 业务边界与规则确认
    public_trigger: 需要确定业务板块、业务责任区、统一业务词汇、协作关系或关键规则。
    evidence: [evidence.domain-strategy-review, evidence.approval-record]
  - id: gate.stage-decision-package-approved
    name: 阶段决策包批准
    stage: stage.discovery
    trigger: Discovery 到 Spec 入口需要稳定的阶段决策合同。
    evidence: [evidence.stage-decision-package, evidence.approval-record]
    requires_gates: [gate.domain-strategy-approved]
  - id: gate.spec-baseline-approved
    name: Spec 基线批准
    stage: stage.spec-architecture
    trigger: 新功能、行为变化或范围扩大进入 Spec 基线。
    evidence: [evidence.approval-record]
  - id: gate.prototype-reviewed
    name: 原型评审
    stage: stage.product-design
    trigger: 命中产品设计影响，且低保真页面、流程、状态或 API 反推需要独立评审。
    evidence: [evidence.prototype-review-result]
  - id: gate.prototype-verified
    name: 原型交付物验证
    stage: stage.product-design
    trigger: 产品设计影响需要通过 H1/H2 原型交付物进行视觉或流程校准；真实组件验证留到前端实现阶段。
    evidence: [evidence.prototype-profile-decision, evidence.prototype-deliverable-verification]
  - id: gate.user-confirmation
    name: 用户确认
    stage: stage.product-design
    trigger: 产品设计影响尚未被人工确认。
    evidence: [evidence.prototype-confirmation]
  - id: gate.openapi-draft-reviewed
    name: OpenAPI Draft Review
    stage: stage.system-data-engineering
    trigger: 有 API 影响且 Draft 已生成。
    evidence: [evidence.openapi-draft-review]
  - id: gate.design-reviewed
    name: 设计审查
    stage: stage.system-data-engineering
    trigger: API 或架构影响。
    evidence: [evidence.design-review-result]
  - id: gate.openapi-frozen
    name: OpenAPI Freeze
    stage: stage.system-data-engineering
    trigger: API 进入实现。
    evidence: [evidence.approval-record]
  - id: gate.engineering-baseline-accepted
    name: 工程基线
    stage: stage.system-data-engineering
    trigger: 后端、前端或高风险工程变化。
    evidence: [evidence.fresh-verification]
  - id: gate.architecture-reviewed
    name: 架构审查
    stage: stage.system-data-engineering
    trigger: 高风险或跨边界变化。
    evidence: [evidence.design-review-result]
  - id: gate.slice-contract-approved
    name: Slice Implementation Contract 批准
    stage: stage.ticket-formalization
    trigger: Agent 进入实现；脚手架完成后每个后续生成代码工作单元。
    evidence: [evidence.contract-approval]
  - id: gate.slice-ready-for-agent
    name: 垂直切片实现就绪
    stage: stage.ticket-formalization
    trigger: 垂直切片具备直接实现条件。
    evidence: [evidence.contract-approval, evidence.approval-record]
  - id: gate.frontend-implementation-verified
    name: 前端实现还原验证
    stage: stage.verification-release-retrospective
    trigger: UI 影响切片完成实现并准备合并、发布或阶段完成。
    evidence: [evidence.frontend-implementation-verification]
  - id: gate.release-ready
    name: 发布就绪
    stage: stage.verification-release-retrospective
    trigger: 合并、发布或阶段完成。
    evidence: [evidence.fresh-verification, evidence.checkpoint-and-rollback]
    requires_gates: [gate.frontend-implementation-verified]

artifacts:
  - id: artifact.impact-assessment
    name: 影响面分析
    stage: stage.entry-triage
    trigger: 每次变更。
  - id: artifact.domain-strategy
    name: DDD 战略设计
    stage: stage.discovery
    trigger: 新产品/模块、跨上下文功能、统一语言冲突、服务边界或核心规则变化。
    public_name: 业务边界与规则设计
    public_trigger: 新产品/模块、跨责任区协作、业务词汇冲突、责任边界或关键规则变化。
  - id: artifact.stage-decision-package
    name: 阶段决策包
    stage: stage.discovery
    trigger: Discovery 到 Spec 入口需要结构化上游决策。
    public_name: 方案决策包
  - id: artifact.discovery-record
    name: Discovery 记录
    stage: stage.discovery
    trigger: 新问题或边界不清。
  - id: artifact.spec
    name: Spec
    stage: stage.spec-architecture
    trigger: 新功能、行为变化或范围扩大。
  - id: artifact.product-overview
    name: 产品总体设计
    stage: stage.spec-architecture
    trigger: 进入 Spec 基线。
  - id: artifact.functional-architecture
    name: 功能架构
    stage: stage.spec-architecture
    trigger: 新模块或跨边界变化。
  - id: artifact.interaction-spec
    name: 交互说明
    stage: stage.product-design
    trigger: 命中产品设计影响。
  - id: artifact.low-fidelity-prototype
    name: 低保真原型
    stage: stage.product-design
    trigger: 命中产品设计影响。
  - id: artifact.state-matrix
    name: 状态矩阵
    stage: stage.product-design
    trigger: 存在状态流转、异常或恢复。
  - id: artifact.prototype-deliverable
    name: 原型交付物
    stage: stage.product-design
    trigger: 低保真评审后需要 H1 视觉或 H2 流程校准。
  - id: artifact.prototype-review
    name: 原型评审记录
    stage: stage.product-design
    trigger: 命中 gate.prototype-reviewed。
  - id: artifact.prototype-confirmation
    name: 原型确认记录
    stage: stage.product-design
    trigger: 命中 gate.user-confirmation。
  - id: artifact.openapi-draft
    name: OpenAPI Draft
    stage: stage.system-data-engineering
    trigger: 有 API 影响。
  - id: artifact.openapi-freeze-record
    name: OpenAPI Freeze 记录
    stage: stage.system-data-engineering
    trigger: API 进入实现。
  - id: artifact.data-architecture
    name: 数据架构
    stage: stage.system-data-engineering
    trigger: 数据模型、存储或一致性变化。
  - id: artifact.engineering-baseline
    name: 工程基线记录
    stage: stage.system-data-engineering
    trigger: 后端、前端或高风险工程变化。
  - id: artifact.architecture-review
    name: 架构审查记录
    stage: stage.system-data-engineering
    trigger: 高风险或跨边界变化。
  - id: artifact.tactical-design
    name: DDD 战术设计
    stage: stage.system-data-engineering
    trigger: 聚合边界、状态机、一致性或持久化映射复杂到无法在系统概要设计的 Tactical DDD Check 中清楚表达。
  - id: artifact.spec-delta
    name: Spec Delta
    stage: stage.spec-architecture
    trigger: 已有冻结 Spec 的高风险行为变化。
  - id: artifact.parent-ticket
    name: 功能父 Ticket
    stage: stage.ticket-formalization
    trigger: 每个进入追踪的功能。
  - id: artifact.vertical-slice-ticket
    name: 垂直切片 Ticket
    stage: stage.ticket-formalization
    trigger: 进入实现前。
  - id: artifact.slice-implementation-contract
    name: Slice Implementation Contract
    stage: stage.ticket-formalization
    trigger: Agent 进入实现。
  - id: artifact.frontend-implementation-plan
    name: 前端实现还原计划
    stage: stage.ticket-formalization
    trigger: UI 影响切片提升 ready-for-agent 前。
  - id: artifact.frontend-implementation-verification
    name: 前端实现还原验证记录
    stage: stage.verification-release-retrospective
    trigger: UI 影响切片完成实现并准备合并、发布或阶段完成。
  - id: artifact.retrospective
    name: 复盘记录
    stage: stage.verification-release-retrospective
    trigger: 发布后或阶段性完成后满足复盘触发条件。

work_units:
  - id: work-unit.entry-triage
    name: 入口分诊
    scope: template-source
    input: 用户请求、仓库身份。
    output: 影响面与最近可信阶段。
    completion: 身份和影响面可解释。
  - id: work-unit.ssot-update
    name: 单一事实源更新
    scope: template-source
    input: 变更合同。
    output: 权威文档或脚本。
    completion: 其他投影可由脚本生成。
  - id: work-unit.skill-projection-sync
    name: 技能投影同步
    scope: template-source
    input: .agents/skills。
    output: Agent root 投影、skills lock。
    completion: --check 通过。
  - id: work-unit.template-snapshot-build
    name: 模板快照构建
    scope: template-source
    input: 固定模板 commit。
    output: CLI bundled snapshot。
    completion: commit 与 tree hash 可追踪。
  - id: work-unit.attach-sync-integration
    name: attach / sync 集成
    scope: template-source
    input: 目标仓库、dry-run 计划。
    output: 受管资产和 metadata。
    completion: 验证通过或完整回滚。
  - id: work-unit.intensity-aware-verification
    name: 分级 Fresh verification
    scope: template-source
    input: 变更仓库、强度分级与对应最低证据。
    output: 命令输出与证据。
    completion: L1 相关检查、L2 最小反例与 fresh verification、L3 完整 RED / GREEN / REFACTOR 与 fresh verification 按命中等级通过。
  - id: work-unit.intensity-aware-review
    name: 分级审查
    scope: template-source
    input: 变更 diff、强度分级与验证证据。
    output: L1 self-check / 人工 checkpoint、L2 聚焦独立审查或 L3 正式独立审查结论。
    completion: 已按命中等级完成审查且无未处理阻断项；L1 不强制独立 reviewer。
  - id: work-unit.release-and-rollback
    name: 发布与回滚
    scope: template-source
    input: 已审查 commit。
    output: release note、观察信号、回滚点。
    completion: 两仓库顺序和恢复动作明确。
  - id: work-unit.discovery-opportunity
    name: 机会调研
    scope: project-instance
    input: 用户问题、市场/竞品事实需求和现有上下文。
    output: Discovery 机会结论、证据、替代方案和关键假设。
    completion: 机会继续/停止建议可审查；事实已 research 或记录为假设。
  - id: work-unit.discovery-requirements
    name: 需求分析
    scope: project-instance
    input: 机会结论、用户反馈和领域词汇。
    output: 用户、MVP、非目标、成功标准、测试 seam 和未决项。
    completion: frontier 清空；用户确认；无 runnable blocker。
  - id: work-unit.domain-strategy-design
    name: DDD 战略设计
    scope: project-instance
    input: 已澄清的业务场景、领域词汇、约束和现有上下文。
    output: 子域、限界上下文、Context Map、统一语言、事件、核心领域概念候选和不变量。
    completion: 边界、语义方向、规则所有权和关键场景可审查；无未解释冲突。
    public_name: 业务边界与协作梳理
    public_input: 已澄清的业务故事、业务词汇、约束和现有协作关系。
    public_output: 业务板块、业务责任区、协作与交接关系、统一业务词汇、已发生的业务事实、待确认的关键业务对象和不可违反的业务规则。
  - id: work-unit.stage-decision
    name: 阶段决策包综合
    scope: project-instance
    input: Discovery、DDD 战略设计以及产品经理负责的商业约束输入。
    output: 带版本、digest、证据和下游映射的阶段决策包。
    completion: 必填字段、引用、影响面和下游消费验证通过；批准门禁完成。
    public_name: 方案决策包综合
    public_input: Discovery、业务边界与规则设计以及产品经理负责的商业约束输入。
    public_output: 带版本、digest、证据和下游映射的方案决策包。
  - id: work-unit.spec-synthesis
    name: Spec 综合
    scope: project-instance
    input: 已确认的 Discovery 记录和测试 seam。
    output: Spec、产品总体设计和功能架构。
    completion: Spec 内容完整并进入 ready-for-human；下游推进仍需 gate.spec-baseline-approved。
  - id: work-unit.prototype-design
    name: 原型设计与验证
    scope: project-instance
    input: Spec、产品设计影响和状态矩阵。
    output: 交互说明、低保真、状态矩阵、H1/H2 原型交付物、统一 Design QA、档位验证证据与前端实现交接事项。
    completion: 低保真评审、schema v3 原型交付物验证和用户确认门禁均通过；生产组件待验事项已交接到前端实现计划。
  - id: work-unit.technical-analysis
    name: 技术分析与契约冻结
    scope: project-instance
    input: Spec、原型、API/数据/工程影响面。
    output: OpenAPI、数据架构、Tactical DDD Check、工程基线、架构审查和 Slice 合同草案。
    completion: 命中契约已冻结；无 API 影响有可读记录；命中领域影响时战术模型无未解释冲突；工程基线通过。
  - id: work-unit.ticket-decomposition
    name: 垂直切片 Ticket 正式化
    scope: project-instance
    input: 冻结 Spec、设计、契约和阻塞关系。
    output: 功能父 Ticket、垂直切片和批准的 Slice Implementation Contract。
    completion: 切片可独立验证；生命周期复算后才能 ready-for-agent。
  - id: work-unit.slice-implementation
    name: 垂直切片实现
    scope: project-instance
    input: 当前版本 Slice Implementation Contract 和允许写路径。
    output: 前后端实现、TDD 和 YSS Skill Execution Result。
    completion: 行为通过 `behavior-tdd`；UI 影响完成还原验证计划；无 drift/violation。
  - id: work-unit.frontend-implementation-verification
    name: 前端实现还原验证
    scope: project-instance
    input: 冻结原型、状态矩阵、实现候选和视觉验收用例。
    output: 桌面/窄屏视觉、状态、交互、console 和 pnpm 验证证据。
    completion: 关键场景无未解释差异；独立 Reviewer 通过 UI fidelity 轴。
  - id: work-unit.code-review
    name: 独立代码审查与验证
    scope: project-instance
    input: 不可变候选快照、Spec、Ticket、合同和执行结果。
    output: Standards、Spec、UI fidelity 三轴 Review 与 fresh verification。
    completion: findings 已处理；修复后重新捕获候选并全量复审。
  - id: work-unit.release-and-retrospective
    name: 发布与复盘
    scope: project-instance
    input: 已审查候选、发布窗口和回滚点。
    output: 发布/回滚证据和复盘记录。
    completion: 人工发布裁决、fresh verification 和治理回流均完成。
