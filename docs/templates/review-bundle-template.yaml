schema_version: 1
kind: review-bundle
bundle_id: review-bundle.plan
task_id: replace-with-plan-review-task-id
work_unit_id: work-unit.plan-requirements
review_session_id: replace-with-stable-review-session-id
role_id: role.product-manager
runtime_id: runtime.generic
principal_ref: replace-with-reviewer-instance
reviews:
- schema_version: 1
  gate_id: check.domain-strategy-approved
  decision: approved
  actor_kind: digital-human
  role_id: role.product-manager
  runtime_id: runtime.generic
  principal_ref: replace-with-reviewer-instance
  drafter_role_id: role.requirements-manager
  drafter_principal_ref: replace-with-drafter-instance
  subject_ref: docs/.scratch/<feature>/domain/domain-strategy-v1.yaml
  subject_digest: replace-with-64-char-sha256
  approval_scope:
  - replace-with-feature-id
  evidence_refs:
  - replace-with-current-review-evidence
notes: 本模板只用于起草。只保留实际命中的 check；同一 bundle 的所有结论必须来自同一复核任务、会话和实例。
