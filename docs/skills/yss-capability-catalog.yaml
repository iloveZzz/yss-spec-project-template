schema_version: 1
catalog_version: "1.0.0"
catalog_id: yss-capability-catalog

# 本目录只负责能力发现、路由和 source-index；来源、哈希与投影完整性仍由
# skills-lock.json 负责。
categories:
  component-adapter:
    label: Component Adapter
    purpose: YSS runtime component、starter、配置、API 与故障排查
    default_owner: yss-backend-platform
  application-architecture:
    label: Application Architecture
    purpose: DDD 应用分层、脚手架、领域建模、持久化生成和 Web 适配
    default_owner: yss-application-architecture
  process-contract:
    label: Process & Contract
    purpose: 生命周期、垂直切片路由、OpenAPI 与前后端契约
    default_owner: yss-engineering-governance
  platform-frontend:
    label: Platform / Frontend
    purpose: 前端页面、设计系统、平台维护和 Codex-only 执行器
    default_owner: yss-frontend-platform

owners:
  yss-backend-platform:
    label: YSS Backend Platform
    responsibility: 负责 YSS backend component adapter、源码索引和组件验证
  yss-application-architecture:
    label: YSS Application Architecture
    responsibility: 负责 DDD 应用工程形状、脚手架和跨层代码规范
  yss-engineering-governance:
    label: YSS Engineering Governance
    responsibility: 负责生命周期、契约、路由、重路由和模板门禁
  yss-frontend-platform:
    label: YSS Frontend Platform
    responsibility: 负责 YSS UI、前端生成器、平台执行器和前端文档入口

retired_skills:
  - yss-dir
  - yss-domain-modeling
  - yss-file
  - yss-filerunner
  - yss-mail
  - yss-mapper-dynamic
  - yss-quality
  - yss-variable
retirement_policy:
  reintroduction: requires-owner-review-and-new-red-baseline
  domain_modeling_replacement: domain-modeling
  component_fallback: lifecycle-approved-project-implementation-contract

unavailable_skill_policy:
  default_action: blocked
  approval_owner: yss-product-lifecycle
  fallback: only-approved-equivalent-specification
  required_evidence: [provider, fallback, approval_ref, resolution]

reroute_policy:
  stale_status: stale
  new_impacts: [api-schema-impact, database-schema-impact, permission-impact, state-machine-impact, data-model-impact, new-write-path, new-repository, new-required-skill, architecture-drift, contract-violation, test-seam-changed, verification-command-changed]
  paused_work_units: true
  destinations:
    api-schema-impact: system-data-architecture-and-contract-review
    database-schema-impact: data-architecture-and-migration-review
    permission-impact: spec-product-design-and-contract-review
    state-machine-impact: spec-system-data-and-contract-review
    data-model-impact: data-architecture-and-contract-review
    new-write-path: stage7-contract-recompile
    new-repository: stage7-contract-recompile
    new-required-skill: stage7-contract-recompile
    architecture-drift: architecture-recheck
    contract-violation: stage7-contract-recompile
    test-seam-changed: spec-ticket-test-seam-review
    verification-command-changed: stage7-contract-recompile

profiles:
  backend-vertical-slice:
    entrypoint: yss-router
    required:
      - yss-product-lifecycle
      - yss-router
      - yss-backend-scaffold-parent
      - domain-modeling
      - yss-domain
      - yss-backend-scaffold-domain
      - yss-backend-scaffold-application
      - yss-backend-scaffold-infrastructure
      - yss-repository
      - yss-backend-scaffold-web
      - yss-web-controller
      - yss-dto
      - alibaba-java-code-style
      - mapstruct
      - lombok
    excluded_categories: [platform-frontend]
    policy: yss-router-compiles-minimal-closure-and-lifecycle-approves

condition_vocabulary:
  components: 页面使用 YSS UI 组件或组件文档入口，例如 YTable、YTree、YssFormily
  hooks: 页面使用 YSS UI hooks 或共享页面数据逻辑，例如 useRequest、useTableHeight、useTreeHeight
  form: 页面使用 YssFormily / YFormily schema、effects 或 detail mode
  api: 页面需要生成、刷新或接入 Orval API client

