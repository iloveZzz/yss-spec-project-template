    owner: yss-engineering-governance
    role: supporting
    status: active
    backend_default: false
    trigger_conditions: [frontend.api-client, frontend.orval, frontend.use-request, api-regeneration]
    non_triggers: [backend-controller-implementation, openapi-style-governance, generic-http-client]
    dependencies:
      always: []
      when:
        regeneration: [yss-openapi]
    dependency_closure:
      always: []
      when:
        regeneration: [yss-openapi]
    source_index:
      kind: project-reference
      index_paths: [.agents/skills/yss-api-integration/SKILL.md]
      source_repository: project
      source_paths: []
      freshness_command: scripts/verify-yss-capability-catalog
    verification_commands: [scripts/verify-yss-capability-catalog]
