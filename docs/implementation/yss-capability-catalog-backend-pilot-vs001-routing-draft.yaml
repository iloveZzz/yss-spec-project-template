backend:
  status: blocked
  affected_layers: [domain, application, infrastructure, web]
  required_skills:
    - domain-modeling
    - yss-domain
    - yss-backend-scaffold-domain
    - yss-backend-scaffold-application
    - yss-repository
    - yss-backend-scaffold-infrastructure
    - yss-web-controller
    - yss-dto
    - yss-backend-scaffold-web
    - mapstruct
    - lombok
    - alibaba-java-code-style
  application_boundary: Product model query and draft creation use cases; Adapter DTOs must not cross into Application.
  transaction_boundary: Application service owns the draft creation transaction; query path remains read-only.
  persistence_strategy: Existing Gateway / Repository seam with PostgreSQL-oriented test evidence; no production migration execution in Pilot.
  allowed_write_paths:
    - /Users/zhudaoming/Projects/modeling-yss-pilot/apps/backend/asset-product-modeling-service/asset-product-modeling-service-domain/src/**
    - /Users/zhudaoming/Projects/modeling-yss-pilot/apps/backend/asset-product-modeling-service/asset-product-modeling-service-application/src/**
    - /Users/zhudaoming/Projects/modeling-yss-pilot/apps/backend/asset-product-modeling-service/asset-product-modeling-service-infrastructure/src/**
    - /Users/zhudaoming/Projects/modeling-yss-pilot/apps/backend/asset-product-modeling-service/asset-product-modeling-service-adapter/asset-product-modeling-service-web/src/**
  forbidden_patterns:
    - direct Adapter-to-Infrastructure dependency
    - in-memory runtime Gateway replacement for the persisted behavior
    - default collection initialization that changes YSS response semantics
    - direct SQL or migration execution outside the approved seam
    - real IAM / audit adapter integration during this Pilot
  expected_evidence_files:
    - external-vs001-domain-tests
    - external-vs001-application-tests
    - external-vs001-repository-tests
    - external-vs001-web-contract-tests
    - external-vs001-yss-compliance-tests
    - external-vs001-fresh-verification
  seam_deferred:
    - risk: production database migration and rollback execution
      owner: architecture-and-release-owner
      follow_up_ticket: modeling-yss migration review / future release ticket
      verification_plan: isolated target database execution after explicit release approval
    - risk: real IAM / SSO role and action capability source
      owner: security-owner
      follow_up_ticket: modeling-yss security follow-up
      verification_plan: fail-closed permission matrix and isolated integration verification
    - risk: production audit adapter, retention and masking
      owner: security-and-platform-owner
      follow_up_ticket: modeling-yss audit integration ticket
      verification_plan: approved system audit contract and redacted event verification
  verification_commands:
    - cd /Users/zhudaoming/Projects/modeling-yss-pilot/apps/backend/asset-product-modeling-service && ./mvnw test -DfailIfNoTests=false
    - cd /Users/zhudaoming/Projects/modeling-yss-pilot/apps/backend/asset-product-modeling-service && ./mvnw -q -DskipTests validate

