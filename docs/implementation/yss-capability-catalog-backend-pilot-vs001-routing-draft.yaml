    - id: lifecycle-approval-missing
      reason: parent Spec is ready-for-human and no approved vertical-slice Ticket exists.
      destination: yss-product-lifecycle
    - id: current-slice-ticket-missing
      reason: Historical modeling-yss Issue #2 is closed and belongs to the old lifecycle; Issue #41 is the current functional parent, but no current Pilot slice Ticket has been approved.
      destination: to-tickets-after-requirement-freeze
    - id: historical-contract-stale
      reason: historical VS-001 contract references retired yss-domain-modeling and must not be consumed.
      destination: stage7-contract-recompile
    - id: current-catalog-contract-not-approved
      reason: the clean Pilot branch and project-instance identity are ready, but no current-catalog contract has lifecycle approval.
      destination: yss-product-lifecycle
    - id: current-requirement-freeze-not-approved
      reason: The current Pilot requirement freeze and no-API-impact record are prepared but remain ready-for-human.
      destination: yss-product-lifecycle
