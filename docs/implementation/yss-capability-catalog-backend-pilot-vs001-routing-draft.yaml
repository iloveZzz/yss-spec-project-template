    - external-historical-vs001-backend-slice-contract
    - external-historical-vs001-build-architecture-checklist
  not_applicable:
    - item: frontend-implementation
      reason: current Pilot scope is backend-only and has no UI impact.
    - item: production-api-change
      reason: Pilot validates existing behavior and does not change the production API contract.
    - item: high-fidelity-ui-prototype
      reason: no UI impact.
    - item: original-dirty-worktree
      reason: the original dev worktree is explicitly excluded; the Pilot uses an isolated clean worktree.

