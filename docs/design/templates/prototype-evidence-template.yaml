# 复制到 docs/.scratch/<feature>/verification/prototype-evidence.yaml。
# 只保留所选档位的 profile_evidence 子块；schema v1/v2 仅允许只读迁移。
schema_version: 3
feature: <feature>
prototype_ref: docs/.scratch/<feature>/design/prototypes/index.html
prototype_profile: H2
profile_kind: flow-review
profile_decision:
  decision_to_inform: <本轮原型需要支持的决定>
  risk_assumptions:
    - <需要验证或接受的风险假设>
  trigger_results:
    - trigger: <multi-page-navigation-or-other-trigger>
      matched: true
      evidence_ref: <spec-state-matrix-or-review-ref>
  calculated_profile: H2
  override:
    applied: false
    direction: none
    reason: not-applicable
    evidence_ref: not-applicable
upstream_refs:
  spec_ref: docs/.scratch/<feature>/spec/<feature>-spec.md
  interaction_spec_ref: docs/.scratch/<feature>/design/<feature>-interaction-spec.md
  low_fidelity_ref: docs/.scratch/<feature>/design/<feature>-low-fidelity.md
  state_matrix_ref: docs/.scratch/<feature>/design/<feature>-state-matrix.md
  prototype_review_ref: docs/.scratch/<feature>/design/<feature>-prototype-review.md
source_visual:
  ideation_status: required
  selected_ref: <selected-source-visual-ref>
  reuse_reason: not-applicable
design_baseline:
  canonical_design_ref: DESIGN.md
  canonical_design_digest: <sha256>
  project_design_ref: docs/design/design.md
  project_token_refs:
    - docs/design/tokens/theme.json
    - docs/design/tokens/tokens.compact.json
  project_token_baseline_digest: <sha256>
  project_override_reviewed: false
browser_delivery:
  delivery_kind: static-directory
  entry_ref: docs/.scratch/<feature>/design/prototypes/index.html
  rendered_nonblank: false
  prototype_digest: <sha256>
  viewports:
    - name: desktop
      size: 1440x900
      result: pending
      screenshot_ref: <path>
    - name: narrow
      size: 390x844
      result: pending
      screenshot_ref: <path>
  console_result: pending
  console_ref: <path-to-console-output-or-none>
design_qa:
  report_ref: docs/.scratch/<feature>/verification/design-qa.md
  result: pending
  axes:
    visual: pending
    layout: pending
    interaction: pending
    content: pending
    accessibility: pending
    cross_platform: pending
profile_evidence:
  # H1 只保留 visual_review；不得包含 package/lockfile/AntD 字段。
  # visual_review:
  #   runtime_build_required: false
  #   key_interactions_result: pending
  #   keyboard_result: pending
  #   focus_result: pending
  #   contrast_result: pending
  #   zoom_200: {applicable: false, result: not-applicable, evidence_ref: not-applicable}
  #   reduced_motion: {applicable: false, result: not-applicable, evidence_ref: not-applicable}
  flow_review:
    implementation:
      framework: vue
      runtime_build_required: true
      package_manager: pnpm
      package_manifest_ref: docs/.scratch/<feature>/design/prototypes/package.json
      lockfile_ref: docs/.scratch/<feature>/design/prototypes/pnpm-lock.yaml
      build_command: pnpm build
      build_result: pending
    main_flow_result: pending
    exceptional_state_result: pending
    exceptional_state_ref: <failure-permission-or-conflict-ref>
    keyboard_result: pending
    focus_result: pending
    contrast_result: pending
    zoom_200_result: pending
    reduced_motion_result: pending
    visual_regression:
      applicable: true
      result: pending
      evidence_ref: <snapshot-result-ref>
    prototype_library_facts:
      applicable: true
      component_basis: vue-antdv-next
      source: fact-pack
      library_package: antdv-next
      library_version: 1.5.2
      manifest_ref: docs/design/facts/antdv-next/1.5.2/manifest.json
      manifest_digest: <sha256>
      components_covered: [<Component>]
      canonical_design_digest: <same-as-design-baseline>
      project_token_baseline_digest: <same-as-design-baseline>
      new_api_uncertainty: false
implementation_handoff:
  prototype_code_reusable: false
  production_component_assumptions:
    - <原型采用的语义预计可由目标 YSS/AntDV 组件表达>
  verification_targets:
    - behavior: <进入实现后需要基于真实组件验证的行为>
      target_stage: frontend-implementation-plan
review:
  result: pending
  review_ref: docs/.scratch/<feature>/design/<feature>-prototype-review.md
user_confirmation:
  result: pending
  confirmation_ref: docs/.scratch/<feature>/design/<feature>-prototype-confirmation.md
  confirmed_decision: <用户确认的设计决定>
  operable_scope: [<可操作范围>]
  simulations_or_gaps: [<模拟或缺口>]
gaps: []
blockers: []
