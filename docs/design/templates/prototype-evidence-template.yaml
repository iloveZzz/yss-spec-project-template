# 复制到 docs/.scratch/<feature>/verification/prototype-evidence.yaml。
# schema v1 只读兼容；关闭 gate.prototype-verified 前必须迁移到本 schema v2。
schema_version: 2
feature: <feature>
prototype_ref: docs/.scratch/<feature>/design/prototypes/index.html
prototype_stack:
  framework: react
  package_manager: pnpm
  package_manifest_ref: docs/.scratch/<feature>/design/prototypes/package.json
  lockfile_ref: docs/.scratch/<feature>/design/prototypes/pnpm-lock.yaml
  source_entry_ref: docs/.scratch/<feature>/design/prototypes/src/App.jsx
  build_entry_ref: docs/.scratch/<feature>/design/prototypes/dist/index.html
  build_command: pnpm build
  build_result: pending
  actual_antd_version: <exact-6.x-version-from-lockfile>
design_baseline:
  design_standard: ant-design-v6
  project_design_ref: docs/design/design.md
  project_token_refs:
    - docs/design/tokens/theme.json
    - docs/design/tokens/tokens.compact.json
  upstream_design_md_source: https://ant.design/design.md
  upstream_design_md_record_ref: <path-to-json-output-or-summary>
  theme_adapter_ref: docs/.scratch/<feature>/design/prototypes/src/yss-theme.js
  project_override_reviewed: false
  theme_override:
    color_primary: "#3371ff"
    color_error: "#f5222d"
    color_bg_layout: "#f0f2f5"
    compact_control_height: 28
    border_radius: 6
    font_family: system-stack
    recorded: false
    note: 官方当前同样使用系统字体和 6px 默认控件圆角；真实项目差异主要是品牌/状态色、页面背景和默认紧凑密度，不得误写为 Inter/8px 差异。
visual_semantic_mapping:
  runtime_component_library: ant-design-vue-4.x
  runtime_version_source: implementation-lockfile
  components:
    - semantic_role: <primary-action-or-other-role>
      antd_v6_component: <React-AntD-component-used-by-prototype>
      project_token_refs: [<token-name>]
      yss_or_antdv_target: <YSS-or-AntDV-production-component>
      state_mapping: [default, hover, active, disabled, loading]
      react_only_api_not_copied: false
      verification_ref: <same-state-screenshot-or-test-ref>
antd:
  fact_skill: yss-antd-design
  cli_command: antd
  cli_version: <actual-cli-version>
  target_antd_version: <same-exact-6.x-version>
  queries:
    design_md: <path-to-json-output>
    components:
      - component: <Component>
        info_ref: <path-to-json-output>
        demo_ref: <path-to-json-output>
        token_ref: <path-to-json-output>
        semantic_ref: <path-to-json-output>
  lint_applicable: true
  lint_reason: react-source
  lint_ref: <path-to-json-output>
  lint_passed: false
browser_verification:
  executor: <browser-or-automation-name>
  rendered_nonblank: false
  prototype_digest: <sha256-or-version-ref>
  viewports:
    - name: desktop
      size: 1440x900
      result: pending
    - name: narrow-mobile
      size: 390x844
      result: pending
  main_flow_result: pending
  failure_permission_or_conflict_result: pending
  console_error_ref: <path-to-console-output-or-none>
design_qa:
  report_ref: docs/.scratch/<feature>/verification/design-qa.md
  result: pending
accessibility_verification:
  contrast_results_ref: <path-to-default-hover-active-disabled-focus-results>
  keyboard_navigation_result: pending
  focus_visible_and_order_result: pending
  semantic_label_dialog_result: pending
  zoom_200_result: pending
  reduced_motion_result: pending
  target_size_result: pending
  automated_scan:
    tool: <tool-or-manual>
    version: <actual-version-or-not-applicable>
    result: pending
    ref: <path-to-result-or-manual-check>
review:
  prototype_review_ref: docs/.scratch/<feature>/design/<feature>-prototype-review.md
  result: pending
user_confirmation:
  confirmation_ref: docs/.scratch/<feature>/design/<feature>-prototype-confirmation.md
  result: pending
blockers: []
