      verification_commands: [scripts/bootstrap-rust-toolchain.sh, scripts/cargo fmt --check, scripts/cargo test --locked, scripts/cargo clippy --locked -- -D warnings, scripts/cargo build --release --locked]
      controlled_generation:
        exception_reason: 新外部 Rust 仓的机械 Cargo workspace 与本地隔离 toolchain bootstrap；不含 CLI 行为实现
        generator: version-pinned rustup-init bootstrap 与最小 Cargo 文件生成
        generator_inputs: [package=create-yss-spec, edition=current-stable]
        expected_files: [Cargo.toml, Cargo.lock, rust-toolchain.toml, scripts/bootstrap-rust-toolchain.sh, scripts/cargo, src/main.rs]
        verification_commands: [scripts/bootstrap-rust-toolchain.sh, scripts/cargo fmt --check, scripts/cargo test --locked, scripts/cargo clippy --locked -- -D warnings, scripts/cargo build --release --locked]
        behavior_tests_after_generation: [tests/help_cli.rs]
    - id: TEMPLATE-RUNTIME-01-HELP-ORACLE
      behavior: `create-yss-spec --help` 以 Node 2.x 固定输出作为公开黑盒 oracle
      primary_skill: tdd
      supporting_skills: []
      tdd_mode: behavior-tdd
      allowed_write_paths: [src/main.rs, tests/help_cli.rs, fixtures/node-oracle/help.txt, docs/evidence/01-help-oracle-red-green.md]
      expected_evidence: [fixtures/node-oracle/help.txt, docs/evidence/01-help-oracle-red-green.md]
      verification_commands: [cargo test --locked, node /Users/zhudaoming/Projects/create-yss-spec/bin/create-yss-spec.js --help]
      controlled_generation: not-applicable
