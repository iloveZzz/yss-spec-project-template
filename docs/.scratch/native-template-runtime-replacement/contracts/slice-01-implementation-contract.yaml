      primary_skill: tdd
      supporting_skills: [research]
      tdd_mode: controlled-generation
      allowed_write_paths: [Cargo.toml, Cargo.lock, rust-toolchain.toml, scripts/bootstrap-rust-toolchain.sh, scripts/cargo, src/main.rs, tests/help_cli.rs, README.md, LICENSE, .gitignore, docs/evidence/01-workspace-baseline.md, docs/evidence/01-toolchain-bootstrap.md]
