slice_contract:
  schema_version: 1
  contract_id: TEMPLATE-RUNTIME-02-CONTRACT
  contract_version: 1
  slice_id: TEMPLATE-RUNTIME-02
  status: approved
  lifecycle_approval:
    approval_ref: docs/.scratch/native-template-runtime-replacement/gates/contract-approval-02.md#approved
    approved_by: 用户 / yss-product-lifecycle
    persisted_ref: docs/.scratch/native-template-runtime-replacement/contracts/slice-02-implementation-contract.yaml
    current_version: 1
  lifecycle_refs:
    spec: docs/.scratch/native-template-runtime-replacement/spec.md
    ticket: docs/.scratch/native-template-runtime-replacement/issues/02-native-cli-and-snapshot.md
    architecture_review: docs/.scratch/native-template-runtime-replacement/architecture/architecture-review.md
    build_architecture_checklist: docs/.scratch/native-template-runtime-replacement/architecture/build-architecture-checklist.md
    implementation_repository: docs/.scratch/native-template-runtime-replacement/implementation-repositories.md
    openapi_freeze_or_no_impact: docs/.scratch/native-template-runtime-replacement/api/no-api-impact.md
  readiness:
    blockers: []
    stale_inputs: []
    not_applicable:
      - item: ui_impact
        reason: 无 UI 变化
      - item: api_impact
        reason: 无 HTTP/OpenAPI API
      - item: backend_impact
        reason: 外部 Rust CLI，不是 YSS 后端
  common:
    impacted_areas: [external-rust-runtime, template-snapshot, cli-behavior, transactional-filesystem]
    implementation_path_policy: external-repository-native
    project_roots: [/Users/zhudaoming/Projects/yss-template-runtime]
    required_skills: [tdd, code-review, research]
    optional_skills: []
    unavailable_skills: []
    allowed_write_paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - fixtures/**
      - assets/template.snapshot.tar
      - docs/evidence/02-*.md
      - README.md
    forbidden_patterns:
      - write outside /Users/zhudaoming/Projects/yss-template-runtime
      - invoke Node or npm from Rust runtime
      - dynamic template download or floating template ref
      - overwrite a target .git directory
      - mutate target files before dry-run or before transaction validation
      - claim full CLI replacement, RC, stable, signing or release readiness
  expected_evidence_files:
    - docs/evidence/02-snapshot-binding.md
    - docs/evidence/02-init-red-green.md
    - docs/evidence/02-attach-sync-red-green.md
    - docs/evidence/02-independent-review.md
  verification_commands:
    - scripts/cargo fmt --check
    - scripts/cargo test --locked
    - scripts/cargo clippy --locked -- -D warnings
    - scripts/cargo build --release --locked
  human_review_points:
    - 固定模板 commit、snapshotHash 与嵌入 artifact 的逐字节映射
    - Node 2.x 与 Rust 对 init/attach/sync 的 stdout、stderr、exit code、文件树、mode、symlink、Git 状态和回滚一致性
    - metadata v1 到 v2 的事务升级及 Node 2.x fail-closed
  full_reroute_triggers:
    - public-command-shape-changed
    - snapshot-source-changed
    - metadata-schema-changed
    - new-write-path
    - verification-command-changed
  contract:
    api_impact: false
    no_api_impact_ref: docs/.scratch/native-template-runtime-replacement/api/no-api-impact.md
    contract_tests:
      - tests/cli_init.rs
      - tests/cli_attach_sync.rs
      - tests/snapshot_binding.rs
    regeneration_commands: []
  cross_repo:
    repositories:
      - yss-template-runtime
      - create-yss-spec (Node 2.x oracle)
      - yss-spec-project-template (snapshot source and contract owner)
    delivery_order:
      - freeze template snapshot and manifest
      - write RED tests against public Rust binary
      - implement init dry-run/apply
      - implement attach dry-run/apply and metadata migration
      - implement sync dry-run/apply with transactional rollback
      - independently review before any checkpoint
    integration_verification:
      - compare Node and Rust on the same temp fixtures and frozen snapshot
      - assert no Node process or network dependency in Rust execution
    rollback_order:
      - discard uncommitted Slice 02 changes
      - retain production main at 1de00ea
  work_units:
    - id: TEMPLATE-RUNTIME-02-SNAPSHOT
      behavior: 将固定 template.manifest.json 与 template.snapshot.json 对应内容嵌入 binary，并在运行时校验 commit/hash
      primary_skill: tdd
      tdd_mode: behavior-tdd
      allowed_write_paths: [assets/template.snapshot.tar, src/**, tests/snapshot_binding.rs, docs/evidence/02-snapshot-binding.md]
      expected_evidence: [docs/evidence/02-snapshot-binding.md]
      verification_commands: [scripts/cargo test --locked]
    - id: TEMPLATE-RUNTIME-02-INIT
      behavior: `create-yss-spec --project-name ... --business-domain ... --target-dir ...` dry-run/apply 在空目录生成固定 snapshot、渲染三文件并写 metadata v2；3.0 的 force 替换必须事务性、可回滚
      primary_skill: tdd
      tdd_mode: behavior-tdd
      allowed_write_paths: [src/**, tests/cli_init.rs, docs/evidence/02-init-red-green.md]
      expected_evidence: [docs/evidence/02-init-red-green.md]
      verification_commands: [scripts/cargo test --locked]
    - id: TEMPLATE-RUNTIME-02-ATTACH-SYNC
      behavior: attach/sync 的 dry-run、冲突、force、metadata migration、native instance verify 与事务回滚通过同一公开 binary seam 可验证；不得启动 Node/PNPM
      primary_skill: tdd
      tdd_mode: behavior-tdd
      allowed_write_paths: [src/**, tests/cli_attach_sync.rs, docs/evidence/02-attach-sync-red-green.md]
      expected_evidence: [docs/evidence/02-attach-sync-red-green.md]
      verification_commands: [scripts/cargo test --locked]
    - id: TEMPLATE-RUNTIME-02-NATIVE-VERIFY
      behavior: 实例侧校验由 Rust runtime 提供；模板维护侧 `scripts/verify-template`、pnpm vendor gate 与技能锁校验仍可保留 Node/PNPM，不随实例 snapshot 作为运行时依赖
      primary_skill: tdd
      tdd_mode: behavior-tdd
      allowed_write_paths: [src/**, tests/**, docs/evidence/02-*.md]
      expected_evidence: [docs/evidence/02-attach-sync-red-green.md]
      verification_commands: [scripts/cargo test --locked]
