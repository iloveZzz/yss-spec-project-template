schema_version: 3
registry_id: yss.skill-routing
status: active
description: >-
  技能身份、capability、任务模式、类型化依赖、分层、别名和默认可发现性的
  单一可执行注册表。实现合同编译器与生命周期编排器只消费通过本表校验的
  canonical 技能；skills-lock.json 继续独立持有来源、hash 与投影完整性。
canonical_content_root: .agents/skills
instance_distribution:
  schema_version: 1
  initial_skills: [yss-product-lifecycle, yss-research, i-have-adhd]
  runtimes: [codex, cursor, pi]
  projection_roots: { codex: .codex/skills, cursor: .cursor/skills, pi: .pi/skills }
  dependency_types_for_ensure: [context-required, context-conditional]
  initial_example_docs: false
backend_skill_domains:
  schema_version: 1
  scope: active-yss-backend-capability-owners
  domain_ids: [technical-design, layered-implementation, wire-framework-contract, component-capability, engineering-initialization, platform-governance-migration]
  assignments:
    yss-technical-design: technical-design
    yss-tactical-design: technical-design
    yss-domain: layered-implementation
    yss-application: layered-implementation
    yss-repository: layered-implementation
    yss-web-controller: layered-implementation
    yss-mybatis: wire-framework-contract
    yss-dto: wire-framework-contract
    yss-validation: wire-framework-contract
    yss-exception: wire-framework-contract
    yss-cache: component-capability
