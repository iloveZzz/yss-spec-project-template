    yss-excel-mvc: component-capability
    yss-distributed-id: component-capability
    yss-resilience4j: component-capability
    yss-security-algorithm: component-capability
    yss-ddd-scaffold-generator: engineering-initialization
    yss-layered-mvc-scaffold-generator: engineering-initialization
    yss-implementation-contract-compiler: platform-governance-migration
    yss-skill-source-index-refresh: platform-governance-migration
    yss-up-springboot3: platform-governance-migration
    yss-backend-spec-review: platform-governance-migration
  deprecated_skills: []
backend_source_index_contract:
  schema_version: 1
  owner_skill: yss-skill-source-index-refresh
  scope: yss-component-capability-skills
  component_skills: [yss-audit-log, yss-cache, yss-distributed-id, yss-dto, yss-excel-mvc, yss-exception, yss-mybatis, yss-resilience4j, yss-security-algorithm, yss-userinfo, yss-validation]
  selector_path: references/source-index.md
  generated_path_pattern: references/source-index.<platform-line>.md
  platform_lines:
    - { id: boot2-java8, source_env: YSS_SOURCE_ROOT_BOOT2_JAVA8, generated_suffix: source-index.boot2-java8.md }
    - { id: boot3-java17, source_env: YSS_SOURCE_ROOT_BOOT3_JAVA17, generated_suffix: source-index.boot3-java17.md }
  platform_line_source: approved-platform-configuration
  freshness_checker: yss-skill-source-index-refresh/scripts/check-backend-skill-source-index.mjs
  cross_line_fallback: forbidden
existing_project_profiles:
  existing-domain-driven-maven:
    source_kind: existing-registration
    architecture_family: domain-driven
    build_system: maven
    maturity: supported
    required_roles: [domain, application, infrastructure, web]
  existing-layered-mvc-maven:
    source_kind: existing-registration
    architecture_family: layered-mvc
    build_system: maven
    maturity: supported
    required_roles: [application, persistence, web]
architecture_profiles:
  target-domain-model:
    architecture_family: domain-driven
    generator_skill: yss-ddd-scaffold-generator
    maturity: draft
    core_modules: [domain, application, infrastructure, adapter, bootstrap]
    capability_modules: {}
    application_module: application
    persistence_module: infrastructure
    web_module: adapter/web
    dto_modules: [web]
  layered-mvc-service:
    architecture_family: layered-mvc
    generator_skill: yss-layered-mvc-scaffold-generator
    maturity: draft
    core_modules: [server, service, repository]
    capability_modules:
      external-integration: [adapter]
      published-client: [client]
      feign-client: [client, feign-client]
    application_module: service
    persistence_module: repository
    web_module: server
    dto_modules: [server, client]
  mvc-data-analysis-v1:
    architecture_family: layered-mvc
    generator_skill: yss-layered-mvc-scaffold-generator
    maturity: draft
    core_modules: [server, core, client, repository, adapter, feign-client]
    capability_modules: {}
    application_module: core
    persistence_module: repository
    web_module: server
    dto_modules: [client]
runtime_policy:
  consumed_by_compiler: true
  consumed_by_lifecycle: true
  discovery_enforced: true
capability_contract:
  schema_version: 3
  id_pattern: "^[a-z][a-z0-9-]*(?:\\.[a-z][a-z0-9-]*)+$"
  dependency_types: [context-required, context-conditional, coordination-only, review-only, component-dependency]
  task_modes: [guidance, integration, slice-implementation, troubleshooting, component-maintenance, review-input, contract-compilation, reroute, result-validation, source-index-refresh]
  closure:
    recursive_types: [context-required]
    conditional_type: context-conditional
    non_expanding_types: [coordination-only, review-only, component-dependency]
    deduplicate_skills: true
    preserve_all_reasons: true
  deterministic_order: [recipe-declaration, dependency-topology, skill-id]
  platform_component_binding:
    marker: provider
    required_kind: yss-component
    catalog_source: .template-spec/engineering/backend-platforms.json
  provider_kinds: [yss-component, platform-managed, none]
retirement_contract:
  schema_version: 1
  stages: [deprecated, retired]
  deprecated_new_use: forbidden
  cleanup_statuses: [migration-only, remove-ready]
  hard_retirement_tombstone: .template-spec/agents/skill-migrations.md
  retired_id_source: scripts/lib/skill-supply-chain.mjs#OBSOLETE
  failure_codes:
    deprecated: skill-deprecated
    retired: skill-retired
