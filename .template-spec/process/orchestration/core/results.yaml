# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
matt_skill_result:
  status: compatibility-read-only
  may_influence_routing: false
  normalize_to: workflow-execution-result-v1
  schema_version: 1
  result_values:
    - completed
    - blocked
    - needs-human
    - failed
  required:
    - result
    - skill
    - evidence_refs
    - changed_artifacts
    - new_impacts
    - stale_candidates
    - next_route
    - blocking_signals
  blocking_signals:
    - drift
    - new_impacts
    - violation
    - missing_evidence
    - stale_candidates
  completed_requires_empty:
    - new_impacts
    - stale_candidates
  completed_requires_non_empty:
    - evidence_refs
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  router_status_mapping:
    draft: completed
    blocked: blocked
    ready-for-lifecycle-review: needs-human
workflow_execution_result:
  canonical_output_schema: workflow-execution-result-v1
  accepted_input_schemas:
    - workflow-execution-result-v1
  legacy:
    matt-skill-result-v1:
      status: compatibility-read-only
      may_influence_routing: false
      normalize_to: workflow-execution-result-v1
      removal_target: schema_version_2
  result_values:
    - completed
    - blocked
    - needs-human
    - failed
  required:
    - result_schema
    - work_unit
    - workflow_reference
    - result
    - context_reconciliation
    - evidence_refs
    - changed_artifacts
    - new_impacts
    - stale_candidates
    - next_route
    - blocking_signals
  unavailable_skill:
    required:
      - skill
      - provider
      - fallback
      - resolution
    blocking_result: blocked
  blocking_signals:
    - drift
    - new_impacts
    - violation
    - missing_evidence
    - stale_candidates
  completed_requires_empty:
    - new_impacts
    - stale_candidates
  completed_requires_non_empty:
    - evidence_refs
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  context_reconciliation:
    schema_ref: .template-spec/process/schemas/context-reconciliation.schema.json
    validator: scripts/verify-context-reconciliation
    project-instance:
      required_status: reconciled
      readable_ref_required: true
      transition_without_reconciliation: blocked
    template-source:
      required_status: not-applicable
      reason_required: true
    creates_gate: false
  workflow_reference:
    required:
      - source
      - skill
      - invocation_mode
    allowed_sources:
      - yss-product-lifecycle
      - mattpocock/skills
  next_route:
    validator: scripts/lib/lifecycle-transition.mjs
    function: validateNextRoute
    implementation_predecessor: work-unit.ticket-decomposition
    null_allowed_when:
      - blocked
      - needs-human
      - failed
      - terminal_completed
  work_unit_requirements:
    work-unit.ticket-decomposition:
      completed_requires:
        - vertical_slice_ticket_ref
        - ticket_decomposition_result_ref
    work-unit.slice-implementation:
      required:
        - predecessor_work_unit
        - ticket_decomposition_result_ref
        - ticket_decomposition_result_status
        - vertical_slice_ticket_ref
        - vertical_slice_ticket_role
        - vertical_slice_ticket_kind
        - slice_contract_ticket_ref
        - slice_contract_status
      boolean_required:
        - ready_for_agent
        - slice_contract_persisted
        - slice_contract_current_version
      validator: scripts/lib/lifecycle-transition.mjs
      function: validateImplementationEntry
matt_invocation_boundary:
  user_invoked_skills:
    - handoff
    - implement
    - setup-matt-pocock-skills
    - to-spec
    - to-tickets
    - triage
    - wayfinder
  lifecycle_managed_user_entries:
    - setup-matt-pocock-skills
    - to-spec
    - to-tickets
    - implement
  model_invoked_skills:
    - code-review
    - codebase-design
    - diagnosing-bugs
    - domain-modeling
    - grilling
    - prototype
    - resolving-merge-conflicts
    - tdd
    - writing-for-agents
    - yss-research
  lifecycle_allowed_model_invoked_skills:
    - code-review
    - codebase-design
    - diagnosing-bugs
    - domain-modeling
    - grilling
    - prototype
    - tdd
    - yss-research
  lifecycle_may_invoke_user_invoked: false
  formal_artifact_owner: explicit-user-entry
  continuous_orchestration: compatibility-prepare-and-validate-only
  direct_user_entry: lifecycle-validate-and-accept
lifecycle_native_entries:
  default_entry: yss-product-lifecycle
  formal_artifact_owner: yss-product-lifecycle
  user_confirmation_policy_ref: .template-spec/process/orchestration/domain/review.yaml#user_decision_policy
  compatibility_entries:
    to-spec: lifecycle-validate-and-accept
    to-tickets: lifecycle-validate-and-accept
    implement: lifecycle-validate-and-accept
