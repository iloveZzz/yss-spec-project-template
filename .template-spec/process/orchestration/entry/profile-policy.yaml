# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
backend_architecture_identity_policy:
  source: .template-spec/agents/yss-skill-registry.yaml
  generated_profiles: architecture_profiles
  existing_profiles: existing_project_profiles
  existing_evidence:
    - repository-registration
    - engineering-baseline
    - existing-project-observation
  evidence_policy: original-ref-digest-and-current-source-verification
  delivery_preflight: scripts/preflight-delivery
  schema: .template-spec/process/schemas/backend-architecture-identity.schema.json
  required_surfaces:
    - engineering-baseline
    - repository-registration
    - scaffold-manifest
    - slice-contract
    - work-unit
    - execution-result
  agreement: exact-identity-and-digest
  missing_or_drift: blocked-and-recompile
  new_profile_readiness: supported-only
review_verification:
  default_mode: self-check
  independent_when:
    - explicit-user-requirement
    - known-external-rule
  same_account_separate_session: allowed-only-with-verifiable-distinct-context-and-execution
  names_models_roles_or_runtime_ids: not-independence-proof
  check_policy_ref: .template-spec/process/orchestration/domain/review.yaml
  repair_invalidates_affected_review: true
task_package:
  schema_version: 3
  applies_to: formal-work-units-and-explicit-cross-workspace-handoffs
  schema_ref: .template-spec/process/schemas/digital-human-task-package.schema.json
  compatibility_schema_ref: .template-spec/process/schemas/subagent-task-package.schema.json
  validator: scripts/verify-digital-human-task-package
  compatibility_validator: scripts/verify-digital-human-task-package
  persistence_layout: .work/<feature>/task-packages/<task-id>.yaml
  required:
    - schema_version
    - task_id
    - work_unit_id
    - execution_state
    - workflow_status
    - skill_source
    - contract
    - inputs
    - objective
    - allowed_write_paths
    - forbidden_actions
    - expected_outputs
    - expected_evidence_files
    - verification_commands
    - verification_results
    - downstream_consumers
    - convergence
    - profile
    - policy
    - provenance
    - acceptance
    - input_bindings
    - baseline
  execution_states:
    - Explorer
    - Drafter
    - Worker
    - Reviewer
    - Verifier
  workflow_statuses:
    - not-started
    - active
    - paused
    - resolved
    - failed
  skill_source:
    policy_ref: .template-spec/process/orchestration-contract.yaml
    selection: work-unit-and-actual-impact
    registry_ref: .template-spec/agents/yss-skill-registry.yaml
    qualification_registry: forbidden
    requires:
      - skills
      - check_ids
      - policy_digest
      - work_unit_id
      - impacts
  review_context:
    source: current-consumer-candidate-and-check-scope
    policy_ref: .template-spec/process/orchestration-contract.yaml
    required:
      - check_ids
      - candidate
      - policy
      - approval_scope
      - basis
      - review
    candidate_and_policy: current-ref-and-byte-digest
    ordinary_stable_identity: not-required
    readonly_intake_v2: historical-unchanged
  contract:
    kinds:
      - lifecycle-work-unit
      - slice-implementation
      - template-maintenance
    required:
      - kind
      - contract_id
      - contract_version
      - status
      - contract_ref
    status_at_dispatch: issued
    status_after_change:
      - stale
      - blocked
    lifecycle-work-unit:
      required:
        - lifecycle_ref
      forbidden:
        - slice_contract_ref
        - maintenance_ref
      template_source_work_unit: forbidden
    slice-implementation:
      required:
        - slice_contract_ref
      must_match_current_slice_contract: true
      version_mismatch: blocked
      stage: stage.vertical-slice-implementation
      parent_work_unit: work-unit.slice-implementation
      work_unit_must_be_declared_in_slice_contract: true
    template-maintenance:
      required:
        - maintenance_ref
      forbidden:
        - slice_contract_ref
        - lifecycle_ref
  dispatch:
    mode: single-executor-default
    multiple_executors: optional-explicit-user-or-tool-choice
    qualification_registration: forbidden
  write_isolation:
    policy: task-package-policy
    changed_files_must_be_within_allowed_paths: true
    shared_workspace_is_not_security_boundary: true
  downstream:
    formal_channel:
      - task_package_ref
      - contract_ref
      - evidence_refs
      - workflow_execution_result
    direct_chat_is_not_formal_evidence: true
  stale:
    owner: yss-product-lifecycle
    on_contract_change:
      - mark_downstream_stale
      - remove_ready-for-agent
      - reroute
  compatibility:
    legacy_schema_versions:
      - 1
      - 2
    legacy_results: read-only-original-semantics
    schema2: read-only-intake
    missing_role_file: never-a-mode-signal
compatibility_flow_preconditions:
  to-spec:
    required:
      - grill_exit
      - no_unresolved_runnable_blocker
    evidence:
      - user_problem
      - mvp_and_non_goals
      - success_criteria
      - test_seam
      - terminology_review
    output_role: ready-for-human
  to-tickets:
    required:
      - openapi_freeze_or_no_api_impact
      - required_gates_satisfied
      - implementation_repositories_ready
      - vertical_slice_scope
      - blocking_edges
    output: vertical-slice-tickets
    output_role: ready-for-human
  implement:
    required:
      - ready_for_agent
      - predecessor_work_unit
      - ticket_decomposition_result_ref
      - ticket_decomposition_result_status
      - vertical_slice_ticket_ref
      - vertical_slice_ticket_role
      - vertical_slice_ticket_kind
      - slice_contract_approved
      - slice_contract_persisted
      - slice_contract_current_version
      - build_architecture_checklist
      - implementation_repo
      - implementation_branch
      - ci
      - verification_commands
      - rollback_point
      - backend_slice_contract_if_applicable
      - backend_scaffold_policy_satisfied
    applies_to_single_session: true
ticket_role_transition:
  yss_active:
    to_tickets_initial_role: ready-for-human
    promotion_owner: yss-product-lifecycle
    promoted_role: ready-for-agent
    promotion_requires: ready_for_agent
seam_deferred_required:
  - risk
  - owner
  - follow_up_ticket
  - verification_plan
  - target_version_or_release_date
scaffold_architecture_decision:
  applies_when:
    - backend_impact
    - scaffold_status_required
  owner: yss-product-lifecycle
  stage: work-unit.technical-analysis
  gate: gate.backend-architecture-platform-approved
  timing: after-impact-and-platform-candidate-resolution-before-ddd-or-mvc-branch-design
  source: scaffold-architecture-decisions.yaml
  schema_version: 1
  statuses:
    - undecided
    - recommended
    - awaiting-user-decision
    - user-confirmed
    - lifecycle-approved
    - consumed
    - stale
  user_choices:
    domain-driven:
      display_name: DDD 开发脚手架
      recommendation_signals:
        - aggregate-invariant
        - complex-state-machine
        - cross-aggregate-consistency
        - domain-event
        - complex-concurrency
    layered-mvc:
      display_name: MVC 开发脚手架
      recommendation_signals:
        - crud
        - reporting-query
        - data-transformation
        - external-system-orchestration
        - thin-domain
  platform_choice:
    source: .template-spec/engineering/backend-platforms.json
    confirms:
      - platform_profile
      - spring_boot_version
      - java_version
    version_format: exact-patch
    latest_or_range: forbidden
    same_user_decision_as_architecture: true
  recommendation_policy:
    evidence_required: true
    strong_domain_signal_prefers: domain-driven
    all_strong_domain_signals_absent_and_thin_domain_prefers: layered-mvc
    user_may_override_soft_recommendation: true
    override_reason_required: true
    unsupported_profile_is_hard_blocker: true
  interaction:
    generator_is_non_interactive: true
    main_project_has_no_silent_default: true
    child_projects_prefill_parent_default: true
    batch_confirmation_required: true
    prompt_fields:
      - project
      - responsibility
      - agent_recommendation
      - recommendation_reasons
      - inherited_from
      - current_choice
      - platform_profile
      - spring_boot_version
      - java_version
      - architecture_profile
      - verification_database
      - production_database
      - resolved_modules
      - warnings
    missing_or_deferred_action: blocked
  inheritance:
    modes:
      - root-default
      - inherit
      - override
    parent_change_stales_inherited_children: true
    explicit_overrides_survive_parent_change: true
    shared_profile_change_stales_all_affected: true
    new_child_requires_confirmation: true
  persistence:
    required:
      - decision_id
      - project_id
      - parent_project_id
      - recommended_architecture
      - recommendation_reasons
      - confirmed_architecture
      - override_reason
      - inheritance_mode
      - inherited_from
      - platform_profile
      - exact_spring_boot_version_in_user_snapshot
      - architecture_profile
      - verification_database
      - production_database
      - requested_capabilities
      - resolved_modules
      - resolution_version
      - user_confirmation
      - decision_inputs_digest
      - status
    downstream_reference:
      - decision_ref
      - decision_id
      - decision_digest
    approval_gate: gate.backend-architecture-platform-approved
    existing_repository: reuse-current-registration-without-user-reconfirmation
  change_policy:
    before_lifecycle_approval: update-decision
    after_lifecycle_approval_before_generation: stale-contract-and-recompile
    after_generation: separate-architecture-migration-work-unit
scaffold_work_unit_policy:
  applies_to:
    - scaffold_generator_output
  scope: pre_business_code_generation
  required:
    - approved_scaffold_contract
    - primary_yss_skill
    - allowed_write_paths
    - expected_evidence_files
    - verification_commands
  controlled_generation:
    allowed_for:
      - project_scaffold
      - pom
      - mechanical_config
      - wrapper
    forbidden_when:
      - business_behavior
      - business_fields
      - business_state
      - permission
      - transaction
      - complex_query
      - error_mapping
      - business_example_crud
  on_violation: blocked
lifecycle_owned_work_units:
  - release
  - retrospective
lifecycle_work_unit_requirements:
  release:
    - fresh_verification
    - release_or_rollback_evidence
    - applicable_review_evidence
    - all_triggered_gates_approved_or_not_applicable
  retrospective:
    - fresh_verification
    - retrospective_record
    - governance_reflow_decision
wayfinder_completion:
  required:
    - no_open_children
    - no_open_blocked_or_claimed_children
    - no_fog
    - destination_clear
wayfinder_mode:
  optional: true
  enable_when:
    - multi-session-or-multi-agent-work
    - unclear-decision-frontier
    - cross-domain-dependency-map-needed
  lifecycle_position: plan-to-spec-planning
  completion_route: wayfinder -> handoff -> to-spec
  does_not_replace:
    - lifecycle-gates
    - spec-baseline
    - ticket-formalization
  forbidden_state_mutations:
    - ready-for-agent
    - gate-approval
    - ticket-role
  template_source_use: only-when-template-evolution-is-long-running
quality_baseline_reuse:
  source: artifact.engineering-baseline
  applies_to: project-instance
  consumers:
    - slice-implementation-contract
    - yss-skill-execution-result
    - code-review
    - release
  constraint_results_field: required
  redefinition: forbidden
unknown_impact:
  action: investigate-and-block-dependent-transition
  reason_code: impact-classification-required
  user_question: only-if-investigation-identifies-missing-real-decision-or-authorization
  full_axis_default_or_fallback: forbidden
prototype_return_evidence:
  required:
    - prototype_mode
    - source_handoff
    - prototype_asset_or_run
    - conclusion
    - updated_authoritative_asset
    - remaining_questions
    - return_handoff
  allowed_modes:
    - matt_logic
    - yss_high_fidelity
external_input_pause:
  transition: pause
  reason_code: external-input-required
  reason: required decision-maker input is not available to the Agent
  required:
    - questionnaire_ref
    - recipient_ref
    - requested_outputs
    - resume_route
  response_required:
    - response_ref
    - user_decisions
    - reclassified_impact
    - updated_authoritative_asset
  resume_requires:
    - response_ref
    - user_decisions
    - reclassified_impact
    - updated_authoritative_asset
prototype_modes:
  matt_logic:
    asset: single_file_shareable_html
    branch_pattern: prototype/<name>
    required:
      - prototype_mode
      - prototype_branch
      - source_handoff
      - prototype_asset_or_run
      - conclusion
      - updated_authoritative_asset
      - remaining_questions
      - return_handoff
    purpose: exploratory_primary_source
    production_delivery: false
    replaces_yss_high_fidelity: false
  yss_high_fidelity:
    asset: ant_design_v6_html
    required:
      - prototype_mode
      - prototype_review
      - offline_html_verification
      - browser_verification
      - prototype_evidence
      - user_confirmation
    purpose: product_design_review
    replaces_matt_logic: false
behavioral_invariants:
  wait_what_preserves_state: true
  human_checkpoint_required_for_manual_steps: true
  diagnostics_redact_secrets: true
