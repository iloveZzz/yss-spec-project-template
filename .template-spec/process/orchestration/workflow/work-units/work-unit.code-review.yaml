# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
work_unit_routes:
  work-unit.code-review:
    check_ids: [work-unit.code-review]
    impact_check_ids:
      wording: []
      ui-state: []
      api-schema: [check.openapi-draft-reviewed, check.openapi-frozen]
      state-machine: []
      data-model: []
      service-boundary: [check.architecture-reviewed]
      nfr: []
      backend: []
      domain: []
      api: [check.openapi-draft-reviewed, check.openapi-frozen]
      data: []
      persistence: []
      architecture: [check.architecture-reviewed]
      cross-repo: [check.architecture-reviewed]
      cross-boundary: [check.architecture-reviewed]
      high-risk: [check.architecture-reviewed]
      frontend: []
      ui: []
    native:
      source: yss-product-lifecycle
      skill: code-review
      invocation_mode: model-invoked
    primary_skill: code-review
    supporting_skills:
      - alibaba-java-code-style
      - yss-design-system
      - yss-domain
      - yss-application
      - yss-repository
      - yss-mybatis
      - yss-web-controller
      - yss-dto
      - mapstruct
      - lombok
    skills:
      - code-review
      - alibaba-java-code-style
      - yss-design-system
      - yss-domain
      - yss-application
      - yss-repository
      - yss-mybatis
      - yss-web-controller
      - yss-dto
      - mapstruct
      - lombok
    review_standards_route:
      unique_default_skill: code-review
      second_generic_review_skill: forbidden
      report_template: .template-spec/templates/review-report-template.md
      contract_required_skills: required
      write_implementation: forbidden
      machine_checks:
        run_if_present: true
        missing_tooling: not-applicable-with-reason
        checkable_rule_without_machine: not-a-pass
      project_scope:
        sources:
          - candidate-project-root
          - implementation-repository-registry
          - slice-project-roots
          - allowed-write-paths
        include:
          - project-itself
          - registered-backend-development-projects
        exclude:
          - frontend-projects
          - unrelated-submodules
          - vendor
          - unregistered-directories
        fixed_apps_backend_assumption: forbidden
      conditional_skills:
        backend_impact:
          - alibaba-java-code-style
          - yss-domain
          - yss-application
          - yss-repository
          - yss-mybatis
          - yss-web-controller
          - yss-dto
          - mapstruct
          - lombok
        ui_impact:
          - yss-design-system
      not_applicable_reasons:
        backend_impact: no_backend_impact
        ui_impact: no_ui_impact
      finding_disposition:
        same_loop_for:
          - product-slice
          - template-maintenance
        intensity:
          product-slice: slice-contract
          template-maintenance: L1-L2
        reviewer_write_implementation: forbidden
        repair_then_targeted_rereview:
          kinds:
            - violation
            - machine_check_failure
            - blank_applicable_row
            - missing_evidence
          actor: implementer
          on_original_contract: true
          then: compare_diff_map_affected_conclusions_behavior_dependencies_rereview_and_rebind
          reuse_unaffected: readable-unchanged-conditions-basis-and-dependencies-evidence
        stale_and_reroute:
          kinds:
            - drift
            - new_impacts
            - required_skills_mismatch
          mark_contract: stale
          continue_coding_on_old_contract: forbidden
          impact_analysis: investigate-before-selecting-rereview-scope
          next: compiler-or-earlier-lifecycle
        exemption_policy:
          not_applicable: impact_not_triggered_only
          mandatory_waiver: forbidden
          allowed_exits:
            - repair
            - seam-deferred-complete
          new_human_waiver_gate: forbidden
          existing_human_gates_unchanged: true
    applies_when: implementation_candidate_exists
    not_applicable_reason: no_implementation_candidate
