# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
work_unit_routes:
  work-unit.prototype-design-v2:
    check_ids: [check.prototype-reviewed, check.prototype-verified]
    impact_check_ids:
      wording: []
      ui-state: []
      api-schema: []
      state-machine: []
      data-model: []
      service-boundary: []
      nfr: []
      backend: []
      domain: []
      api: []
      data: []
      persistence: []
      architecture: []
      cross-repo: []
      cross-boundary: []
      high-risk: []
      frontend: []
      ui: []
    native:
      source: yss-product-lifecycle
      skill: yss-product-lifecycle
      invocation_mode: model-invoked
    preparation_policy_ref: .template-spec/process/orchestration/domain/review.yaml#preparation_policy
    approval_requirement: formal-completion-and-implementation-only
    primary_skill: yss-prototype-stage
    supporting_skills:
      - prototype-review
      - yss-design-system
    skills:
      - prototype-review
      - yss-design-system
      - yss-prototype-stage
    execution_order:
      - yss-design-system
      - low-fidelity-assets
      - prototype-review
      - prototype-profile-routing
      - profile-adapter-build
      - browser-design-qa-accessibility
      - user-confirmation
    profile_routing_ref: .agents/skills/yss-prototype-stage/references/prototype-profile-routing.md
    prototype_adapter_ref: .agents/skills/yss-prototype-stage/references/product-design-adapter.md
    evidence_schema_version: 4
    profile_contract:
      default_when_uncertain: H2
      highest_matching_profile_wins: true
      profiles:
        H1:
          kind: visual-review
          adapter: static-html
          node_runtime_required: false
          antd_facts: not-applicable
        H2:
          kind: flow-review
          adapter: runnable-flow
          react_antd: supported-not-required
          antd_facts: conditional
    implementation_handoff:
      production_component_assumptions: required-array
      verification_targets: not-applicable
    version_boundary:
      h2_design_standard: html-css-js-offline
      prototype_must_not_call: production-component-library
      production_version_source: implementation-lockfile
    human_gate: gate.product-design-approved
    applies_when: product_design_impact
    not_applicable_reason: no_ui_or_product_design_impact
