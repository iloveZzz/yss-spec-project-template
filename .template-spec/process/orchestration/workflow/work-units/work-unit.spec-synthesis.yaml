# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
work_unit_routes:
  work-unit.spec-synthesis:
    check_ids: [check.artifact-consistency-analyzed, gate.spec-baseline-approved]
    impact_check_ids:
      wording: []
      ui-state: []
      api-schema: []
      state-machine: []
      data-model: []
      service-boundary: []
      nfr: []
      backend: []
      domain: []
      api: []
      data: []
      persistence: []
      architecture: []
      cross-repo: []
      cross-boundary: []
      high-risk: []
      frontend: []
      ui: []
    native:
      source: yss-product-lifecycle
      skill: yss-product-lifecycle
      invocation_mode: model-invoked
    preparation_policy_ref: .template-spec/process/orchestration/domain/review.yaml#preparation_policy
    approval_requirement: formal-completion-and-implementation-only
    primary_skill: yss-product-lifecycle
    supporting_skills:
      - domain-modeling
    compatibility:
      source: mattpocock/skills
      skill: to-spec
      invocation_mode: reference
      formal_artifact_owner: explicit-user-entry
    skills:
      - domain-modeling
    human_gate: spec-baseline
    applies_when: new_feature_or_behavior_change
    not_applicable_reason: existing_frozen_spec_is_current
