# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
work_unit_routes:
  work-unit.strategic-design-handoff:
    check_ids: []
    impact_check_ids:
      wording: []
      ui-state: []
      api-schema: []
      state-machine: []
      data-model: []
      service-boundary: []
      nfr: []
      backend: []
      domain: []
      api: []
      data: []
      persistence: []
      architecture: []
      cross-repo: []
      cross-boundary: []
      high-risk: []
      frontend: []
      ui: []
    native:
      source: yss-product-lifecycle
      skill: yss-product-lifecycle
      invocation_mode: model-invoked
    primary_skill: yss-product-lifecycle
    supporting_skills: []
    skills:
      - yss-product-lifecycle
    applies_when: explicit-user-package-request
    not_applicable_reason: local-spec-assets-consumed-directly
    post_approval_action:
      command: scripts/strategic-handoff finalize --source-root <project-root>
        --handoff <approved-v5-ref>
      output_root: docs/deliveries/strategic/<handoff-id>/<version>
      checkpoint_artifact: artifact.strategic-design-handoff
      checkpoint_evidence:
        - delivery-record.json
        - verification.json
      checkpoint_verification: verification.strategic_delivery
      failure_status: blocked
      receiver_receipt_required: false
