# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
work_unit_routes:
  work-unit.technical-analysis:
    native:
      source: yss-product-lifecycle
      skill: yss-product-lifecycle
      invocation_mode: model-invoked
    primary_skill: yss-technical-design
    supporting_skills:
      - yss-openapi-governance
      - yss-openapi-draft-review
      - codebase-design
      - implementation-repo-onboarding
      - yss-implementation-contract-compiler
    skills:
      - yss-technical-design
      - yss-openapi-governance
      - yss-openapi-draft-review
      - codebase-design
      - implementation-repo-onboarding
      - yss-implementation-contract-compiler
    technical_design:
      applies_when: backend_delivery_impact
      new_backend_repository: required
      architecture_source: new-project-user-gate-or-current-existing-registration-before-branch-design
      pre_design_gate:
        id: gate.backend-architecture-platform-approved
        applies_when: new_backend_repository
        confirms:
          - architecture_family
          - exact_spring_boot_version
        architecture_choices:
          - domain-driven
          - layered-mvc
        platform_source: .template-spec/engineering/backend-platforms.json
        existing_repository: not-applicable-reuse-current-registration
        missing_or_stale: blocked
      branches:
        domain-driven: yss-tactical-design
        layered-mvc: yss-technical-design
      not_applicable_reason: no_backend_technical_design_impact
      artifact: artifact.technical-design
      review_evidence: evidence.technical-design-review
      legacy_ddd_artifact: artifact.tactical-design
      legacy_ddd_review_evidence: evidence.tactical-design-review
      statuses:
        - draft
        - ready-for-human
        - approved
        - blocked
        - stale
        - drift
        - new_impacts
        - not-applicable
      approved_by: yss-product-lifecycle
      forbidden:
        - self-approval
        - ready-for-agent
        - production-code-generation
    data_architecture_decision:
      schema_version: 1
      applies_when: backend_delivery_impact
      impact_modes:
        - required
        - not-applicable
      required:
        - impact_assessment_ref
        - impact_assessment_digest
        - evidence_refs
      required_when_data_impact:
        - data_architecture_ref
        - data_architecture_digest
        - review_evidence_refs
      not_applicable_requires:
        - explicit_reason
        - evidence_refs
      empty_data_architecture_document: forbidden
    api_contract_decision:
      schema_version: 1
      impact_modes:
        - required
        - not-applicable
      required:
        - impact_assessment_ref
        - impact_assessment_digest
        - evidence_refs
      required_when_api_impact:
        - openapi_ref
        - openapi_version
        - openapi_digest
        - validation_record_ref
        - validation_record_digest
        - draft_review_ref
        - draft_review_digest
        - freeze_version
        - freeze_time
      same_draft_bytes_required_across:
        - openapi
        - validation
        - draft-review
        - freeze
        - engineering-approval
      validation_requires:
        - openapi-3.1
        - locked-redocly
        - exit-code-zero
        - all-checks-passed
      review_requires:
        - approved
        - no-blocking-findings
        - independent-review-evidence
      not_applicable_requires:
        - explicit_reason
        - evidence_refs
      placeholder_assets: forbidden
      atomic_approval_gate: gate.engineering-contract-approved
    human_gate: gate.engineering-contract-approved
    entry_user_gate: gate.backend-architecture-platform-approved
    applies_when: technical_or_contract_impact
    not_applicable_reason: no_technical_or_contract_impact
