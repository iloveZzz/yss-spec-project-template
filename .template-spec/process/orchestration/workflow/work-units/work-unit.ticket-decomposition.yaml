# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
work_unit_routes:
  work-unit.ticket-decomposition:
    native:
      source: yss-product-lifecycle
      skill: yss-product-lifecycle
      invocation_mode: model-invoked
    primary_skill: yss-product-lifecycle
    supporting_skills:
      - yss-implementation-contract-compiler
    compatibility:
      source: mattpocock/skills
      skill: to-tickets
      invocation_mode: reference
      formal_artifact_owner: explicit-user-entry
    skills:
      - yss-implementation-contract-compiler
    applies_when: frozen_scope_ready_for_slicing
    not_applicable_reason: contract_or_scope_not_frozen
    must_complete_before: work-unit.slice-implementation
