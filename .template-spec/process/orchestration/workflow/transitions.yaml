# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
transition_graph:
  preparation_policy_ref: .template-spec/process/orchestration/domain/review.yaml#preparation_policy
  preparation_does_not_promote_ticket: true
  validator: scripts/lib/lifecycle-transition.mjs
  implementation_requires_predecessor: work-unit.ticket-decomposition
  routes:
    work-unit.ssot-update:
      - work-unit.skill-projection-sync
      - work-unit.intensity-aware-verification-v2
    work-unit.skill-projection-sync:
      - work-unit.template-snapshot-build
      - work-unit.intensity-aware-verification-v2
    work-unit.template-snapshot-build:
      - work-unit.attach-sync-integration
      - work-unit.intensity-aware-verification-v2
    work-unit.attach-sync-integration:
      - work-unit.intensity-aware-verification-v2
    work-unit.intensity-aware-verification-v2:
      - work-unit.intensity-aware-review-v2
    work-unit.intensity-aware-review-v2:
      - work-unit.release-and-rollback
    work-unit.release-and-rollback: []
    work-unit.plan-opportunity:
      - work-unit.plan-requirements
      - work-unit.domain-strategy-design
      - work-unit.stage-decision
      - work-unit.spec-synthesis
    work-unit.plan-requirements:
      - work-unit.domain-strategy-design
      - work-unit.stage-decision
      - work-unit.spec-synthesis
    work-unit.domain-strategy-design:
      - work-unit.stage-decision
      - work-unit.spec-synthesis
    work-unit.stage-decision:
      - work-unit.spec-synthesis
    work-unit.spec-synthesis:
      - work-unit.prototype-design-v2
      - work-unit.technical-analysis
      - work-unit.business-ticket-formalization
    work-unit.prototype-design-v2:
      - work-unit.technical-analysis
      - work-unit.business-ticket-formalization
    work-unit.technical-analysis:
      - work-unit.implementation-repository-preparation
    work-unit.implementation-repository-preparation:
      - work-unit.ticket-decomposition
    work-unit.ticket-decomposition:
      - work-unit.slice-implementation
    work-unit.slice-implementation:
      - work-unit.code-review
    work-unit.code-review:
      - work-unit.release-and-retrospective
      - work-unit.slice-implementation
      - work-unit.backend-delivery
    work-unit.backend-delivery:
      - work-unit.release-and-retrospective
    work-unit.release-and-retrospective: []
    work-unit.business-ticket-formalization:
      - work-unit.technical-analysis
      - work-unit.strategic-design-handoff
    work-unit.strategic-design-handoff:
      - work-unit.technical-analysis
  forbidden_shortcuts:
    - from: work-unit.spec-synthesis
      to: work-unit.implementation-repository-preparation
    - from: work-unit.prototype-design-v2
      to: work-unit.implementation-repository-preparation
    - from: work-unit.spec-synthesis
      to: work-unit.slice-implementation
    - from: work-unit.prototype-design-v2
      to: work-unit.slice-implementation
    - from: work-unit.technical-analysis
      to: work-unit.slice-implementation
    - from: work-unit.technical-analysis
      to: work-unit.ticket-decomposition
