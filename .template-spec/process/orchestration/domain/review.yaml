gate_policy:
  default_if_unlisted: reject-unlisted
  review_execution:
    additional_reviewers: explicit-user-or-known-external-requirement
    adjacent_checks: one-review-with-per-check-conclusions
    suggestions: backlog-without-blocking
    violations_or_missing_evidence: blocking
    review_bundles:
    - bundle_id: review-bundle.plan
      work_unit: work-unit.plan-requirements
      aggregate_gate: gate.plan-approved
      checks:
      - check.domain-strategy-approved
      - check.stage-decision-package-approved
      check_order: domain-strategy-before-stage-decision
      aggregate_professional_result: reuse-internal-check-conclusions
      aggregate_additional_review_task: forbidden
      review_control_ref: .template-spec/process/orchestration-contract.yaml#planning.review_control
  commercial_contract: real-user-authorization
  runtime_side_effect_approval: real-user-authorization
  profiles:
    spec:
      automatic_checks:
      - check.repository-identity-valid
      - check.prototype-verified
      - check.artifact-consistency-analyzed
      - check.implementation-repositories-ready
      - check.slice-ready-for-agent
      - check.openapi-frozen
      check_reviews:
      - gate: check.domain-strategy-approved
        capability_ids:
        - capability.business-rules
      - gate: check.stage-decision-package-approved
        capability_ids:
        - capability.business-rules
      - gate: check.prototype-reviewed
        capability_ids:
        - capability.prototype-assurance
      - gate: check.openapi-draft-reviewed
        capability_ids:
        - capability.openapi-contract
      - gate: check.design-reviewed
        capability_ids:
        - capability.technical-design
      - gate: check.architecture-reviewed
        capability_ids:
        - capability.technical-design
      - gate: check.engineering-baseline-accepted
        capability_ids:
        - capability.engineering-baseline
      technical_reviews:
      - gate: gate.plan-approved
        capability_ids:
        - capability.business-rules
      - gate: gate.spec-baseline-approved
        capability_ids:
        - capability.spec-acceptance
      - gate: gate.engineering-contract-approved
        capability_ids:
        - capability.engineering-acceptance
      - gate: gate.strategic-design-handoff-approved
        capability_ids:
        - capability.strategic-handoff
      - gate: gate.delivery-accepted
        capability_ids:
        - capability.implementation-assurance
      user_decision_gates:
      - gate.product-design-approved
      - gate.backend-architecture-platform-approved
      contract_approval_gates:
      - gate.slice-contract-approved
      work_unit_reviews:
      - work_unit: work-unit.code-review
        capability_ids:
        - capability.implementation-assurance
      evidence_only: []
    backend:
      automatic_checks: []
      check_reviews:
      - gate: check.design-reviewed
        capability_ids:
        - capability.technical-design
      - gate: check.domain-strategy-approved
        capability_ids:
        - capability.business-rules
      - gate: check.stage-decision-package-approved
        capability_ids:
        - capability.business-rules
      technical_reviews:
      - gate: gate.plan-approved
        capability_ids:
        - capability.business-rules
      - gate: gate.spec-baseline-approved
        capability_ids:
        - capability.spec-acceptance
      - gate: gate.engineering-contract-approved
        capability_ids:
        - capability.openapi-contract
        - capability.engineering-baseline
      - gate: gate.technical-design-approved
        capability_ids:
        - capability.technical-design
      - gate: gate.fresh-verification-passed
        capability_ids:
        - capability.implementation-assurance
      user_decision_gates:
      - gate.backend-architecture-platform-approved
      - gate.high-risk-architecture-confirmed
      - gate.openapi-freeze-confirmed
      - gate.merge-approved
      contract_approval_gates:
      - gate.slice-contract-approved
      - gate.slice-ready-for-agent
      evidence_only:
      - gate.repository-identity-valid
      work_unit_reviews:
      - work_unit: work-unit.technical-design
        capability_ids:
        - capability.technical-design
        - capability.openapi-contract
        - capability.engineering-baseline
      - work_unit: work-unit.slice-implementation
        capability_ids:
        - capability.implementation-assurance
  selection: exact-current-profile-no-fallback-and-no-unknown-boundary-skip
