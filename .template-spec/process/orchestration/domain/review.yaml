    - counterclaim
    - evidence_refs
    - residual_risks
    - reviewer_ref
  record_in:
    - decision-record
    - architecture-review
    - contract-review
    - release-review
  blocking_when:
    - missing-counterclaim
    - insufficient-evidence
    - unresolved-residual-risk
  ordinary-low-risk_changes: not-required
  no_new_lifecycle_stage: true
