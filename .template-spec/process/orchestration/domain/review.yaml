# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
review_input:
  schema_version: 1
  required:
    - review_mode
    - review_base_ref
    - implementation_candidate_ref
    - candidate_snapshot_ref
    - candidate_digest
    - spec_ref
    - ticket_ref
    - slice_contract_ref
    - build_architecture_checklist_ref
    - yss_execution_result_refs
  nullable:
    - spec_ref
  unique_default_skill: code-review
  second_generic_review_skill: forbidden
  axes:
    - standards
    - spec
    - ui_fidelity_if_ui_impact
  standards_sources:
    - repo_coding_standards
    - slice_contract_required_skills
    - specialist_check_inputs
    - review_report_template
  scope_resolution:
    sources:
      - candidate-project-root
      - implementation-repository-registry
      - slice-project-roots
      - allowed-write-paths
    backend_includes:
      - project-itself
      - registered-backend-development-projects
    excludes:
      - frontend-projects
      - unrelated-submodules
      - vendor
      - unregistered-directories
  completed_requires_specialist_coverage: true
  finding_disposition_required: true
  completed_requires_no_open_mandatory_violations: true
  completed_requires_no_blank_applicable_rows: true
  reviewer_write_implementation: forbidden-during-frozen-review
  repair_invalidates_candidate: true
  repair_action: recapture_candidate_and_rereview_affected_conclusions_behavior_dependencies
  rereview:
    first_review: all-applicable-axes-and-specialist-checks
    sequence:
      - compare-old-and-current-candidate
      - map-affected-conclusions-behavior-and-dependencies
      - targeted-rereview-and-verification
      - rebind-current-candidate-and-basis
    reuse_requires:
      - readable-comparison-evidence
      - unchanged-check-conditions
      - unchanged-basis
      - unchanged-dependencies
      - current-candidate-binding
    unknown_impact: investigate-and-block-dependent-conclusions
    full_axis_default_or_fallback: forbidden
    digest_ui_new_impacts_alone: insufficient-for-full-axis-rereview
    history: preserve-old-reports-and-bind-new-consumption-evidence
  modes:
    - committed
    - worktree
  committed:
    candidate_ref: HEAD
    diff_scope: merge-base-to-head
  worktree:
    candidate_ref: working-tree
    diff_scope: merge-base-to-working-tree
    required_coverage:
      - committed
      - staged
      - unstaged
      - untracked
    tracked_diff_command: git diff --no-ext-diff --binary --full-index <merge-base>
    untracked_inventory_command: git ls-files -z --others --exclude-standard
    untracked_files_encoding: nul-delimited-raw-path-bytes
    untracked_diff_command: git diff --no-index --no-ext-diff --binary --full-index -- /dev/null <path>
    capture_once: true
    verify_unchanged_after_review: true
  manifest_required_by_mode:
    committed:
      - merge_base
      - tracked_diff_command
      - commit_list_command
    worktree:
      - merge_base
      - tracked_diff_command
      - untracked_inventory_command
      - untracked_diff_command
      - untracked_files
      - commit_list_command
  snapshot:
    immutable: true
    protocol: yss-worktree-candidate-v1
    digest_algorithm: sha256
    digest_framing: length-prefixed-path-and-bytes
    path_order: bytewise
    path_encoding: raw-bytes
    length_encoding: uint64-big-endian
    header_ascii: YSS-WORKTREE-CANDIDATE-V1
    terminator_byte: "0x00"
    tracked_record:
      type_byte: "0x54"
      fields:
        - type_byte
        - uint64be_content_length
        - binary_diff_bytes
      source: tracked_diff_command_stdout
    untracked_record:
      type_byte: "0x55"
      fields:
        - type_byte
        - uint64be_path_length
        - raw_path_bytes
        - uint32be_file_mode
        - entry_kind_byte
        - uint64be_content_length
        - content_bytes
      order: bytewise-raw-path
      entry_kinds:
        regular: "0x52"
        symlink: "0x4c"
      regular_content_source: file_bytes
      symlink_content_source: link_target_bytes
    unsupported_entry_action: blocked
    snapshot_artifact:
      identity: candidate_digest
      required:
        - candidate-manifest.yaml
        - tracked.diff
        - untracked/
      access: immutable-read-only
    on_digest_change: blocked
    completion_requires_current_digest: true
release_readiness:
  required:
    - fresh_verification
    - release_or_rollback_evidence
    - applicable_review_evidence
    - all_triggered_gates_approved_or_not_applicable
  conditional: {}
  blocked_when:
    - triggered_gate_blocked
    - triggered_gate_stale
    - triggered_gate_not_evaluated
    - missing_evidence
