user_decision_evidence:
  policy_ref: .template-spec/agents/digital-human-roles.yaml#user_decision_policy
  schema_ref: .template-spec/process/schemas/user-decision.schema.json
  protocol_ref: references/user-decisions.md
  verifier: scripts/verify-user-decision
  workflow_result_fields:
    - user_decisions
    - user_decision_not_applicable
  implementation_fields:
    - user_decisions
    - slice_contract_ref
    - vertical_slice_ticket_ref
  checkpoint_carrier: human_review
  professional_review_replaced: false
  response_absent: paused-human-gate
  invalid_response: blocked
  basis_changed: revalidate_then_continue_only_with_independent_equivalence_evidence
gate_consolidation:
  source: .template-spec/process/lifecycle-registry.yaml
  check_policy: .template-spec/agents/digital-human-roles.yaml
  capability_source: .template-spec/agents/digital-human-roles.yaml#review_capabilities
  checks: automatic_or_independent_review_without_separate_user_decision
  check_failure: blocks_aggregate_gate
  plan_decision_boundary: gate.plan-approved
  readiness: computed_after_current_approved_contract_and_all_applicable_preconditions
  api_freeze: atomic_with_engineering_contract_approval_same_version
  acceptance_does_not_authorize:
    - merge
    - push
    - release
    - production_change
  reuse: unchanged_approval_or_verified_approved_scope_continuation
  default_review: one_owner_one_independent_reviewer
  adjacent_reviews: one_bundle_with_explicit_per_check_outcomes
  new_approval_and_review_bundle_schema: 2
  current_validation: scripts/verify-approval-record --require-approved --checkpoint <current checkpoint>
  expected_context: consumer-checkpoint-and-review-task-never-self-filled-from-record
  extra_reviewers: uncovered_expertise_conflict_or_external_requirement
  suggestions: recorded_backlog_without_blocking
  continuation_protocol: references/user-decisions.md
  invalidation: affected_dependencies_or_authorization_change_only
  historical_gate_records: read_only_no_automatic_approval_migration
  verifier: scripts/verify-lifecycle-checkpoint
blocking_disposition:
  professional_wait: autonomously-dispatch-or-inspect-existing-task-then-wait
  verification_failure: repair-supply-evidence-or-reroute
  unknown_impact: investigate-before-review-scope-or-decision
  real_decision_or_new_authorization_missing: present-reviewable-assets-then-request-designated-human-response
  unresolved_state_conflict: investigate-and-block-dependent-actions
  independent_authorized_work: continue
  completion_conclusion_alone: no-new-pause
  question_count: minimum-actionable-independent-questions-may-be-batched
