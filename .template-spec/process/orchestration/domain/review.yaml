      work_unit_gates:
        work-unit.spec-synthesis:
        - gate.spec-baseline-approved
review_modes:
  default: self-check
  schema_ref: .template-spec/process/schemas/governance-evidence.schema.json#/$defs/review
  independent_required_when:
  - explicit-user-requirement
  - known-applicable-external-rule
  independent_requires:
  - different-actual-execution-context
  - verifiable-implementation-and-review-records
  - same-frozen-candidate-and-scope
  - readonly-review-result
  same_account: permitted-unless-external-policy-forbids
  self_check_never_substitutes:
  - independent-review
  - real-user-decision
  - external-required-review
  source_truth: native-reader-verifies-records-not-self-declared-names
  ordinary_unavailable_identity: record-reason-without-blocking
  no_pre_registration: true
external_rules_policy:
  states:
    none-known: proceed-without-empty-policy-or-extra-confirmation-never-claim-external-approval
    known-verifiable: consume-current-source-candidate-scope-and-status
    known-unverifiable: unsatisfied-block-only-dependent-action
  new_or_changed_rule: recompute-affected-scope
  technical_completed: does-not-authorize-dependent-external-action-or-business-acceptance
  platform_protection_changes: not-authorized-by-this-policy
preparation_policy:
  work_units:
  - work-unit.plan-opportunity
  - work-unit.plan-requirements
  - work-unit.domain-strategy-design
  - work-unit.stage-decision
  - work-unit.spec-synthesis
  - work-unit.prototype-design-v2
  - work-unit.technical-analysis
  - work-unit.technical-design
  - work-unit.ticket-decomposition
  - work-unit.slice-contract
  requires:
  - authorized-preparation-scope
  - current-input-bindings
  - applicable-professional-checks
  - explicit-unresolved-items
  predecessor_user_approval: not-required-for-draft-preparation
  unapproved_inputs: draft-only-preserve-status-and-provenance
  grants_implementation: false
  forbidden_outputs:
  - user-approval
  - ready-for-agent
  - business-accepted
  implementation_requires:
  - current-formed-assets
  - real-user-decision-or-valid-continuation
  - approved-current-implementation-contract
  - all-applicable-checks
  - authorized-repository-and-write-scope
  architecture_preparation: unconfirmed-options-may-be-drafted-never-generated-or-implemented

impact_review_matrix:
  localized_reversible:
    required: [current-scope, self-check, necessary-verification, rollback]
    escalation: changed-scope-or-unknown-facts
  api_or_routine_business:
    required: [draft, content-review, digest-freeze, implementation, contract-tests]
    block: missing-input-or-unfrozen-contract-or-digest-drift
  authorization_breaking_api_or_irreversible_data:
    required: [impact-analysis, counterexamples, actual-verification, recovery-plan, applicable-user-decision]
    block: unproven-recovery-or-missing-required-decision
  cross_repository_or_external_input:
    required: [trusted-source, known-version, normalized-paths, current-digests, applicable-scope, unresolved-items]
    block: untrusted-input-or-missing-required-professional-evidence
  explicit_independence:
    required: [verifiable-independent-context, frozen-candidate, readonly-review]
    block: missing-provenance-or-changed-candidate
  external_rule:
    policy_ref: .template-spec/process/orchestration/domain/review.yaml#external_rules_policy
  unknown:
    action: read-only-investigation-and-formal-entry
    low_impact_default: forbidden
