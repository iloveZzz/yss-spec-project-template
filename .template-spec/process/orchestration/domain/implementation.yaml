# owner: yss-product-lifecycle
# consumers: lifecycle route/query, current Profile workflows and governance validators
implementation_path_policy:
  harness_layout:
    backend: apps/backend/<project>/
    frontend: apps/frontend/<project>/
  container_roots:
    - apps/backend/
    - apps/frontend/
  forbidden_roots: []
  container_roots_are_projects: false
  external_repository_uses_native_root: true
  policies:
    - harness-apps-multi-project
    - external-repository-native
    - git-submodule-harness-apps
  git_submodule:
    repository_scope: git-submodule
    layout_policy: git-submodule-harness-apps
ticket_formalization:
  repository_predecessor: work-unit.implementation-repository-preparation
  implementation_predecessor: work-unit.ticket-decomposition
  result_ref_required: true
  result_must_be: completed
  evidence_refs_required: true
  vertical_slice_ticket:
    kind: vertical-slice-ticket
    role_before_promotion: ready-for-human
    role_for_implementation: ready-for-agent
    local_ref_contract: .template-spec/process/work-layout.md
    parent_ticket_ref_forbidden: true
  slice_contract_binding:
    ticket_ref_must_equal: vertical_slice_ticket_ref
    status: approved
    persisted: true
    current_version: true
  validator:
    module: scripts/lib/lifecycle-transition.mjs
    functions:
      - validateNextRoute
      - validateImplementationRepositoriesReady
      - validateTicketFormalization
      - validateImplementationEntry
implementation_repository_preparation:
  stage: stage.system-data-engineering
  work_unit: work-unit.implementation-repository-preparation
  check: check.implementation-repositories-ready
  applies_per_delivery_role:
    - backend
    - frontend
  affected_role_allowed_states:
    - existing-and-onboarded
    - initialized-and-verified
  unaffected_role_state: not-applicable
  not_applicable_reason_required: true
  existing_repository:
    required:
      - repository_ref
      - project_root
      - repository_scope
      - onboarding_result
    onboarding_skill: implementation-repo-onboarding
    architecture_migration: separate-initiative
  new_repository:
    default_scope: external-repository
    allowed_scopes:
      - external-repository
      - harness-apps
      - git-submodule
    user_confirmation_required:
      - scope
      - project_root
      - init_git
    remote_repository_creation: explicit-authorization-only
    approved_project_scaffold_contract_required: true
    frontend_contract_minimum_schema_version: 4
    backend_new_generation_schema_version: 5
    backend_legacy_empty_generation_schema_versions:
      - 4
    backend_historical_read_only_schema_versions:
      - 3
    target_policy: nonexistent-or-empty
    force_overwrite: forbidden
    completion_requires:
      - scaffold_manifest_ref
      - scaffold_verification
      - technical_design
      - data_architecture_decision
      - api_contract_decision
      - engineering_contract_approval_ref
    legacy_v3_requires:
      - legacy_reconciliation
      - unchanged_mechanical_ownership
      - completed_technical_data_api_prerequisites
      - recovery_approval
    premature_implementation: blocked-preserve-files
  aggregate_result:
    required:
      - result
      - current_version
      - projects
      - evidence_refs
    result: completed
    evidence_refs_readable: true
    stale_action: return-to-work-unit.implementation-repository-preparation
  blocking_signals:
    - implementation-repository-decision-required
    - implementation-repository-location-required
    - implementation-repository-onboarding-incomplete
    - scaffold-choice-required
    - scaffold-contract-unapproved
    - scaffold-generation-incomplete
    - scaffold-verification-failed
    - frontend-template-unavailable
    - implementation-repositories-stale
git_authorization:
  natural_language_intent_is_authorization: false
  explicit_scoped_user_reply_may_be_normalized: true
  commit:
    requires_explicit_user_authorization: true
    required:
      - commit_authorized
      - commit_scope
      - commit_authorization_ref
    authorized_value: true
    non_empty:
      - commit_scope
      - commit_authorization_ref
    unauthorized_action: checkpoint-only
  push:
    requires_explicit_user_authorization: true
    required:
      - push_authorized
      - push_scope
      - push_authorization_ref
    authorized_value: true
    non_empty:
      - push_scope
      - push_authorization_ref
    unauthorized_action: checkpoint-only
  git_submodule:
    applies_when: repository_scope=git-submodule
    forbid_commit_on_detached_head: true
    commit_order:
      - submodule-repositories
      - superproject-gitlink
    push_order:
      - submodule-repositories
      - superproject-gitlink
    push_recurse_submodules: check
    empty_gitlink_scaffold: blocked
    treat_empty_gitlink_as_regular_dir: blocked
    treat_detached_head_as_regular_dir: blocked
    force_overlay_mount: blocked
    write_inside_detached_head: blocked
    require_git_entry_mode: "160000"
    working_tree_declared_scope_must_match: true
    copy_source_into_harness: forbidden
    clone_requires_recurse_submodules: true
    delivery_order_must_include: superproject-gitlink-update
    nested_authorization: per-repository
    inspect_working_tree_writable: explicit-boolean
    empty_gitlink_writable: false
    force_overlay_regular_dir_path: blocked
backend_scaffold:
  applies_when:
    - backend_impact
  scaffold_statuses:
    - existing
    - required
    - initialized
  required_status: required
  sequence:
    after:
      - prototype_review
      - prototype_verification
      - offline_html_verification
      - browser_verification
      - prototype_confirmation
      - engineering_baseline
    before_generator:
      - scaffold-architecture-decision-user-confirmed
      - scaffold-architecture-decision-lifecycle-approved
      - yss-implementation-contract-compiler-scaffold-contract
      - lifecycle-approve-scaffold-contract
    before:
      - business_code_generation
      - implement
  generator_routes:
    domain-driven:
      recipe: backend.ddd-scaffold
      generator_skill: yss-ddd-scaffold-generator
      baseline_skills: []
    layered-mvc:
      recipe: backend.mvc-scaffold
      generator_skill: yss-layered-mvc-scaffold-generator
      baseline_skills: []
  tdd_mode: controlled-generation
  contract_schema:
    schema_version: 5
    current_schema_version: 5
    schema_ref: .template-spec/process/schemas/project-scaffold-contract.schema.json
    compatible_backend_versions:
      - 3
      - 4
      - 5
    frontend_minimum_version: 4
    identity: service-engineering-baseline
    required:
      - contract_id
      - contract_version
      - scaffold_request_id
      - status
      - compiler_draft_ref
      - lifecycle_approval_ref
      - persisted_ref
      - current_version
      - implementation_repository
      - backend_repository
      - scaffold_status
      - project_name
      - target_output_dir
      - base_package
      - architecture_family
      - generator_skill
      - decision_ref
      - decision_id
      - decision_digest
      - maven_coordinates
      - profiles
      - module_profile
      - reference_example
      - allowed_write_paths
      - expected_evidence_files
      - verification_commands
      - approval
      - work_unit
      - generation_policy
    status_by_owner:
      router:
        - draft
        - ready-for-lifecycle-review
        - blocked
      lifecycle:
        - approved
        - stale
        - blocked
    approval:
      required:
        - approval_ref
        - approver
        - persisted_ref
        - current_version
    generation_policy:
      required:
        - mode
        - existing_target
        - old_project_migration
        - template_upgrade
      mode: initialize-only
      existing_target: unsupported
      old_project_migration: unsupported
      template_upgrade: unsupported
    maven_coordinates:
      required:
        - group_id
        - project_version
        - parent
        - yss_components_version
      parent_required:
        - group_id
        - artifact_id
        - version
      source: platform_configuration-v2-and-backend-platform-catalog
      component_version_policy: per-artifact-from-verified-component-capabilities
    profiles:
      discriminant: architecture_family
      source: .template-spec/engineering/backend-platforms.json
      platform_binding: platform_configuration-v2
      architecture_profiles_source: .template-spec/agents/yss-skill-registry.yaml
      unsupported:
        - old-architecture-profile
        - arbitrary-module-combination
        - unverified-platform-or-component-capability
    module_profile:
      required:
        - requested_capabilities
        - resolved_modules
        - resolution_version
      resolution_version: 1
    unsupported_inputs:
      schema_v1: reject-no-auto-upgrade
      schema_v2_new_generation: reject-no-auto-upgrade
      schema_v3_new_generation: reject-historical-read-only
      slice_id: forbidden-as-scaffold-identity
      existing_project: reject-no-scaffold-migration
  required_inputs:
    - implementation_repository
    - backend_repository
    - scaffold_status
    - scaffold_target_confirmed
    - scaffold_request_id
    - target_output_dir
    - project_name
    - base_package
    - architecture_family
    - generator_skill
    - decision_ref
    - decision_id
    - decision_digest
    - technical_design_ref
    - technical_design_version
    - technical_design_digest
    - data_architecture_decision_ref
    - data_architecture_decision_version
    - data_architecture_decision_digest
    - engineering_contract_approval_ref
    - maven_group_id
    - project_version
    - parent_group_id
    - parent_artifact_id
    - parent_version
    - yss_components_version
    - architecture_profile
    - persistence_profile
    - verification_database
    - production_database
    - platform_profile
    - validation_namespace
    - dto_placement
    - repository_profile
    - requested_capabilities
    - resolved_modules
    - resolution_version
    - scaffold_contract_file
    - scaffold_contract_draft
    - scaffold_contract_id
    - scaffold_contract_version
    - scaffold_contract_status
    - scaffold_contract_approved
    - scaffold_contract_compiler_draft_ref
    - scaffold_contract_lifecycle_approval_ref
    - scaffold_contract_persisted
    - scaffold_contract_persisted_ref
    - scaffold_contract_current_version
  required_evidence:
    - scaffold_architecture_decision
    - user_confirmation_ref
    - decision_digest
    - technical_design
    - data_architecture_decision
    - engineering_contract_approval
    - generator_inputs
    - expected_files
    - scaffold_generation_manifest_v5
    - generated_project_structure
    - generation_execution_result
    - verification_execution_result
    - architecture_rules
    - ./mvnw_validate
    - ./mvnw_test
    - ./mvnw_package
    - yss_skill_execution_result
  generation_options:
    with_example: true
    legacy_v4_with_example: false
    force: forbidden-by-default
    regeneration: unsupported
    template_upgrade: unsupported
    old_project_migration: unsupported-separate-architecture-modernization-initiative
  forbidden_generation:
    - business_rules
    - state_machine
    - permission
    - transaction
    - complex_query
    - error_mapping
    - user_visible_behavior
    - business_example_crud
    - unapproved_force_overwrite
  after_generation:
    domain-driven:
      - yss-implementation-contract-compiler
    layered-mvc:
      - yss-implementation-contract-compiler
  existing_or_initialized:
    - baseline_evidence
    - wrapper_verification
    - implementation_contract_recompile
  verification:
    commands:
      - ./mvnw validate
      - ./mvnw test
      - ./mvnw package
    requires_execution: true
    printed_commands_are_not_evidence: true
    completion_levels:
      - generated
      - empty-scaffold-verified
      - first-slice-verified
    downstream_readiness_claim_requires: first-slice-verified
    evidence:
      - preflight
      - command
      - exit_code
      - failure_category
      - duration_ms
      - stdout_ref
      - stderr_ref
      - executed_at
    completion_requires:
      - validate_passed
      - test_passed
      - package_passed
    failure_categories:
      - repository-access
      - project-model
      - compilation
      - bootstrap-entrypoint
      - test-failure
      - packaging
      - maven-execution
      - verification-preflight
    failure_action: blocked
  failure_action: blocked
post_scaffold_generated_code_policy:
  applies_to:
    - post_scaffold_backend_code
  scope: post_scaffold_generated_code
  required:
    - approved_persisted_current_slice_contract
    - primary_yss_skill
    - dependency_closure
    - allowed_write_paths
    - expected_evidence_files
    - yss_skill_execution_result
  business_behavior:
    tdd_mode: behavior-tdd
    impacts:
      - domain-rule
      - state-machine
      - transaction
      - permission
      - complex-query
      - error-mapping
      - user-visible-behavior
  controlled_generation:
    allowed_for:
      - dto_boilerplate
      - po_boilerplate
      - mapstruct_generated
      - frozen_openapi_client
      - mechanical_config
    forbidden_when:
      - business_behavior
      - business_fields
      - business_state
      - permission
      - transaction
      - complex_query
      - error_mapping
      - business_example_crud
  on_violation: blocked
ready_for_agent:
  required:
    - gates_satisfied
    - no_stale_artifacts
    - blockers_closed
    - implementation_context_ready
    - context_plan
    - quality_baseline_ref
    - implementation_repositories_ready
    - implementation_repository_preparation_ref
    - implementation_repo
    - implementation_branch
    - ci
    - verification_commands
    - rollback_point
    - predecessor_work_unit
    - ticket_decomposition_result_ref
    - ticket_decomposition_result_status
    - vertical_slice_ticket_ref
    - vertical_slice_ticket_role
    - vertical_slice_ticket_kind
    - slice_contract_approved
    - slice_contract_persisted
    - slice_contract_current_version
    - build_architecture_checklist
    - backend_slice_contract_if_applicable
    - backend_scaffold_policy_satisfied
  ticket_formalization_validator: scripts/lib/lifecycle-transition.mjs
  requires_vertical_slice_ticket: true
  parent_ticket_as_implementation_ref: forbidden
