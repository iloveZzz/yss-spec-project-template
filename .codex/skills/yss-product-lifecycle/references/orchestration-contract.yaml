  schema: .template-spec/process/schemas/frontend-implementation-evidence.schema.json
  validator: scripts/verify-frontend-implementation-evidence
  acceptance: [ kind_verification, template_false, status_approved, no_template_placeholders, visual_baseline_identity_and_digest_match, case_results_pair_every_selected_case, no_unexplained_difference, console_warning_pass, pnpm_exit_codes_zero, independent_review_approved ]
  blocked_when: [ unexplained_visual_difference, missing_visual_evidence, typecheck_only, claimed_alignment_without_evidence ]
  on_new_impact: [ new_impacts, drift, reroute ]

unknown_impact:
  action: investigate-and-block-dependent-transition
  reason_code: impact-classification-required
  user_question: only-if-investigation-identifies-missing-real-decision-or-authorization
  full_axis_default_or_fallback: forbidden

# 每个 target 必须声明 kind、传播层级和适用条件。条件不满足时保持原状态，尤其不得把 not-applicable 改成 stale。
impact_propagation:
  wording:
    targets:
      - { kind: artifact, name: spec, level: direct, when: always }
  ui-state:
    targets:
      - { kind: artifact, name: product-design, level: direct, when: ui_impact }
      - { kind: artifact, name: prototype, level: direct, when: ui_impact }
      - { kind: gate, name: gate.product-design-approved, level: direct, when: ui_impact }
      - { kind: artifact, name: openapi-draft, level: transitive, when: api_impact }
      - { kind: gate, name: openapi-freeze, level: transitive, when: api_impact }
      - { kind: artifact, name: vertical-slice-tickets, level: transitive, when: always }
  api-schema:
    targets:
      - { kind: artifact, name: spec, level: direct, when: always }
      - { kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline }
      - { kind: artifact, name: openapi-draft, level: direct, when: api_impact }
      - { kind: gate, name: draft-review, level: transitive, when: api_impact }
      - { kind: gate, name: design-review, level: transitive, when: api_impact }
      - { kind: gate, name: openapi-freeze, level: transitive, when: api_impact }
      - { kind: artifact, name: vertical-slice-tickets, level: transitive, when: api_impact }
      - { kind: artifact, name: contract-tests, level: transitive, when: api_impact }
  state-machine:
    targets:
      - { kind: artifact, name: spec, level: direct, when: always }
      - { kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline }
      - { kind: artifact, name: product-design, level: direct, when: ui_impact }
      - { kind: artifact, name: system-architecture, level: direct, when: always }
      - { kind: artifact, name: data-architecture, level: direct, when: data_impact }
      - { kind: gate, name: gate.spec-baseline-approved, level: direct, when: always }
      - { kind: gate, name: gate.product-design-approved, level: direct, when: ui_impact }
      - { kind: artifact, name: openapi-draft, level: transitive, when: api_impact }
      - { kind: gate, name: design-review, level: transitive, when: always }
      - { kind: gate, name: openapi-freeze, level: transitive, when: api_impact }
      - { kind: artifact, name: vertical-slice-tickets, level: transitive, when: always }
      - { kind: artifact, name: test-mapping, level: transitive, when: always }
  data-model:
    targets:
      - { kind: artifact, name: spec, level: direct, when: always }
      - { kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline }
      - { kind: artifact, name: data-architecture, level: direct, when: data_impact }
      - { kind: gate, name: architecture-review, level: direct, when: data_impact }
      - { kind: artifact, name: openapi-draft, level: transitive, when: api_impact }
      - { kind: gate, name: openapi-freeze, level: transitive, when: api_impact }
      - { kind: artifact, name: vertical-slice-tickets, level: transitive, when: always }
      - { kind: artifact, name: data-migration, level: transitive, when: data_impact }
  service-boundary:
    targets:
      - { kind: artifact, name: system-architecture, level: direct, when: always }
      - { kind: artifact, name: engineering-baseline, level: direct, when: backend_impact }
      - { kind: gate, name: architecture-review, level: direct, when: always }
      - { kind: artifact, name: openapi-draft, level: transitive, when: api_impact }
      - { kind: gate, name: openapi-freeze, level: transitive, when: api_impact }
      - { kind: artifact, name: vertical-slice-tickets, level: transitive, when: always }
  nfr:
    targets:
      - { kind: artifact, name: spec, level: direct, when: always }
      - { kind: artifact, name: system-architecture, level: direct, when: always }
      - { kind: gate, name: design-review, level: direct, when: always }
      - { kind: artifact, name: vertical-slice-tickets, level: transitive, when: always }
      - { kind: artifact, name: verification-strategy, level: transitive, when: always }
  deployment:
    targets:
      - { kind: artifact, name: system-architecture, level: direct, when: always }
      - { kind: artifact, name: rollout-plan, level: direct, when: always }
      - { kind: artifact, name: rollback-plan, level: direct, when: always }
      - { kind: gate, name: design-review, level: transitive, when: always }
      - { kind: artifact, name: release-plan, level: transitive, when: always }
prototype_return_evidence:
  required: [ prototype_mode, source_handoff, prototype_asset_or_run, conclusion, updated_authoritative_asset, remaining_questions, return_handoff ]
  allowed_modes: [ matt_logic, yss_high_fidelity ]

# Matt phase boundaries are context decisions only. They never add a lifecycle state,
# alter a gate, or mutate a Ticket role.
phase_boundary:
  choices: [ continue, clear, handoff, subagent, compact ]
  precedence: [ continue, clear, handoff, subagent, compact ]
  invariants: [ does-not-force-clear, preserves-lifecycle-state ]
  evidence:
    required: [ decision, reason ]
    conditional:
      handoff: [ source_ref, destination_ref ]
      subagent: [ task_package_ref, convergence_ref ]
      compact: [ next_phase ]
  preserves: [ lifecycle.status, gate.status, ticket.role ]

external_input_pause:
  transition: pause
  reason_code: external-input-required
  reason: required decision-maker input is not available to the Agent
  required: [ questionnaire_ref, recipient_role, requested_outputs, resume_route ]
  response_required: [ response_ref, user_decisions, reclassified_impact, updated_authoritative_asset ]
  resume_requires: [ response_ref, user_decisions, reclassified_impact, updated_authoritative_asset ]

prototype_modes:
  matt_logic:
    asset: single_file_shareable_html
    branch_pattern: prototype/<name>
    required: [ prototype_mode, prototype_branch, source_handoff, prototype_asset_or_run, conclusion, updated_authoritative_asset, remaining_questions, return_handoff ]
    purpose: exploratory_primary_source
    production_delivery: false
    replaces_yss_high_fidelity: false
  yss_high_fidelity:
    asset: ant_design_v6_html
    required: [ prototype_mode, prototype_review, offline_html_verification, browser_verification, prototype_evidence, user_confirmation ]
    purpose: product_design_review
    replaces_matt_logic: false

behavioral_invariants:
  wait_what_preserves_state: true
  human_checkpoint_required_for_manual_steps: true
  diagnostics_redact_secrets: true

user_decision_evidence:
  policy_ref: .template-spec/agents/digital-human-roles.yaml#user_decision_policy
  schema_ref: .template-spec/process/schemas/user-decision.schema.json
  protocol_ref: references/user-decisions.md
  verifier: scripts/verify-user-decision
  workflow_result_fields: [ user_decisions, user_decision_not_applicable ]
  implementation_fields: [ user_decisions, slice_contract_ref, vertical_slice_ticket_ref ]
  checkpoint_carrier: human_review
  professional_review_replaced: false
  response_absent: paused-human-gate
  invalid_response: blocked
  basis_changed: revalidate_then_continue_only_with_independent_equivalence_evidence

gate_consolidation:
  source: .template-spec/process/lifecycle-registry.yaml
  check_policy: .template-spec/agents/digital-human-roles.yaml
  capability_source: .template-spec/agents/digital-human-roles.yaml#review_capabilities
  checks: automatic_or_independent_review_without_separate_user_decision
  check_failure: blocks_aggregate_gate
  plan_decision_boundary: gate.plan-approved
  readiness: computed_after_current_approved_contract_and_all_applicable_preconditions
  api_freeze: atomic_with_engineering_contract_approval_same_version
  acceptance_does_not_authorize: [ merge, push, release, production_change ]
  reuse: unchanged_approval_or_verified_approved_scope_continuation
  default_review: one_owner_one_independent_reviewer
  adjacent_reviews: one_bundle_with_explicit_per_check_outcomes
  new_approval_and_review_bundle_schema: 2
  current_validation: scripts/verify-approval-record --require-approved --checkpoint <current checkpoint>
  expected_context: consumer-checkpoint-and-review-task-never-self-filled-from-record
  extra_reviewers: uncovered_expertise_conflict_or_external_requirement
  suggestions: recorded_backlog_without_blocking
  continuation_protocol: references/user-decisions.md
  invalidation: affected_dependencies_or_authorization_change_only
  historical_gate_records: read_only_no_automatic_approval_migration
  verifier: scripts/verify-lifecycle-checkpoint

blocking_disposition:
  professional_wait: autonomously-dispatch-or-inspect-existing-task-then-wait
  verification_failure: repair-supply-evidence-or-reroute
  unknown_impact: investigate-before-review-scope-or-decision
  real_decision_or_new_authorization_missing: present-reviewable-assets-then-request-designated-human-response
  unresolved_state_conflict: investigate-and-block-dependent-actions
  independent_authorized_work: continue
  completion_conclusion_alone: no-new-pause
  question_count: minimum-actionable-independent-questions-may-be-batched

# 项目 opt-in 只选择此权威策略，不能传入自定义工作单元白名单。
execution_scopes:
  plan-to-backend:
    activation_ref: .yss-execution-scope.yaml
    validator: scripts/lib/lifecycle-execution-scope.mjs
    terminal_work_unit: work-unit.backend-delivery
    terminal_record: .yss-backend-delivery.json
    allowed_work_units:
      - work-unit.entry-triage
      - work-unit.plan-opportunity
      - work-unit.plan-requirements
      - work-unit.domain-strategy-design
      - work-unit.stage-decision
      - work-unit.spec-synthesis
      - work-unit.prototype-design-v2
      - work-unit.technical-analysis
      - work-unit.implementation-repository-preparation
      - work-unit.service-project-initialization
      - work-unit.scaffold-generation
      - work-unit.ticket-decomposition
      - work-unit.slice-implementation
      - work-unit.code-review
      - work-unit.backend-delivery
      - work-unit.business-ticket-formalization
    route_overrides:
      work-unit.code-review: [ work-unit.slice-implementation, work-unit.backend-delivery ]
      work-unit.slice-implementation: [ work-unit.code-review ]
      work-unit.backend-delivery: []
    product_ui_design: retain-all-triggered-gates
    implementation_delivery_roles: [ backend ]
    implementation_ui_impact: false
    downstream_frontend_required_when_product_ui_impact: [ owner, ticket_ref, verification_plan, target_version ]
    consumer_capabilities: [ backend-technical-design ]
    completion_claim: backend-delivery-only
    business_completion: forbidden
    release: forbidden
    resume: revalidate-current-scope-approvals-and-delivery

# Package wire IDs remain immutable; each target resolves its own executable entry.
consumer_entry_routes:
  yss-full-lifecycle:
    backend-technical-design:
      source_work_unit: work-unit.technical-design
      target_work_unit: work-unit.technical-analysis
  plan-to-backend:
    backend-technical-design:
      source_work_unit: work-unit.technical-design
      target_work_unit: work-unit.technical-analysis
  harness.backend-delivery:
    backend-technical-design:
      source_work_unit: work-unit.technical-design
      target_work_unit: work-unit.technical-design

stage_tracking:
  contract: .template-spec/process/stage-tracking.md
  schema: .template-spec/process/schemas/stage-tracking.schema.json
  verifier: scripts/stage-tracking
  configuration: tracker.lifecycle_tracking_version
  machine_state_owner: checkpoint.stage_tracking
  transition_checkpoint_ref: checkpoint_ref
  flush_on: [ stage_exit, blocked, responsibility_changed, asset_approval ]
  preserves: [ ticket-state, gate-approval, profile-scope ]
