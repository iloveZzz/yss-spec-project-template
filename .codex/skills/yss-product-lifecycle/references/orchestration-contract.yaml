    approved_project_scaffold_contract_required: true
    frontend_contract_minimum_schema_version: 4
    backend_new_generation_schema_version: 4
    backend_historical_read_only_schema_versions: [ 3 ]
    target_policy: nonexistent-or-empty
    force_overwrite: forbidden
    completion_requires: [ scaffold_manifest_ref, scaffold_verification, technical_design, data_architecture_decision, api_contract_decision, engineering_contract_approval_ref ]
    legacy_v3_requires: [ legacy_reconciliation, unchanged_mechanical_ownership, completed_technical_data_api_prerequisites, recovery_approval ]
    premature_implementation: blocked-preserve-files
  aggregate_result:
    required: [ result, current_version, projects, evidence_refs ]
