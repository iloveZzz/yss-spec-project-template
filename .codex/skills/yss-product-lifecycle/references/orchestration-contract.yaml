ticket_formalization:
  repository_predecessor: work-unit.implementation-repository-preparation
  implementation_predecessor: work-unit.ticket-decomposition
  result_ref_required: true
  result_must_be: completed
  evidence_refs_required: true
  vertical_slice_ticket:
    kind: vertical-slice-ticket
    role_before_promotion: ready-for-human
    role_for_implementation: ready-for-agent
    local_ref_pattern: '^docs/\\.scratch/[^/]+/issues/[^/]+\\.md$'
    parent_ticket_ref_forbidden: true
  slice_contract_binding:
    ticket_ref_must_equal: vertical_slice_ticket_ref
    status: approved
    persisted: true
    current_version: true
  validator:
    module: scripts/lib/lifecycle-transition.mjs
    functions: [ validateNextRoute, validateImplementationRepositoriesReady, validateTicketFormalization, validateImplementationEntry ]

implementation_repository_preparation:
  stage: stage.system-data-engineering
  work_unit: work-unit.implementation-repository-preparation
  check: check.implementation-repositories-ready
  applies_per_delivery_role: [ backend, frontend ]
  affected_role_allowed_states: [ existing-and-onboarded, initialized-and-verified ]
  unaffected_role_state: not-applicable
  not_applicable_reason_required: true
  existing_repository:
    required: [ repository_ref, project_root, repository_scope, onboarding_result ]
