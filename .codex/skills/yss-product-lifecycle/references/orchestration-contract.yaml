schema_version: 1
document_writing:
  supporting_skill: i-have-adhd
  condition: lifecycle-document-output
  scope: current-document-work-only
  dispatch: pass-condition-and-reference-to-document-owner
  reference: .template-spec/process/document-writing.md
  examples: .template-spec/templates/examples/lifecycle-writing-examples.md
  load_when: [ lifecycle-document-draft, lifecycle-document-revision, progress-or-decision-presentation ]
  dispatch_input: include-reference-for-document-work
  artifact_ownership: unchanged
  gate_and_status_semantics: unchanged

user_progress_report:
  owner: yss-product-lifecycle
  reference: references/orchestration.md#结果与友好提示
  writing_reference: .template-spec/process/document-writing.md#4-进度与会签提示
  emit_on: [ controller-return, status-request, resume, stage-boundary, blocked, human-pause, handoff, completion-assessment ]
  ordinary_progress: meaningful-changes-only
  audience: current-feature-or-authorized-task
  sources: [ current-checkpoint, stage-tracking, readable-assets, applicable-verification, lifecycle-registry, orchestration-contract ]
  required_information: [ current-stage-and-work-unit, state-basis, this-turn-outcome, next-stage-and-work-unit, entry-conditions, issues-and-blockers, registered-owner, recovery-action-and-recheck, agent-next-action, user-action-if-required, evidence-freshness ]
  structured_result_fields: [ mode, repository_mode, stage, work_unit, impacts, artifacts, gates, tickets, slices, contracts, evidence_freshness, readiness, blockers, actions_taken, next_work_unit, pause_reason, ticket_sync, git_checkpoint ]
  presentation_is: derived-explanation-never-approval-or-execution-authorization
  next_stage:
    source: current-registered-work-unit-stage-association-and-validated-route
    stage-order-as-route: forbidden
    same_stage: explain-remaining-work-in-current-stage
    unresolved_or_missing_route: not-verified-with-missing-input
    terminal: explain-verified-task-or-execution-scope-endpoint
    planned_target_is_approved_transition: false
    include: [ expected-output, applicable-entry-conditions, unmet-preconditions ]
  issues:
    classification: [ blocker, nonblocking-open-question, suggestion ]
    blocker_fields: [ problem, affected-action, source-ref, registered-owner, resolution-action, resolution-evidence, resume-verification ]
    all_material_blockers_visible: true
    unknown_owner: not-registered-never-auto-assigned
    nonblocking_items: retain-owner-resolution-time-and-receiver-or-backlog-ref
    missing_or_stale_evidence: not-verified-with-recovery-action
    no_blockers_claim: current-applicable-verification-required
    readonly_no_findings: no-detected-blockers-with-unchecked-scope
  recovery:
    authorized_agent_actions: continue-and-report-result
    dependent_actions: wait-for-real-input-or-current-valid-approval
    independent_authorized_work: continue
    human_action: explain-why-needed-source-scope-options-and-resume-condition
    commands: actual-applicable-validator-and-arguments-never-invented
  before_send: [ current-state-matches-evidence, next-route-and-entry-conditions-explained, blockers-have-actionable-recovery, owner-is-registered-or-explicitly-missing, freshness-and-unchecked-scope-visible, user-text-matches-structured-result, authorized-work-not-shifted-to-user ]
  template_source: maintenance-step-and-verification-target-never-product-stage
  invalid_identity: explain-manifest-error-and-migration-check-without-guessing-stage
  forbidden: [ skill-name-only-return, raw-json-only-user-answer, bare-blocked-without-recovery, stage-complete-from-file-existence, repeated-approval-without-new-boundary ]

backend_architecture_identity_policy:
  source: .template-spec/agents/yss-skill-registry.yaml
  generated_profiles: architecture_profiles
  existing_profiles: existing_project_profiles
  existing_evidence: [ repository-registration, engineering-baseline, existing-project-observation ]
  evidence_policy: original-ref-digest-and-current-source-verification
  delivery_preflight: scripts/preflight-delivery
  schema: .template-spec/process/schemas/backend-architecture-identity.schema.json
  required_surfaces: [ engineering-baseline, repository-registration, scaffold-manifest, slice-contract, work-unit, execution-result ]
  agreement: exact-identity-and-digest
  missing_or_drift: blocked-and-recompile
  new_profile_readiness: supported-only
service_project_initialization:
  work_unit: work-unit.service-project-initialization
  skill: yss-layered-mvc-scaffold-generator
  architecture_profile: mvc-data-analysis-v1
  context_inputs: [ context_handoff_ref, context_handoff_digest ]
  approval: current-schema-v4-scaffold-contract-with-approved-technical-and-data-design
  parent_ownership: service-references-and-handoff-only
  child_ownership: independent-git-project-instance-root-context-and-lifecycle
supported_state_schema_versions: [ 1 ]

implementation_path_policy:
  harness_layout:
    backend: apps/backend/<project>/
    frontend: apps/frontend/<project>/
  container_roots: [ apps/backend/, apps/frontend/ ]
  forbidden_roots: [ app/backend/, app/frontend/ ]
  container_roots_are_projects: false
  external_repository_uses_native_root: true
  policies: [ harness-apps-multi-project, external-repository-native, git-submodule-harness-apps ]
  git_submodule:
    repository_scope: git-submodule
    layout_policy: git-submodule-harness-apps

review_verification:
  low_medium_combined_independent_executor: true
  implementer_must_be_separate: true
  split_when: [ new_module, high_risk, responsibility_conflict, dual_control_required ]
  capability_policy_ref: .template-spec/agents/digital-human-roles.yaml

checkpoint_policy:
  strategy: consolidated
  flush_on: [ stage_exit, human_pause, handoff, implementation_entry, merge, release ]
  flush_immediately_on: [ blocked, responsibility_changed, asset_approval ]
  preserve_stage_causality: true
  required_stage_trace_fields: [ stage, upstream_refs, artifact_refs, gate_decisions, downstream_impacts ]
  project_instance_stage_exit_requires_context_reconciliation: true

modes:
  route: read_only
  audit: read_only
  orchestrate: bounded_write
  resume: rebuild_then_bounded_write

# 用户请求理解与动作选择的唯一判断合同；自然语言解释由主控完成。
request_triage:
  owner: yss-product-lifecycle
  delivery_path:
    version: 1
    enabled_profiles: [spec]
    eligible_requirements: [goal, acceptance, single_repository, current_baseline, skills, commands, rollback, known_risk]
    excluded_impacts: [data-migration, cross-repository, platform-conversion, architecture-conversion, permission-change, deployment, release, external-approval, breaking-api, unknown-api]
    active_task_bindings: preserve-governed
    single_record: markdown-with-embedded-evidence
    compatible_api: conservative-additive
    read_only_capabilities: [lifecycle.route, lifecycle.verify-daily]
    public_summary: >-
      Spec 日常任务在目标、验收、写范围、一处已知实现仓、可回滚依据、可读工程基线、验证命令与适用 YSS 技能齐全且无排除风险时，
      走需求与验收、技术技能、实现、测试、独立审查，仅更新同一 Ticket 或 PR，不生成阶段 checkpoint、正式 Slice 或多级批准。
      缺事实先调查；无法证明条件时恢复完整治理。旧 CLI 或其他 Profile 缺能力时明确不支持，不降级正式校验器。
    ordinary_record_fields: [scope, acceptance, engineering-baseline, applicable-skills, actual-tests, independent-review, rollback]
    unknown_facts: investigate-before-route
    unproven_eligibility: governed-or-needs-info
    existing_governed_task: cannot-downgrade-through-label-or-removed-binding
    unrelated_formal_assets: do-not-block-daily-task
    newly_discovered_risk: preserve-edits-and-evidence-stop-affected-work-resume-nearest-trusted-stage
    daily_sequence: [requirements-and-acceptance, yss-technical-skills, implementation, tests, independent-review]
    daily_formal_stage_packages: forbidden
    review_basis: current-diff-and-verification-evidence
    completion_requires: [current-scope, passing-actual-tests, independent-review, no-open-blocking-findings, current-api-evidence-if-applicable]
    new_decisions_and_external_actions: require-applicable-existing-authorization-boundary
    compatible_api_sequence: [oas-3.1-yaml-draft, locked-tool-validation, conservative-compatibility-and-independent-review, digest-freeze, implementation-and-contract-tests]
    compatible_api_rule: new-independent-operations-only-existing-operations-and-reachable-normalized-reference-closure-identical
    api_evidence_location: same-ticket-api-contract-review-section
    api_extra_formal_assets: not-required-for-daily
    api_evidence_fields: [tool-command, actual-exit-code, baseline-digest, candidate-digest, reviewer, conclusion, freeze-digest, contract-tests]
    api_freshness: yaml-reference-or-applicable-rule-changes-invalidate-affected-review-and-freeze
    formal_validators: unchanged-no-daily-bypass
  interpretation:
    inputs: [ current-request, conversation-context, accessible-evidence ]
    capture: [ goal, target, expected-deliverable, action-scope, facts, assumptions, unknowns ]
    multiple_intents: preserve-all-goals-and-order-dependencies
    competing_interpretations: compare-effect-on-next-action
    numeric_self_confidence: forbidden-as-routing-evidence
  clarification:
    trigger: missing-information-changes-next-action-or-authorization-scope
    before_asking: reuse-context-and-inspect-accessible-evidence
    short_request_alone: insufficient-reason-to-ask
    question: explain-gap-and-ask-minimum-actionable-information
    batch: independent-current-decision-questions
    same_safe_next_step: investigate-before-asking
    user_cannot_answer: narrow-problem-or-offer-bounded-guidance-keep-unresolved
    timeout_is_answer: false
  mode_selection:
    priority: [ explicit-current-restriction, authorized-continuation, clear-action-request, read-only-fallback ]
    explicit_read_only: route
    explicit_audit: audit
    authorized_continuation: resume
    clear_action_request: orchestrate
    clear_read_only_investigation_request: orchestrate
    unresolved_intent: route
    investigation: read-only-actions-unless-additional-scope-authorized
    mode_keywords_required: false
    continuation: revalidate-scope-evidence-and-applicable-gates
    gates_and_external_authorization: unchanged
  next_action:
    consultation: answer
    investigation: inspect-evidence
    action_request: execute-first-authorized-unblocked-work-unit
    material_ambiguity: clarify
    missing_prerequisite: explain-blocker-and-continue-independent-authorized-work
    skill_name_only_is_completion: false
  correction:
    stop: actions-dependent-on-invalid-interpretation
    preserve: still-valid-evidence-and-unrelated-user-work
    report: revised-goal-and-actions-already-taken
    existing_edits: explain-scope-and-agree-disposition-no-blind-rollback
    recompute: [ intent, scope, impacts, freshness, next-action ]
  acceptance:
    per_goal: [ requested-outcome, readable-evidence, unresolved-items ]
    mismatch: investigate-or-reroute
    unresolved_triage_is_complete: false
  presentation:
    simple: direct-answer-or-action
    complex: brief-goal-and-next-action
    material_ambiguity: targeted-question
    full_workflow_record: applicable-work-units-only
  evaluation:
    scenarios_ref: .agents/skills/yss-product-lifecycle/references/request-triage-scenarios.yaml
    dimensions: [ understanding-error, wrong-route, unnecessary-question, omitted-intent, post-triage-stall, correction-failure ]
    baseline: required-before-numeric-improvement-claim
    structural_checks_prove_model_accuracy: false

execution_efficiency:
  script_execution:
    standard_operations: reuse-installed-public-entrypoints
    entrypoint_invocation: declared-interpreter-or-executable-shebang
    missing_capability: inspect-help-and-profile-before-adding-adapter
    temporary_analysis: bounded-scope-outside-repository-no-new-authority
    diagnostic_generation: synthetic-fixtures-no-real-approval-bodies
    dependency_explanation: derive-from-current-source-and-distribution-closure
    guidance_ref: .template-spec/process/script-execution.md
  context_query:
    strategy: combine-mode-stage-work-unit-and-required-includes
    read_scope: current-work-unit-and-triggered-impacts
    reuse: already-read-unchanged-sources-within-current-task
    refresh_on: [ source-changed, new-impact, evidence-conflict, resume, handoff ]
  verification:
    scope: current-artifacts-and-triggered-contracts
    timing: after-artifact-write-before-approval-or-transition
    duplicate_check: reuse-only-within-same-boundary-and-unchanged-inputs
    unchanged_inputs: [ artifact-bytes, upstream-bytes, validator-and-schema, command-and-options, repository-root ]
    freshness_unknown: rerun
    always_revalidate_on: [ resume, handoff, implementation-entry, merge, release ]
    template_regression_suite: template-maintenance-or-explicit-regression-task
    per_work_unit_context_reconciliation: required
    skip_triggered_gates: forbidden
  recovery:
    state_source: current-checkpoint-stage-tracking-and-readable-task-results
    status_view: read-only-diagnostics-never-execution-authorization
    running_or_unknown_task: inspect-existing-task-identity-before-dispatch
    completed_task: verify-current-evidence-then-recompute-frontier
    action_completed_before_checkpoint: reconcile-actual-artifacts-before-repeating-side-effects
    changed_inputs: invalidate-affected-dependencies-and-revalidate
    missing_legacy_tracking: existing-compatibility-or-explicit-migration
    unknown_external_result: stop-duplicate-side-effect-and-report-missing-evidence
    approval: revalidate-current-decision-or-supported-continuation
  interaction:
    questions: batch-independent-current-stage-questions
    user_decision_policy_ref: .template-spec/agents/digital-human-roles.yaml#user_decision_policy
    decision_evidence_ref: references/user-decisions.md
    dependent_future_approvals: forbidden
    checkpoint_policy_ref: checkpoint_policy
  timing_evidence:
    location: existing-checkpoint-verification-evidence
    script_fields: [ command, duration_ms, exit_code ]
    distinguish: [ script-execution, agent-orchestration, human-wait ]
    unmeasured_duration: unknown

# 有效的 YSS 仓库必须先由生命周期编排器接管入口；Matt flow 只负责选择工作方式。
entry_routing:
  manifest: yss-project.yaml
  valid_modes: [ template-source, project-instance ]
  invalid_manifest:
    action: migration-check
  formal_user_entry:
    skills: [ setup-matt-pocock-skills, to-spec, to-tickets, implement ]
    action: lifecycle-validate-and-accept
    lifecycle_artifact_write: conditional-explicit-user-entry
    return_to_orchestrator: required
  template_source:
    route: template-maintenance
    forbidden_artifacts: [ product-spec, prototype, openapi, vertical-slice-tickets ]
    forbidden_flows: [ to-spec, to-tickets, implement, release, retrospective ]
    on_forbidden_flow: blocked
    block_reason: template-source-product-artifact-forbidden

# 旧 Matt Skill Result 只用于兼容读取；所有生命周期新输出使用 Workflow Execution Result。
matt_skill_result:
  status: compatibility-read-only
  may_influence_routing: false
  normalize_to: workflow-execution-result-v1
  schema_version: 1
  result_values: [ completed, blocked, needs-human, failed ]
  required: [ result, skill, evidence_refs, changed_artifacts, new_impacts, stale_candidates, next_route, blocking_signals ]
  blocking_signals: [ drift, new_impacts, violation, missing_evidence, stale_candidates ]
  completed_requires_empty: [ new_impacts, stale_candidates ]
  completed_requires_non_empty: [ evidence_refs ]
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  router_status_mapping:
    draft: completed
    blocked: blocked
    ready-for-lifecycle-review: needs-human

workflow_execution_result:
  canonical_output_schema: workflow-execution-result-v1
  accepted_input_schemas: [ workflow-execution-result-v1 ]
  legacy:
    matt-skill-result-v1:
      status: compatibility-read-only
      may_influence_routing: false
      normalize_to: workflow-execution-result-v1
      removal_target: schema_version_2
  result_values: [ completed, blocked, needs-human, failed ]
  required: [ result_schema, work_unit, workflow_reference, result, context_reconciliation, evidence_refs, changed_artifacts, new_impacts, stale_candidates, next_route, blocking_signals ]
  unavailable_skill:
    required: [ skill, provider, fallback, resolution ]
    blocking_result: blocked
  blocking_signals: [ drift, new_impacts, violation, missing_evidence, stale_candidates ]
  completed_requires_empty: [ new_impacts, stale_candidates ]
  completed_requires_non_empty: [ evidence_refs ]
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  context_reconciliation:
    schema_ref: .template-spec/process/schemas/context-reconciliation.schema.json
    validator: scripts/verify-context-reconciliation
    project-instance: { required_status: reconciled, readable_ref_required: true, transition_without_reconciliation: blocked }
    template-source: { required_status: not-applicable, reason_required: true }
    creates_gate: false
  workflow_reference:
    required: [ source, skill, invocation_mode ]
    allowed_sources: [ yss-product-lifecycle, mattpocock/skills ]
  next_route:
    validator: scripts/lib/lifecycle-transition.mjs
    function: validateNextRoute
    implementation_predecessor: work-unit.ticket-decomposition
    null_allowed_when: [ blocked, needs-human, failed, terminal_completed ]
  work_unit_requirements:
    work-unit.ticket-decomposition:
      completed_requires: [ vertical_slice_ticket_ref, ticket_decomposition_result_ref ]
    work-unit.slice-implementation:
      required: [ predecessor_work_unit, ticket_decomposition_result_ref, ticket_decomposition_result_status, vertical_slice_ticket_ref, vertical_slice_ticket_role, vertical_slice_ticket_kind, slice_contract_ticket_ref, slice_contract_status ]
      boolean_required: [ ready_for_agent, slice_contract_persisted, slice_contract_current_version ]
      validator: scripts/lib/lifecycle-transition.mjs
      function: validateImplementationEntry

task_package:
  schema_version: 1
  applies_to: all-formal-digital-human-dispatches
  schema_ref: .template-spec/process/schemas/digital-human-task-package.schema.json
  compatibility_schema_ref: .template-spec/process/schemas/subagent-task-package.schema.json
  validator: scripts/verify-digital-human-task-package
  compatibility_validator: scripts/verify-digital-human-task-package
  persistence_layout: .work/<feature>/task-packages/<task-id>.yaml
  required: [ schema_version, task_id, work_unit_id, actor_id, role_id, runtime_id, execution_state, workflow_status, skill_source, contract, inputs, objective, allowed_write_paths, forbidden_actions, expected_outputs, expected_evidence_files, verification_commands, verification_results, downstream_consumers, convergence ]
  execution_states: [ Explorer, Drafter, Worker, Reviewer, Verifier ]
  workflow_statuses: [ not-started, active, paused, resolved, failed ]
  skill_source:
    registry_ref: .template-spec/agents/digital-human-roles.yaml
    defaults: taskPackageDefaults(role_id)
    copy_required: [ core_skills, forbidden_skills ]
    review_skills: compiled-from-review-capabilities-for-readonly-review
    review_execution_states: [ Reviewer, Verifier ]
    review_skills_do_not_override: [ core_skills, forbidden_skills, allowed_write_paths ]
  review_context:
    source: current-consumer-checkpoint-and-review-task
    schema_ref: .template-spec/process/schemas/digital-human-task-package.schema.json
    capability_policy_ref: .template-spec/agents/digital-human-roles.yaml
    applicable_to: formal-v1-professional-review
    required: [ check_ids, capability_ids, candidate_ref, candidate_digest, policy_ref, policy_digest, reviewer_principal_ref, drafter_principal_ref, approval_scope, basis ]
    candidate_and_policy: current-ref-and-byte-digest
    reviewer_must_differ_from_drafter: true
    compile_skills_from: review_capabilities
    readonly_intake_v2: unchanged
  contract:
    kinds: [ lifecycle-work-unit, slice-implementation, template-maintenance ]
    required: [ kind, contract_id, contract_version, status, contract_ref ]
    status_at_dispatch: issued
    status_after_change: [ stale, blocked ]
    lifecycle-work-unit:
      required: [ lifecycle_ref ]
      forbidden: [ slice_contract_ref, maintenance_ref ]
      template_source_work_unit: forbidden
    slice-implementation:
      required: [ slice_contract_ref ]
      must_match_current_slice_contract: true
      version_mismatch: blocked
      stage: stage.vertical-slice-implementation
      parent_work_unit: work-unit.slice-implementation
      work_unit_must_be_declared_in_slice_contract: true
    template-maintenance:
      required: [ maintenance_ref ]
      forbidden: [ slice_contract_ref, lifecycle_ref ]
  dispatch:
    owner: role.lifecycle-orchestrator
    mode: orchestrator-one-to-one
    per_feature_instances: forbidden
  write_isolation:
    policy: task-package-policy
    changed_files_must_be_within_allowed_paths: true
    shared_workspace_is_not_security_boundary: true
  downstream:
    formal_channel: [ task_package_ref, contract_ref, evidence_refs, workflow_execution_result ]
    direct_chat_is_not_formal_evidence: true
  stale:
    owner: yss-product-lifecycle
    on_contract_change: [ mark_downstream_stale, remove_ready-for-agent, reroute ]
  compatibility:
    legacy_results: read-only-normalize
    schema_version: 1

# Matt user-invoked skills remain explicit user entry points. Lifecycle work units
# may prepare, validate and accept their results, but cannot invoke them or create
# their formal artifacts on their behalf.
matt_invocation_boundary:
  user_invoked_skills: [ handoff, implement, setup-matt-pocock-skills, to-spec, to-tickets, triage, wayfinder ]
  lifecycle_managed_user_entries: [ setup-matt-pocock-skills, to-spec, to-tickets, implement ]
  model_invoked_skills: [ code-review, codebase-design, diagnosing-bugs, domain-modeling, grilling, prototype, resolving-merge-conflicts, tdd, writing-for-agents, yss-research ]
  lifecycle_allowed_model_invoked_skills: [ code-review, codebase-design, diagnosing-bugs, domain-modeling, grilling, prototype, tdd, yss-research ]
  lifecycle_may_invoke_user_invoked: false
  formal_artifact_owner: explicit-user-entry
  continuous_orchestration: compatibility-prepare-and-validate-only
  direct_user_entry: lifecycle-validate-and-accept

skill_source_contract:
  lock_version: 3
  source_revisions_required: [ mattpocock/skills, iloveZzz/yss-ui ]
  adaptation_ref_required_when_effective_diff: true
  retired_shared_skills: [ yss-antd-design, yss-antdv-next-design, ask-matt, batch-grill-me, grill-me, dispatching-parallel-agents, loop-me, migrate-to-shoehorn, product-design-prototype, prototype-page-acceptance, scaffold-exercises, setup-pre-commit, setup-ts-deep-modules, teach, writing-beats, writing-fragments, writing-shape, yss-components, yss-dictionary, yss-jdbc, yss-log, yss-microapp-commit, yss-mvc-scaffold-generator, yss-mvc-design, yss-mvc-data-analysis-project-initializer, yss-backend-scaffold-parent, yss-page-module-development, yss-taskflow, yss-backend-scaffold-application, yss-backend-scaffold-domain, yss-backend-scaffold-infrastructure, yss-backend-scaffold-web, yss-backend-scaffold-adapter, yss-application-layer-reference, yss-domain-layer-reference, yss-infrastructure-layer-reference, yss-web-layer-reference ]

skill_preflight:
  command: scripts/query-lifecycle-context
  enable_flag: --check-skills
  scope: selected-work-unit-and-active-context-dependencies
  readonly: true
  statuses: [ ready, missing, blocked ]
  exit_codes: { ready: 0, missing_or_blocked: 2, invalid_input_or_execution_error: 1 }
  runtime_selection: explicit-or-single-registered-runtime
  conditional_dependencies: explicit-when-triggers
  excludes: [ compatibility-references, complete-role-skill-lists, other-work-units ]
  installation: existing-family-cli-plan-then-apply
  apply_requires: [ existing-task-authorization-covers-plan, no-conflicts ]
  after_apply: rerun-current-work-unit-preflight
  never_grants: [ skill-invocation-permission, stage-approval, ready-for-agent, completion ]
  block_current_invocation_on: [ managed-file-missing, hash-drift, projection-drift, path-conflict, runtime-unavailable, external-skill-unavailable, retired-skill, cli-snapshot-mismatch ]
  automatic_force_or_migration: forbidden

# 生命周期默认走原生工作单元；Matt user-invoked skill 仅保留为兼容入口。
lifecycle_native_entries:
  default_entry: yss-product-lifecycle
  formal_artifact_owner: yss-product-lifecycle
  user_confirmation_policy_ref: .template-spec/agents/digital-human-roles.yaml#user_decision_policy
  compatibility_entries:
    to-spec: lifecycle-validate-and-accept
    to-tickets: lifecycle-validate-and-accept
    implement: lifecycle-validate-and-accept

work_unit_routes:
  work-unit.maintenance-research:
    native: { source: yss-product-lifecycle, skill: yss-research, invocation_mode: model-invoked }
    primary_skill: yss-research
