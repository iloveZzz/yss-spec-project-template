schema_version: 1
supported_state_schema_versions: [1]

implementation_path_policy:
  harness_layout:
    backend: apps/backend/<project>/
    frontend: apps/frontend/<project>/
  container_roots: [apps/backend/, apps/frontend/]
  forbidden_roots: [app/backend/, app/frontend/]
  container_roots_are_projects: false
  external_repository_uses_native_root: true

review_verification:
  low_medium_combined_independent_executor: true
  implementer_must_be_separate: true
  split_when: [new_module, high_risk, responsibility_conflict, dual_control_required]

checkpoint_policy:
  strategy: consolidated
  flush_on: [human_pause, handoff, implementation_entry, merge, release]
  flush_immediately_on: [blocked, responsibility_changed, asset_approval]
  preserve_stage_causality: true
  required_stage_trace_fields: [stage, upstream_refs, artifact_refs, gate_decisions, downstream_impacts]

modes:
  route: read_only
  audit: read_only
  orchestrate: bounded_write
  resume: rebuild_then_bounded_write

# 有效的 YSS 仓库必须先由生命周期编排器接管入口；Matt flow 只负责选择工作方式。
entry_routing:
  manifest: yss-project.yaml
  valid_modes: [template-source, project-instance]
  invalid_manifest:
    action: migration-check
  direct_matt_entry:
    skill: ask-matt
    delegate_to: yss-product-lifecycle
    requires_valid_manifest: true
    action: navigate-only
    lifecycle_state_mutation: forbidden
    lifecycle_artifact_write: forbidden
    return_to_orchestrator: required
  formal_user_entry:
    skills: [setup-matt-pocock-skills, grill-with-docs, to-spec, to-tickets, implement]
    action: lifecycle-validate-and-accept
    lifecycle_artifact_write: conditional-explicit-user-entry
    return_to_orchestrator: required
  template_source:
    route: template-maintenance
    forbidden_artifacts: [product-spec, prototype, openapi, vertical-slice-tickets]
    forbidden_flows: [to-spec, to-tickets, implement, release, retrospective]
    on_forbidden_flow: blocked
    block_reason: template-source-product-artifact-forbidden

# 旧 Matt Skill Result 只用于兼容读取；所有生命周期新输出使用 Workflow Execution Result。
matt_skill_result:
  status: compatibility-read-only
  may_influence_routing: false
  normalize_to: workflow-execution-result-v1
  schema_version: 1
  result_values: [completed, blocked, needs-human, failed]
  required: [result, skill, evidence_refs, changed_artifacts, new_impacts, stale_candidates, next_route, blocking_signals]
  blocking_signals: [drift, new_impacts, violation, missing_evidence, stale_candidates]
  completed_requires_empty: [new_impacts, stale_candidates]
  completed_requires_non_empty: [evidence_refs]
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  router_status_mapping:
    draft: completed
    blocked: blocked
    ready-for-lifecycle-review: needs-human

workflow_execution_result:
  canonical_output_schema: workflow-execution-result-v1
  accepted_input_schemas: [workflow-execution-result-v1]
  legacy:
    matt-skill-result-v1:
      status: compatibility-read-only
      may_influence_routing: false
      normalize_to: workflow-execution-result-v1
      removal_target: schema_version_2
  required: [result_schema, work_unit, result, evidence_refs, changed_artifacts, new_impacts, stale_candidates, next_route, blocking_signals]
  workflow_reference:
    required: [source, skill, invocation_mode]
    source: mattpocock/skills

# Matt user-invoked skills remain explicit user entry points. Lifecycle work units
# may prepare, validate and accept their results, but cannot invoke them or create
# their formal artifacts on their behalf.
matt_invocation_boundary:
  user_invoked_skills: [ask-matt, batch-grill-me, grill-me, grill-with-docs, handoff, implement, improve-codebase-architecture, loop-me, setup-matt-pocock-skills, setup-ts-deep-modules, teach, to-questionnaire, to-spec, to-tickets, triage, wait-what, wayfinder, writing-beats, writing-fragments, writing-shape]
  lifecycle_managed_user_entries: [setup-matt-pocock-skills, grill-with-docs, to-spec, to-tickets, implement]
  model_invoked_skills: [grilling, domain-modeling, code-review]
  lifecycle_may_invoke_user_invoked: false
  formal_artifact_owner: explicit-user-entry
  continuous_orchestration: prepare-and-validate-only
  direct_user_entry: lifecycle-validate-and-accept

lifecycle_workflow_references:
  work-unit.discovery-interview:
    invocation_mode: model-invoked
    skills: [grilling, domain-modeling]
  work-unit.spec-synthesis:
    workflow_reference: to-spec
    invocation_mode: reference
    formal_artifact_owner: explicit-user-entry
  work-unit.ticket-decomposition:
    workflow_reference: to-tickets
    invocation_mode: reference
    formal_artifact_owner: explicit-user-entry
  work-unit.slice-implementation:
    workflow_reference: implement
    invocation_mode: reference
    formal_artifact_owner: explicit-user-entry
  work-unit.code-review:
    invocation_mode: model-invoked
    skill: code-review

flow_preconditions:
  to-spec:
    required: [grill_exit, no_unresolved_runnable_blocker]
    evidence: [user_problem, mvp_and_non_goals, success_criteria, test_seam, terminology_review]
    output_role: ready-for-human
  to-tickets:
    required: [openapi_freeze_or_no_api_impact, required_gates_satisfied, vertical_slice_scope, blocking_edges]
    output: vertical-slice-tickets
    output_role: ready-for-human
  implement:
    required: [ready_for_agent, slice_contract_approved, slice_contract_persisted, slice_contract_current_version, build_architecture_checklist, implementation_repo, implementation_branch, ci, verification_commands, rollback_point, backend_slice_contract_if_applicable, backend_scaffold_policy_satisfied]
    applies_to_single_session: true

grill_exit:
  required: [frontier_empty, facts_resolved_or_routed, decisions_confirmed, shared_understanding_confirmed, no_unresolved_runnable_blocker]
  facts_resolved_or_routed:
    technical_fact: research
    runnable_question: handoff-prototype-handoff
    external_decision: external-input-required
  user_confirmation_required: true
  output: discovery-evidence

ticket_role_transition:
  yss_active:
    to_tickets_initial_role: ready-for-human
    promotion_owner: yss-product-lifecycle
    promoted_role: ready-for-agent
    promotion_requires: ready_for_agent

review_input:
  schema_version: 1
  required: [review_mode, review_base_ref, implementation_candidate_ref, candidate_snapshot_ref, candidate_digest, spec_ref, ticket_ref, slice_contract_ref, build_architecture_checklist_ref, yss_execution_result_refs]
  nullable: [spec_ref]
  modes: [committed, worktree]
  committed:
    candidate_ref: HEAD
    diff_scope: merge-base-to-head
  worktree:
    candidate_ref: working-tree
    diff_scope: merge-base-to-working-tree
    required_coverage: [committed, staged, unstaged, untracked]
    tracked_diff_command: git diff --no-ext-diff --binary --full-index <merge-base>
    untracked_inventory_command: git ls-files -z --others --exclude-standard
    untracked_files_encoding: nul-delimited-raw-path-bytes
    untracked_diff_command: git diff --no-index --no-ext-diff --binary --full-index -- /dev/null <path>
    capture_once: true
    verify_unchanged_after_review: true
  manifest_required_by_mode:
    committed: [merge_base, tracked_diff_command, commit_list_command]
    worktree: [merge_base, tracked_diff_command, untracked_inventory_command, untracked_diff_command, untracked_files, commit_list_command]
  snapshot:
    immutable: true
    protocol: yss-worktree-candidate-v1
    digest_algorithm: sha256
    digest_framing: length-prefixed-path-and-bytes
    path_order: bytewise
    path_encoding: raw-bytes
    length_encoding: uint64-big-endian
    header_ascii: YSS-WORKTREE-CANDIDATE-V1
    terminator_byte: "0x00"
    tracked_record:
      type_byte: "0x54"
      fields: [type_byte, uint64be_content_length, binary_diff_bytes]
      source: tracked_diff_command_stdout
    untracked_record:
      type_byte: "0x55"
      fields: [type_byte, uint64be_path_length, raw_path_bytes, uint32be_file_mode, entry_kind_byte, uint64be_content_length, content_bytes]
      order: bytewise-raw-path
      entry_kinds: {regular: "0x52", symlink: "0x4c"}
      regular_content_source: file_bytes
      symlink_content_source: link_target_bytes
    unsupported_entry_action: blocked
    snapshot_artifact:
      identity: candidate_digest
      required: [candidate-manifest.yaml, tracked.diff, untracked/]
      access: immutable-read-only
    on_digest_change: blocked
    completion_requires_current_digest: true

git_authorization:
  natural_language_intent_is_authorization: false
  commit:
    requires_explicit_user_authorization: true
    required: [commit_authorized, commit_scope, commit_authorization_ref]
    authorized_value: true
    non_empty: [commit_scope, commit_authorization_ref]
    unauthorized_action: checkpoint-only
  push:
    requires_explicit_user_authorization: true
    required: [push_authorized, push_scope, push_authorization_ref]
    authorized_value: true
    non_empty: [push_scope, push_authorization_ref]
    unauthorized_action: checkpoint-only

seam_deferred_required: [risk, owner, follow_up_ticket, verification_plan, target_version_or_release_date]

backend_scaffold:
  applies_when: [backend_impact]
  scaffold_statuses: [existing, required, initialized]
  required_status: required
  sequence:
    after: [prototype_review, prototype_verification, antd_cli_verification, browser_verification, prototype_confirmation, engineering_baseline]
    before_generator: [yss-router-scaffold-contract, lifecycle-approve-scaffold-contract]
    before: [business_code_generation, implement]
  generator_skill: yss-ddd-scaffold-generator
  baseline_skill: yss-backend-scaffold-parent
  tdd_mode: controlled-generation
  contract_schema:
    schema_version: 1
    required: [contract_id, contract_version, slice_id, status, router_draft_ref, lifecycle_approval_ref, persisted_ref, current_version, implementation_repository, backend_repository, scaffold_status, target_git_url_or_output_dir, allowed_write_paths, expected_evidence_files, verification_commands, approval, work_unit, overwrite_policy]
    status_by_owner:
      router: [draft, ready-for-lifecycle-review, blocked]
      lifecycle: [approved, stale, blocked]
    approval:
      required: [approval_ref, approver, persisted_ref, current_version]
    overwrite_policy:
      required: [force_allowed, overwrite_scope, rollback_ref]
  required_inputs: [implementation_repository, backend_repository, scaffold_status, scaffold_target_confirmed, target_git_url_or_output_dir, project_name, base_package, database, scaffold_contract_file, scaffold_contract_draft, scaffold_contract_id, scaffold_contract_version, scaffold_contract_status, scaffold_contract_approved, scaffold_contract_router_draft_ref, scaffold_contract_lifecycle_approval_ref, scaffold_contract_persisted, scaffold_contract_persisted_ref, scaffold_contract_current_version]
  required_evidence: [generator_inputs, expected_files, scaffold_generation_manifest, generated_project_structure, generation_execution_result, verification_execution_result, ./mvnw_validate, ./mvnw_test, ./mvnw_package, yss_skill_execution_result]
  generation_options:
    with_example: false
    force: forbidden-by-default
    force_requires: [contract_file, contract_id, contract_version, approval_ref, router_draft_ref, persisted_ref, overwrite_scope, rollback_ref]
  forbidden_generation: [business_rules, state_machine, permission, transaction, complex_query, error_mapping, user_visible_behavior, business_example_crud, unapproved_force_overwrite]
  after_generation: [yss-backend-scaffold-parent, yss-router]
  existing_or_initialized: [baseline_evidence, wrapper_verification, yss_router_contract_recompile]
  verification:
    commands: ["./mvnw validate", "./mvnw test", "./mvnw package"]
    requires_execution: true
    printed_commands_are_not_evidence: true
    evidence: [command, exit_code, duration_ms, stdout_ref, stderr_ref, executed_at]
    failure_action: blocked
  failure_action: blocked

scaffold_work_unit_policy:
  applies_to: [scaffold_generator_output]
  scope: pre_business_code_generation
  required: [approved_scaffold_contract, primary_yss_skill, allowed_write_paths, expected_evidence_files, verification_commands]
  controlled_generation:
    allowed_for: [project_scaffold, pom, mechanical_config, wrapper]
    forbidden_when: [business_behavior, business_fields, business_state, permission, transaction, complex_query, error_mapping, business_example_crud]
  on_violation: blocked

post_scaffold_generated_code_policy:
  applies_to: [post_scaffold_backend_code]
  scope: post_scaffold_generated_code
  required: [approved_persisted_current_slice_contract, primary_yss_skill, dependency_closure, allowed_write_paths, expected_evidence_files, yss_skill_execution_result]
  business_behavior:
    tdd_mode: behavior-tdd
    impacts: [domain-rule, state-machine, transaction, permission, complex-query, error-mapping, user-visible-behavior]
  controlled_generation:
    allowed_for: [dto_boilerplate, po_boilerplate, mapstruct_generated, frozen_openapi_client, mechanical_config]
    forbidden_when: [business_behavior, business_fields, business_state, permission, transaction, complex_query, error_mapping, business_example_crud]
  on_violation: blocked

tracker:
  allowed_platforms: [local-markdown, github, gitlab]
  default_platform: local-markdown
  selection_precedence: [persisted_project_configuration, explicit_user_choice, template_default]
  remote_origin_role: code_host_only
  no_automatic_cross_platform_switch: true
  local_markdown:
    root: docs/.scratch
    legacy_roots: [.scratch, docs/requirements/tickets]
    feature_layout: [map.md, discovery, spec.md, spec-delta, parent-ticket.md, design, api, architecture, gates, verification, issues]
    primary_sync: local
    remote_ticket_required: false
    remote_mirror: optional
    default_remote_mirror: false
  remote_platforms:
    primary_sync: remote
    remote_ticket_required: true
    unavailable_fallback_root: docs/.scratch
    unavailable_fallback_marker: pending-publication
    unavailable_fallback_record: parent-ticket.md
    unavailable_fallback_fields: [tracker, publication, pending_publication_to]

setup_readiness:
  evaluation: once_per_task
  recheck_when: [tracker_changed, remote_changed, labels_changed, configuration_changed]
  missing_action: needs-human
  requested_skill: setup-matt-pocock-skills
  resume_route: setup-readiness
  preserves: [lifecycle.status, gate.status, ticket.role]
  lifecycle_may_invoke_setup: false
  legacy_artifacts_detected:
    action: migration-check
    setup: forbidden
    write: paused
  states: [ready, missing, conflict, degraded, not-applicable]
  evidence: [platform, label_check, domain_layout, artifact_root, migration_ref]
  semantics:
    ready: [tracker_compatible, labels_verified, domain_layout_verified, artifact_root_verified]
    missing: [required_configuration_absent, legacy_artifacts_detected_requires_migration]
    conflict: [persistent_configuration_or_tracker_conflict, canonical_and_legacy_artifacts]
    degraded: [target_platform_unavailable]
    not-applicable: [template_source_validate_only]
  template_source:
    action: validate-only

lifecycle_owned_work_units: [release, retrospective]
lifecycle_work_unit_requirements:
  release: [fresh_verification, release_or_rollback_evidence, independent_review]
  retrospective: [fresh_verification, retrospective_record, governance_reflow_decision]

wayfinder_completion:
  required: [no_open_children, no_open_blocked_or_claimed_children, no_fog, destination_clear]

ready_for_agent:
  required: [gates_satisfied, no_stale_artifacts, blockers_closed, implementation_context_ready, implementation_repo, implementation_branch, ci, verification_commands, rollback_point, slice_contract_approved, slice_contract_persisted, slice_contract_current_version, build_architecture_checklist, backend_slice_contract_if_applicable, backend_scaffold_policy_satisfied]

unknown_impact:
  action: pause
  reason_code: impact-classification-required

# 每个 target 必须声明 kind、传播层级和适用条件。条件不满足时保持原状态，尤其不得把 not-applicable 改成 stale。
impact_propagation:
  wording:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
  ui-state:
    targets:
      - {kind: artifact, name: product-design, level: direct, when: ui_impact}
      - {kind: artifact, name: prototype, level: direct, when: ui_impact}
      - {kind: gate, name: requirement-freeze, level: direct, when: ui_impact}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
  api-schema:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: openapi-draft, level: direct, when: api_impact}
      - {kind: gate, name: draft-review, level: transitive, when: api_impact}
      - {kind: gate, name: design-review, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: api_impact}
      - {kind: artifact, name: contract-tests, level: transitive, when: api_impact}
  state-machine:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: product-design, level: direct, when: ui_impact}
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: data-architecture, level: direct, when: data_impact}
      - {kind: gate, name: requirement-freeze, level: direct, when: always}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: design-review, level: transitive, when: always}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: test-mapping, level: transitive, when: always}
  data-model:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: data-architecture, level: direct, when: data_impact}
      - {kind: gate, name: architecture-review, level: direct, when: data_impact}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: data-migration, level: transitive, when: data_impact}
  service-boundary:
    targets:
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: engineering-baseline, level: direct, when: backend_impact}
      - {kind: gate, name: architecture-review, level: direct, when: always}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
  nfr:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: gate, name: design-review, level: direct, when: always}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: verification-strategy, level: transitive, when: always}
  deployment:
    targets:
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: rollout-plan, level: direct, when: always}
      - {kind: artifact, name: rollback-plan, level: direct, when: always}
      - {kind: gate, name: design-review, level: transitive, when: always}
      - {kind: artifact, name: release-plan, level: transitive, when: always}
prototype_return_evidence:
  required: [prototype_mode, source_handoff, prototype_asset_or_run, conclusion, updated_authoritative_asset, remaining_questions, return_handoff]
  allowed_modes: [matt_logic, yss_high_fidelity]

# Matt phase boundaries are context decisions only. They never add a lifecycle state,
# alter a gate, or mutate a Ticket role.
phase_boundary:
  choices: [continue, clear, handoff, subagent, compact]
  precedence: [continue, clear, handoff, subagent, compact]
  invariants: [does-not-force-clear, preserves-lifecycle-state]
  evidence:
    required: [decision, reason]
    conditional:
      handoff: [source_ref, destination_ref]
      subagent: [task_package_ref, convergence_ref]
      compact: [next_phase]
  preserves: [lifecycle.status, gate.status, ticket.role]

external_input_pause:
  transition: pause
  reason_code: external-input-required
  reason: required decision-maker input is not available to the Agent
  required: [questionnaire_ref, recipient_role, requested_outputs, resume_route]
  response_required: [response_ref, reclassified_impact, updated_authoritative_asset]
  resume_requires: [response_ref, reclassified_impact, updated_authoritative_asset]

prototype_modes:
  matt_logic:
    asset: single_file_shareable_html
    branch_pattern: prototype/<name>
    required: [prototype_mode, prototype_branch, source_handoff, prototype_asset_or_run, conclusion, updated_authoritative_asset, remaining_questions, return_handoff]
    purpose: exploratory_primary_source
    production_delivery: false
    replaces_yss_high_fidelity: false
  yss_high_fidelity:
    asset: ant_design_v6_html
    required: [prototype_mode, prototype_review, antd_cli_verification, browser_verification, prototype_evidence, user_confirmation]
    purpose: product_design_review
    replaces_matt_logic: false

behavioral_invariants:
  wait_what_preserves_state: true
  human_checkpoint_required_for_manual_steps: true
  diagnostics_redact_secrets: true
