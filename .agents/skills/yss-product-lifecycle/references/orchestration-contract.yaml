schema_version: 1
supported_state_schema_versions: [1]

review_verification:
  low_medium_combined_independent_executor: true
  implementer_must_be_separate: true
  split_when: [new_module, high_risk, responsibility_conflict, dual_control_required]

checkpoint_policy:
  strategy: consolidated
  flush_on: [human_pause, handoff, implementation_entry, merge, release]
  flush_immediately_on: [blocked, responsibility_changed, asset_approval]
  preserve_stage_causality: true
  required_stage_trace_fields: [stage, upstream_refs, artifact_refs, gate_decisions, downstream_impacts]

modes:
  route: read_only
  audit: read_only
  orchestrate: bounded_write
  resume: rebuild_then_bounded_write

# 有效的 YSS 仓库必须先由生命周期编排器接管入口；Matt flow 只负责选择工作方式。
entry_routing:
  manifest: yss-project.yaml
  valid_modes: [template-source, project-instance]
  invalid_manifest:
    action: migration-check
  direct_matt_entry:
    delegate_to: yss-product-lifecycle
    requires_valid_manifest: true
  template_source:
    route: template-maintenance
    forbidden_artifacts: [product-spec, prototype, openapi, vertical-slice-tickets]
    forbidden_flows: [to-spec, to-tickets, implement, release, retrospective]
    on_forbidden_flow: blocked
    block_reason: template-source-product-artifact-forbidden

# Matt skill 的自然语言输出必须先归一化，再由生命周期编排器决定是否推进。
matt_skill_result:
  schema_version: 1
  result_values: [completed, blocked, needs-human, failed]
  required: [result, skill, evidence_refs, changed_artifacts, new_impacts, stale_candidates, next_route, blocking_signals]
  blocking_signals: [drift, new_impacts, violation, missing_evidence, stale_candidates]
  completed_requires_empty: [new_impacts, stale_candidates]
  completed_requires_non_empty: [evidence_refs]
  completed_requires_readable_evidence_refs: true
  evidence_ref_validation: readable-or-resolvable
  completed_requires_no_blocking_signals: true
  router_status_mapping:
    draft: completed
    blocked: blocked
    ready-for-lifecycle-review: needs-human

flow_preconditions:
  to-spec:
    required: [grill_exit, no_unresolved_runnable_blocker]
    evidence: [user_problem, mvp_and_non_goals, success_criteria, test_seam, terminology_review]
    output_role: ready-for-human
  to-tickets:
    required: [openapi_freeze_or_no_api_impact, required_gates_satisfied, vertical_slice_scope, blocking_edges]
    output: vertical-slice-tickets
  implement:
    required: [ready_for_agent, slice_contract_approved, slice_contract_persisted, slice_contract_current_version, build_architecture_checklist, implementation_repo, implementation_branch, ci, verification_commands, rollback_point, backend_slice_contract_if_applicable]
    applies_to_single_session: true

setup_readiness:
  evaluation: once_per_task
  recheck_when: [tracker_changed, remote_changed, labels_changed, configuration_changed]
  states: [ready, missing, conflict, degraded, not-applicable]
  evidence: [platform, label_check, domain_layout, migration_ref]
  semantics:
    ready: [tracker_compatible, labels_verified, domain_layout_verified]
    missing: [required_configuration_absent]
    conflict: [persistent_configuration_or_tracker_conflict]
    degraded: [target_platform_unavailable]
    not-applicable: [template_source_validate_only]
  template_source:
    action: validate-only

lifecycle_owned_work_units: [release, retrospective]
lifecycle_work_unit_requirements:
  release: [fresh_verification, release_or_rollback_evidence, independent_review]
  retrospective: [fresh_verification, retrospective_record, governance_reflow_decision]

wayfinder_completion:
  required: [no_open_children, no_open_blocked_or_claimed_children, no_fog, destination_clear]

ready_for_agent:
  required: [gates_satisfied, no_stale_artifacts, blockers_closed, implementation_context_ready, implementation_repo, implementation_branch, ci, verification_commands, rollback_point, slice_contract_approved, slice_contract_persisted, slice_contract_current_version, build_architecture_checklist, backend_slice_contract_if_applicable]

unknown_impact:
  action: pause
  reason_code: impact-classification-required

# 每个 target 必须声明 kind、传播层级和适用条件。条件不满足时保持原状态，尤其不得把 not-applicable 改成 stale。
impact_propagation:
  wording:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
  ui-state:
    targets:
      - {kind: artifact, name: product-design, level: direct, when: ui_impact}
      - {kind: artifact, name: prototype, level: direct, when: ui_impact}
      - {kind: gate, name: requirement-freeze, level: direct, when: ui_impact}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
  permission:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: product-design, level: direct, when: ui_impact}
      - {kind: gate, name: requirement-freeze, level: direct, when: always}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: draft-review, level: transitive, when: api_impact}
      - {kind: gate, name: design-review, level: transitive, when: always}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: implementation-contract, level: transitive, when: always}
      - {kind: artifact, name: test-mapping, level: transitive, when: always}
  api-schema:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: openapi-draft, level: direct, when: api_impact}
      - {kind: gate, name: draft-review, level: transitive, when: api_impact}
      - {kind: gate, name: design-review, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: api_impact}
      - {kind: artifact, name: contract-tests, level: transitive, when: api_impact}
  state-machine:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: product-design, level: direct, when: ui_impact}
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: data-architecture, level: direct, when: data_impact}
      - {kind: gate, name: requirement-freeze, level: direct, when: always}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: design-review, level: transitive, when: always}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: test-mapping, level: transitive, when: always}
  data-model:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: data-architecture, level: direct, when: data_impact}
      - {kind: gate, name: architecture-review, level: direct, when: data_impact}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: data-migration, level: transitive, when: data_impact}
  service-boundary:
    targets:
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: engineering-baseline, level: direct, when: backend_impact}
      - {kind: gate, name: architecture-review, level: direct, when: always}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
  nfr:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: gate, name: design-review, level: direct, when: always}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: verification-strategy, level: transitive, when: always}
  deployment:
    targets:
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: rollout-plan, level: direct, when: always}
      - {kind: artifact, name: rollback-plan, level: direct, when: always}
      - {kind: gate, name: design-review, level: transitive, when: always}
      - {kind: artifact, name: release-plan, level: transitive, when: always}
  security:
    targets:
      - {kind: artifact, name: spec, level: direct, when: always}
      - {kind: artifact, name: spec-delta, level: direct, when: existing_frozen_baseline}
      - {kind: artifact, name: product-design, level: direct, when: ui_impact}
      - {kind: artifact, name: system-architecture, level: direct, when: always}
      - {kind: artifact, name: data-architecture, level: direct, when: data_impact}
      - {kind: gate, name: requirement-freeze, level: direct, when: always}
      - {kind: gate, name: architecture-review, level: direct, when: always}
      - {kind: artifact, name: openapi-draft, level: transitive, when: api_impact}
      - {kind: gate, name: openapi-freeze, level: transitive, when: api_impact}
      - {kind: artifact, name: vertical-slice-tickets, level: transitive, when: always}
      - {kind: artifact, name: release-plan, level: transitive, when: always}

prototype_return_evidence:
  required: [prototype_mode, source_handoff, prototype_asset_or_run, conclusion, updated_authoritative_asset, remaining_questions, return_handoff]
  allowed_modes: [matt_logic, yss_high_fidelity]

# Matt phase boundaries are context decisions only. They never add a lifecycle state,
# alter a gate, or mutate a Ticket role.
phase_boundary:
  choices: [continue, clear, handoff, subagent, compact]
  precedence: [continue, clear, handoff, subagent, compact]
  invariants: [does-not-force-clear, preserves-lifecycle-state]
  evidence:
    required: [decision, reason]
    conditional:
      handoff: [source_ref, destination_ref]
      subagent: [task_package_ref, convergence_ref]
      compact: [next_phase]
  preserves: [lifecycle.status, gate.status, ticket.role]

external_input_pause:
  transition: pause
  reason_code: external-input-required
  reason: required decision-maker input is not available to the Agent
  required: [questionnaire_ref, recipient_role, requested_outputs, resume_route]
  response_required: [response_ref, reclassified_impact, updated_authoritative_asset]
  resume_requires: [response_ref, reclassified_impact, updated_authoritative_asset]

prototype_modes:
  matt_logic:
    asset: single_file_shareable_html
    branch_pattern: prototype/<name>
    required: [prototype_mode, prototype_branch, source_handoff, prototype_asset_or_run, conclusion, updated_authoritative_asset, remaining_questions, return_handoff]
    purpose: exploratory_primary_source
    production_delivery: false
    replaces_yss_high_fidelity: false
  yss_high_fidelity:
    asset: ant_design_v6_html
    required: [prototype_mode, prototype_review, antd_cli_verification, user_confirmation]
    purpose: product_design_review
    replaces_matt_logic: false

behavioral_invariants:
  wait_what_preserves_state: true
  wizard_human_only: true
  diagnostics_redact_secrets: true
